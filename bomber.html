<style>

  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;--body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}
*{box-sizing:border-box}

.wrap{width:100%;max-width:900px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(44px,10vw,96px);line-height:.95;margin:0;color:var(--paper);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);transform:rotate(-3deg);text-wrap:balance}

.mini{display:flex;gap:6px}

.opt b{width:7.5em;flex:none}

#touch[hidden]{display:none}
#touch button{position:fixed;pointer-events:auto;width:66px;height:66px;border-radius:14px;border:3px solid var(--ink);background:rgba(255,250,240,.78);font:800 22px var(--body);color:var(--ink);touch-action:none}
#touch .u{left:86px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 140px)}
#touch .d{left:86px;bottom:max(14px,env(safe-area-inset-bottom))}
#touch .l{left:14px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px)}

#touch button.p{transform:scale(.92);background:var(--sun)}

<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="touch" hidden><button class="u" data-k="u">▲</button><button class="l" data-k="l">◀</button><button class="r" data-k="r">▶</button><button class="d" data-k="d">▼</button><button class="a" data-k="a">ボム</button><button class="m" data-k="m">≡</button></div>
<script>
'use strict';
// ============ きほん ============
const cv=document.getElementById('c'),cx=cv.getContext('2d'),ui=document.getElementById('ui'),touchEl=document.getElementById('touch');
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let s=seed>>>0||1;return()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ============ 音 ============
const AU={ctx:null,vol:.5*NetDB.vol.get()};
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}try{AU.ctx=new(window.AudioContext||window.webkitAudioContext)();AU.g=AU.ctx.createGain();AU.g.gain.value=AU.vol;AU.g.connect(AU.ctx.destination);
  const n=AU.ctx.sampleRate*.6,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.noise=b;}catch(e){}}
function tone(f,d,type,v,slide,delay){const a=AU.ctx;if(!a)return;const t0=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  g.gain.setValueAtTime(v||.18,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AU.g);o.start(t0);o.stop(t0+d);}
function boomSnd(v){const a=AU.ctx;if(!a||!AU.noise)return;const s=a.createBufferSource();s.buffer=AU.noise;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(1400,a.currentTime);f.frequency.exponentialRampToValueAtTime(90,a.currentTime+.5);
  const g=a.createGain();g.gain.setValueAtTime(.55*(v||1),a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.55);s.connect(f);f.connect(g);g.connect(AU.g);s.start();s.stop(a.currentTime+.6);tone(70,.35,'sine',.35*(v||1),35);}
let lastBoom=0;
function sfx(n){if(!AU.ctx)return;({ui:()=>tone(660,.05,'square',.07),ok:()=>{tone(523,.07,'square',.1);tone(784,.1,'square',.1,0,.06);},bad:()=>tone(160,.15,'square',.12),
  place:()=>tone(180,.09,'triangle',.25,120),boom:()=>{const n=performance.now();if(n-lastBoom<60)return;lastBoom=n;boomSnd(1);},item:()=>{tone(784,.06,'square',.1);tone(1046,.06,'square',.1,0,.06);tone(1318,.1,'square',.1,0,.12);},
  kick:()=>tone(240,.08,'square',.14,500),die:()=>{tone(520,.5,'sawtooth',.16,70);},count:()=>tone(660,.12,'square',.12),go:()=>{tone(880,.25,'square',.14);},
  win:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.18,'square',.12,0,i*.12));},press:()=>tone(110,.08,'square',.12,70),throw:()=>tone(500,.15,'triangle',.12,900),warp:()=>tone(300,.25,'sine',.15,1200)}[n]||(()=>{}))();}
// ============ データ ============
const W=15,H=13,TICK=20,FUSE=125,FLAME=24,KSTEP=4,ROUND_S=120,SD_S=88,SD_STEP=9;
const ROUND_TK=ROUND_S*1000/TICK,SD_TK=SD_S*1000/TICK;
const T_HARD=1,T_SOFT=2,T_PRESS=3,T_BURN=4;
const DX=[0,0,1,0,-1],DY=[0,-1,0,1,0];// 1上 2右 3下 4左
const IT={fire:1,bomb:2,speed:3,kick:4,pierce:5,max:6};
const IT_NAME={1:'ひのこ（火力＋1）',2:'ボム（ボム＋1）',3:'くつ（はやく）',4:'キック',5:'つらぬきボム',6:'フルパワー'};
const CHARS=[
  {name:'ポンタ',kind:'tanuki',c:'#b98a5a',c2:'#5b4130',acc:'#f3e2c4'},
  {name:'ミミ',kind:'rabbit',c:'#f4f0ea',c2:'#e89aa8',acc:'#ffffff'},
  {name:'ケロ',kind:'frog',c:'#5dbb63',c2:'#2e7d3a',acc:'#f2f7c8'},
  {name:'ペン',kind:'penguin',c:'#2d3654',c2:'#ff9f2e',acc:'#ffffff'},
  {name:'モグ',kind:'mole',c:'#7a6a8e',c2:'#ff8fa3',acc:'#d8cfe4'},
  {name:'コン',kind:'fox',c:'#f08a3c',c2:'#ffffff',acc:'#3a2a20'}];
const PCOL=['#e2483b','#2f7fe0','#2aa55a','#e9a21b','#9b59d0','#6d6d6d'];
const SPAWN=[[1,1],[13,11],[13,1],[1,11]];
// ステージ：見た目（床・かたいブロック・こわせるブロック）と、配置のちがい
const STAGES=[
  {name:'はらっぱ',desc:'ふつうの広場',fl:['#8fcf6a','#84c560'],hard:['#9aa3ad','#6f7882'],soft:'brick',dens:.72},
  {name:'まんなか広場',desc:'まんなかが ひらけている',fl:['#e9cf95','#e1c487'],hard:['#d0805a','#a35a3a'],soft:'crate',dens:.74,open:[5,4,9,8]},
  {name:'ワープ通路',desc:'ワープ穴で 反対がわへ',fl:['#a99bd6','#9f90cf'],hard:['#5b5480','#423b63'],soft:'crystal',dens:.7,warps:[[3,6,11,6],[7,1,7,11]]},
  {name:'ゆきのとりで',desc:'かべが多くて せまい',fl:['#e6f1fa','#dbe9f5'],hard:['#8fb6d6','#5f8db5'],soft:'snow',dens:.66,walls:[[4,3],[10,3],[4,9],[10,9],[3,6],[11,6],[7,4],[7,8]]},
  {name:'ボムまつり',desc:'さいしょから 火力3・ボム3',fl:['#f0b48a','#eaa97c'],hard:['#8a5a8c','#653f68'],soft:'brick',dens:.5,rich:1}];
const ITEM_W=[[IT.fire,30],[IT.bomb,30],[IT.speed,20],[IT.kick,9],[IT.pierce,5],[IT.max,4]];
function spiralCells(){const out=[];let x0=1,y0=1,x1=W-2,y1=H-2;while(x0<=x1&&y0<=y1){for(let x=x0;x<=x1;x++)out.push(y0*W+x);for(let y=y0+1;y<=y1;y++)out.push(y*W+x1);if(y1>y0)for(let x=x1-1;x>=x0;x--)out.push(y1*W+x);if(x1>x0)for(let y=y1-1;y>y0;y--)out.push(y*W+x0);x0++;y0++;x1--;y1--;}return out;}
const SPIRAL=spiralCells();
function buildMap(si,seed){const st=STAGES[si]||STAGES[0];const R=rng(seed);const g=new Uint8Array(W*H),it=new Uint8Array(W*H);const keep=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=y*W+x;if(x===0||y===0||x===W-1||y===H-1||(x%2===0&&y%2===0))g[c]=T_HARD;}
  if(st.walls)for(const[x,y]of st.walls)g[y*W+x]=T_HARD;
  for(const[sx,sy]of SPAWN){for(const[dx,dy]of[[0,0],[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2]]){const x=sx+dx,y=sy+dy;if(x>0&&y>0&&x<W-1&&y<H-1&&(Math.abs(dx)+Math.abs(dy)<2||R()<.0))keep[y*W+x]=1;}}
  if(st.open){const[a,b,c2,d]=st.open;for(let y=b;y<=d;y++)for(let x=a;x<=c2;x++)keep[y*W+x]=1;}
  if(st.warps)for(const w of st.warps){keep[w[1]*W+w[0]]=1;keep[w[3]*W+w[2]]=1;for(const k of[1,2,3,4]){keep[(w[1]+DY[k])*W+w[0]+DX[k]]=1;keep[(w[3]+DY[k])*W+w[2]+DX[k]]=1;}}
  const tot=ITEM_W.reduce((a,b)=>a+b[1],0);
  for(let c=0;c<W*H;c++){if(g[c]||keep[c])continue;if(R()<st.dens){g[c]=T_SOFT;if(R()<.5){let r=R()*tot;for(const[k,w]of ITEM_W){r-=w;if(r<=0){it[c]=k;break;}}}}else R(),R();}
  // 端末ごとの g と it を同じにするため、乱数の使い方は固定
  return{g,it,warps:st.warps||[]};}
// ============ 入力 ============
const QS=new URLSearchParams(location.search);const NET_LOCAL=NetDB.LOCAL;
let MEMDB=null;function dbTree(){return NetDB.mem();}function dbOnline(){return NetDB.open('bomber');}
const DEV=(()=>{let p='';try{p=sessionStorage.getItem('bb_dev')||'';}catch(e){}if(!p){p='d'+Math.random().toString(36).slice(2,8);try{sessionStorage.setItem('bb_dev',p);}catch(e){}}return p;})();
const keys={},keyHit={};let touchK={},touchHit={};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.offsetParent!==null)return;keys[e.code]=true;if(!e.repeat)keyHit[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();audioInit();});
addEventListener('keyup',e=>{keys[e.code]=false;});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('pointerdown',()=>audioInit());
touchEl.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();audioInit();if(k==='m'){if(G.active&&!G.menu&&S.meta&&S.meta.st==='game')pauseMenu();return;}touchK[k]=1;touchHit[k]=1;b.classList.add('p');},off=e=>{e.preventDefault();touchK[k]=0;b.classList.remove('p');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});
const KB={kb1:{l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],a:['Space','KeyF'],st:['Escape','KeyP']},
  kb2:{l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],a:['Enter','Slash','Numpad0','ShiftRight'],st:['Backspace']}};
const DEVNAME={kb1:'キーボード左（WASD・Space）',kb2:'キーボード右（矢印・Enter）',touch:'タッチ',any:'この端末'};
let devs={},devPrev={};
// 1人だけキーボードのときは WASD と 矢印の どちらでも動ける
function kbMerged(){return G.active&&!Object.values(S.local).some(l=>l.dev==='kb2');}
function readDevs(){const out={};const any=k=>k.some(c=>keys[c]||keyHit[c]);const hit=k=>k.some(c=>keyHit[c]);const mg=kbMerged();
  for(const id in KB){let m=KB[id];if(id==='kb1'&&mg){const m2=KB.kb2;m={l:m.l.concat(m2.l),r:m.r.concat(m2.r),u:m.u.concat(m2.u),d:m.d.concat(m2.d),a:m.a.concat(m2.a),st:m.st.concat(m2.st)};}
    out[id]={x:(any(m.r)?1:0)-(any(m.l)?1:0),y:(any(m.d)?1:0)-(any(m.u)?1:0),a:any(m.a),st:any(m.st),ha:hit(m.a),hst:hit(m.st),lr:m};}
  const pads=navigator.getGamepads?navigator.getGamepads():[];for(const p of pads){if(!p||!p.connected)continue;const ax=Math.abs(p.axes[0])>.4?p.axes[0]:0,ay=Math.abs(p.axes[1])>.4?p.axes[1]:0;const B=i=>p.buttons[i]&&p.buttons[i].pressed;
    let x=clamp((B(15)?1:0)-(B(14)?1:0),-1,1),y=clamp((B(13)?1:0)-(B(12)?1:0),-1,1);if(!x&&!y){if(Math.abs(ax)>Math.abs(ay))x=Math.sign(ax);else if(ay)y=Math.sign(ay);}
    out['gp'+p.index]={x,y,a:B(0)||B(1),b:B(2)||B(3),st:B(9)};}
  out.touch={x:(touchK.r||touchHit.r?1:0)-(touchK.l||touchHit.l?1:0),y:(touchK.d||touchHit.d?1:0)-(touchK.u||touchHit.u?1:0),a:!!(touchK.a||touchHit.a),ha:!!touchHit.a,st:false};
  const all=Object.values(out);out.any={x:clamp(all.reduce((s,d)=>s+d.x,0),-1,1),y:clamp(all.reduce((s,d)=>s+d.y,0),-1,1),a:all.some(d=>d.a),st:all.some(d=>d.st),ha:all.some(d=>d.ha),hst:all.some(d=>d.hst)};
  for(const id in out){const d=out[id],p=devPrev[id]||{};if(d.ha&&p.a)p.a=false;if(d.hst&&p.st)p.st=false;d.pa=d.a&&!p.a;d.pst=d.st&&!p.st;
    // 最後に押した向きを優先（ななめ押しで 曲がり角を 曲がりやすく）
    d.lx=d.x;d.ly=d.y;if(d.x&&d.y){d.pref=(p.x!==d.x)?'x':(p.y!==d.y)?'y':(p.pref||'x');}else d.pref=d.x?'x':'y';
    const rep=(k,v)=>{const t=(p[k+'T']||0);if(v===0){d[k+'T']=0;return 0;}if(Math.sign(v)!==Math.sign(p[k]||0)){d[k+'T']=.28;return v;}d[k+'T']=t-1/60;if(d[k+'T']<=0){d[k+'T']=.07;return v;}return 0;};
    d.px=rep('x',d.x);d.py=rep('y',d.y);}
  for(const k in keyHit)delete keyHit[k];for(const k in touchHit)delete touchHit[k];devPrev=out;devs=out;return out;}
// ============ 部屋 ============
const S={db:null,code:'',online:false,host:false,meta:null,players:{},states:{},buf:{},L:[],seenMeta:false,name:'',err:'',local:{},rooms:[]};
S.name=NetDB.name.get()||'プレイヤー'+(100+Math.floor(Math.random()*900));
const rp=x=>'r/'+S.code+(x?'/'+x:'');
function owns(pid){return!!S.local[pid]||(S.host&&pid[0]==='c');}
function offAll(){for(const f of S.L)try{f();}catch(e){}S.L=[];if(G.evOff){G.evOff();G.evOff=null;}}
function openRoom(db,code,asHost){offAll();S.db=db;S.code=code;S.host=asHost;S.meta=null;S.players={};S.states={};S.buf={};S.local={};S.seenMeta=false;S.online=db.kind!=='mem';G.n=-1;
  if(asHost){if(S.online)NetDB.hub.report('bomber',code);db.set(rp('m'),{host:DEV,hostName:S.name,st:'lobby',stage:0,target:3,cpu:S.online?0:3,lv:1,ghost:1,wins:{},t:db.now()});db.dis(rp('m'));db.dis(rp('e'));db.dis(rp('s'));
    if(S.online)S.pub=NetDB.lobby.publish('bomber',code,{host:S.name,n:0,st:'lobby'});}
  S.L.push(db.on(rp('m'),'value',(k,v)=>onMeta(v)));
  S.L.push(db.on(rp('p'),'value',(k,v)=>{S.players=v||{};if(S.host&&S.pub)S.pub.update({n:Object.values(S.players).filter(p=>!p.cpu).length});if(scr==='lobby')lobbyScreen();}));
  const st=(pid,v)=>{if(!v||owns(pid))return;S.states[pid]=v;const B=S.buf[pid]||(S.buf[pid]=[]);if(!B.length||B[B.length-1].t<v.t){B.push(v);if(B.length>20)B.shift();}};
  S.L.push(db.on(rp('s'),'child_added',st),db.on(rp('s'),'child_changed',st));
  if(!asHost)setTimeout(()=>{if(S.code===code&&!S.seenMeta&&scr==='lobby')leaveRoom('部屋「'+code+'」が見つかりません。コードを確かめてください。');},5000);

function onlineScreen(){scr='online';G.active=false;touchEl.hidden=true;const db=dbOnline();const q=QS.get('room');

  if(db&&!S.roomsOff){S.roomsOff=NetDB.lobby.watch(l=>{const prev=JSON.stringify(S.rooms);S.rooms=l.filter(r=>r.g==='bomber');if(prev!==JSON.stringify(S.rooms)&&scr==='online'&&document.activeElement.tagName!=='INPUT')onlineScreen();});}

function lobbyScreen(){scr='lobby';G.active=false;touchEl.hidden=true;const m=S.meta;const db=S.db;if(!db)return;const host=S.host;
  const ps=Object.entries(S.players).filter(([,p])=>!p.cpu).sort((a,b)=>(a[1].t||0)-(b[1].t||0)).slice(0,4);const cpuN=m?clamp(m.cpu,0,4-ps.length):0;

  const url=location.origin+location.pathname+'?room='+S.code+(NET_LOCAL?'&np=local':'');const touch=matchMedia('(pointer:coarse)').matches;

      slots.push(`<div class="slot" style="border-color:${PCOL[i]}"><b>${esc(p.name)}</b><span class="s">${mine?esc(DEVNAME[S.local[pid].dev]||'コントローラー'):'（ほかの端末）'}</span><canvas width="192" height="192" data-ch="${p.char||0}"></canvas><span>${ch.name}</span>
        ${mine?`<div class="mini"><button data-c="${pid}" data-d="-1">◀</button><button data-c="${pid}" data-d="1">▶</button></div><div class="mini"><button data-ok="${pid}" style="${p.ok?'background:#2aa55a;color:#fff':''}">${p.ok?'準備OK！':'準備OK'}</button><button data-rm="${pid}">ぬける</button></div>`:`<span class="s">${p.ok?'準備OK！':'えらんでいます…'}</span>`}</div>`);}
    else if(i-ps.length<cpuN)slots.push(`<div class="slot"><b>COM${i-ps.length+1}</b><span class="s">コンピューター（${['よわい','ふつう','つよい'][m.lv||0]}）</span><canvas width="192" height="192" data-ch="${(i+2)%CHARS.length}" style="opacity:.6"></canvas></div>`);
    else slots.push(`<div class="slot empty">あき<br><small>参加：Space／Enter／コントローラーA</small></div>`);}
  const stg=m?m.stage:0;const dis=host?'':'disabled';
  h(`<div class="wrap"><h2>${S.online?`部屋 <span style="color:var(--sun);letter-spacing:.1em">${esc(S.code)}</span>`:'1台であそぶ'}</h2>

    <div class="row opt" style="margin-top:10px"><b>やられた後</b>${[[1,'外から ボムを なげる'],[0,'みているだけ']].map(([v,l])=>`<button class="btn${m&&(m.ghost?1:0)===v?' on':''}" data-nav data-gh="${v}" ${dis}>${l}</button>`).join('')}</div></div>
   ${m&&m.st!=='lobby'?`<p class="hint" style="color:var(--sun)">いまゲーム中です。終わると次から参加できます。</p>`:''}
   <div class="row">${host?`<button class="btn big${canGo?' on':''}" data-nav data-a="go" ${canGo?'':'disabled'}>${canGo?'スタート！':total<2?'2人以上（COMをふくむ）で始められます':ps.length?'全員の準備OKを待っています':'まず だれか 参加してね'}</button>`:`<span class="hint">ホストがスタートすると始まります。</span>`}
    <button class="btn ghost" data-nav data-back>${S.online?'部屋を出る':'タイトルへ'}</button></div></div>`);
  ui.querySelectorAll('[data-ch]').forEach(cvs=>{const c=cvs.getContext('2d');c.clearRect(0,0,192,192);drawChar(c,CHARS[(+cvs.dataset.ch)%CHARS.length],96,170,120,1,0,true,0);});
  ui.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const pid=b.dataset.c;const p=S.players[pid];if(!p||p.ok)return;db.update(rp('p/'+pid),{char:((p.char||0)+(+b.dataset.d)+CHARS.length)%CHARS.length});sfx('ui');});

  ui.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{if(host)db.update(rp('m'),{target:+b.dataset.tg});});

  ui.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{if(host)db.update(rp('m'),{lv:+b.dataset.lv});});

  const go=ui.querySelector('[data-a=go]');if(go)go.onclick=()=>{if(canGo){sfx('ok');for(const pid in S.players)if(S.players[pid].cpu)db.remove(rp('p/'+pid));hostStart();}};
  const cp=ui.querySelector('[data-a=copy]');if(cp)cp.onclick=()=>{const done=()=>{const e=ui.querySelector('#cpm');if(e)e.textContent='コピーしました';};try{navigator.clipboard.writeText(url).then(done,()=>prompt('このリンクを送ってください',url));}catch(e){prompt('このリンクを送ってください',url);}};

function lobbyInput(){if(!S.meta||S.meta.st!=='lobby')return;for(const id in devs){if(id==='any'||id==='touch')continue;const d=devs[id];const pid=Object.keys(S.local).find(p=>S.local[p].dev===id);

    if(d.pa){S.db.update(rp('p/'+pid),{ok:!p.ok});sfx('ok');}
    const back=id.startsWith('gp')?(d.b&&!(lobbyInput.pb&&lobbyInput.pb[id])):d.pst;if(back){if(p.ok)S.db.update(rp('p/'+pid),{ok:false});else removeLocal(pid);}}
  lobbyInput.pb={};for(const k in devs)if(k.startsWith('gp'))lobbyInput.pb[k]=devs[k].b;}

// ============ ループ ============
let lastTs=0;
function frame(ts){try{frame1(ts);}catch(e){console.error(e);if(!frame.err){frame.err=1;setTimeout(()=>{throw e;});}}requestAnimationFrame(frame);}
