<style>

'use strict';
// ============ きほん ============
const cv=document.getElementById('c'),cx=cv.getContext('2d'),ui=document.getElementById('ui'),touchEl=document.getElementById('touch');

// ============ 音 ============
const AU={ctx:null,vol:.5*NetDB.vol.get()};

const SFXT={};

  move:()=>tone(420,.03,'square',.04),rot:()=>tone(620,.04,'triangle',.08),lock:()=>tone(150,.07,'triangle',.18,110),drop:()=>tone(200,.09,'triangle',.22,90),
  line:()=>{tone(700,.12,'square',.1,1100);},tetra:()=>{[660,880,1100,1320].forEach((f,i)=>tone(f,.12,'square',.11,0,i*.06));},

// ============ データ ============
const CHARS=[
  {name:'ポンタ',kind:'tanuki',c:'#b98a5a',c2:'#5b4130',acc:'#f3e2c4'},
  {name:'ミミ',kind:'rabbit',c:'#f4f0ea',c2:'#e89aa8',acc:'#ffffff'},
  {name:'ケロ',kind:'frog',c:'#5dbb63',c2:'#2e7d3a',acc:'#f2f7c8'},
  {name:'ペン',kind:'penguin',c:'#2d3654',c2:'#ff9f2e',acc:'#ffffff'},
  {name:'モグ',kind:'mole',c:'#7a6a8e',c2:'#ff8fa3',acc:'#d8cfe4'},
  {name:'コン',kind:'fox',c:'#f08a3c',c2:'#ffffff',acc:'#3a2a20'}];
const PCOL=['#e2483b','#2f7fe0','#2aa55a','#e9a21b','#9b59d0','#6d6d6d'];
const MD={p:{name:'まるドロップ',short:'まる',col:'#e0559a',desc:'同じ色を4つ つなげて 消す。れんさで 大こうげき'},t:{name:'ブロック',short:'ブロック',col:'#3f7fe0',desc:'横1列を そろえて 消す。4列 いっきに 消すと 大こうげき'}};
const OJ_LINE=4;// ブロックの1列 ＝ まるのおじゃま4こ
// ---- ブロック（10×22、上2段は見えない） ----
const TW=10,TH=22,TV=2;
const SH={I:{n:4,c:[[0,1],[1,1],[2,1],[3,1]]},J:{n:3,c:[[0,0],[0,1],[1,1],[2,1]]},L:{n:3,c:[[2,0],[0,1],[1,1],[2,1]]},O:{n:2,c:[[0,0],[1,0],[0,1],[1,1]]},S:{n:3,c:[[1,0],[2,0],[0,1],[1,1]]},T:{n:3,c:[[1,0],[0,1],[1,1],[2,1]]},Z:{n:3,c:[[0,0],[1,0],[1,1],[2,1]]}};
const PK='IJLOSTZ';const TCOL=['#000','#3fd0e8','#3f6fe0','#f0902a','#f2cf2a','#4fc95a','#a457d6','#e8484a','#8a8794'];
const ROT={};for(const k of PK){ROT[k]=[];let cs=SH[k].c;for(let r=0;r<4;r++){ROT[k].push(cs);const n=SH[k].n;cs=cs.map(([x,y])=>[n-1-y,x]);}}
const KJ={'01':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'10':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'12':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'21':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'23':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],'32':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'30':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'03':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]};
const KI={'01':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'10':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'12':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],'21':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'23':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'32':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'30':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'03':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]};
// ---- まるドロップ（6×13、いちばん上の段は見えない） ----
const PW=6,PHH=13;const POFF=[[0,-1],[1,0],[0,1],[-1,0]];
const PCOLS=['#000','#ef4f5f','#3fbf5a','#3f8fef','#f4c430','#a35fe0'];const OJ=9;
const CHAIN_P=[0,8,16,32,64,96,128,160,192,224,256,288,320,352,384,416,448,480,512];
const COLOR_B=[0,0,3,6,12,24],GROUP_B=n=>n<=4?0:n>=11?10:n-3;
// ============ 入力 ============
const QS=new URLSearchParams(location.search);const NET_LOCAL=NetDB.LOCAL;
let MEMDB=null;function dbTree(){return NetDB.mem();}function dbOnline(){return NetDB.open('fall');}
const DEV=(()=>{let p='';try{p=sessionStorage.getItem('fb_dev')||'';}catch(e){}if(!p){p='d'+Math.random().toString(36).slice(2,8);try{sessionStorage.setItem('fb_dev',p);}catch(e){}}return p;})();
const keys={},keyHit={};let touchK={},touchHit={};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.offsetParent!==null)return;keys[e.code]=true;if(!e.repeat)keyHit[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();audioInit();});
addEventListener('keyup',e=>{keys[e.code]=false;});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('pointerdown',()=>audioInit());
touchEl.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();audioInit();if(k==='m'){if(G.active&&!G.menu&&S.meta&&S.meta.st==='game')pauseMenu();return;}touchK[k]=1;touchHit[k]=1;b.classList.add('p');},off=e=>{e.preventDefault();touchK[k]=0;b.classList.remove('p');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});
// ボタン：l r u(ストン) d(はやく) cw ccw hold st a(決定)
const KB={kb1:{l:['KeyA'],r:['KeyD'],u:['KeyW','Space'],d:['KeyS'],cw:['KeyE'],ccw:['KeyQ'],hold:['ShiftLeft','KeyC'],st:['Escape','KeyP'],a:['Space','KeyE']},
  kb2:{l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],cw:['Slash','Enter'],ccw:['Period'],hold:['ShiftRight'],st:['Backspace'],a:['Enter','Slash']}};
const KBM={l:['KeyA','ArrowLeft'],r:['KeyD','ArrowRight'],u:['Space','KeyW'],d:['KeyS','ArrowDown'],cw:['ArrowUp','KeyX','KeyE','Enter'],ccw:['KeyZ','KeyQ','ControlLeft'],hold:['KeyC','ShiftLeft','ShiftRight'],st:['Escape','KeyP'],a:['Space','Enter','KeyX']};
const DEVNAME={kb1:'キーボード左（AD 移動・Q/E 回転・W ストン／まるは はやく）',kb2:'キーボード右（矢印・. / 回転・↑ ストン）',touch:'タッチ',any:'この端末'};
const BTN=['l','r','u','d','cw','ccw','hold','st','a'];
let devs={},devPrev={};
function kbMerged(){return G.active&&!Object.values(S.local).some(l=>l.dev==='kb2');}
function readDevs(){const out={};const mg=kbMerged();
  for(const id in KB){const m=id==='kb1'&&mg?KBM:KB[id];const o={};for(const b of BTN){o[b]=m[b].some(c=>keys[c]||keyHit[c]);o['h'+b]=m[b].some(c=>keyHit[c]);}out[id]=o;}
  const pads=navigator.getGamepads?navigator.getGamepads():[];for(const p of pads){if(!p||!p.connected)continue;const ax=Math.abs(p.axes[0])>.45?p.axes[0]:0,ay=Math.abs(p.axes[1])>.55?p.axes[1]:0;const B=i=>!!(p.buttons[i]&&p.buttons[i].pressed);
    out['gp'+p.index]={l:B(14)||ax<0,r:B(15)||ax>0,u:B(12)||ay<-.85,d:B(13)||ay>0,cw:B(0),ccw:B(1),hold:B(2)||B(3)||B(4)||B(5),st:B(9),a:B(0),b:B(1)};}
  out.touch={};for(const b of BTN)out.touch[b]=!!(touchK[b]||touchHit[b]);out.touch.a=false;for(const b of BTN)out.touch['h'+b]=!!touchHit[b];
  const all=Object.values(out);out.any={};for(const b of BTN.concat(['b'])){out.any[b]=all.some(d=>d[b]);out.any['h'+b]=all.some(d=>d['h'+b]);}
  for(const id in out){const d=out[id],p=devPrev[id]||{};for(const b of BTN.concat(['b'])){if(d['h'+b]&&p[b])p[b]=false;d['p'+b]=!!d[b]&&!p[b];}
    d.x=(d.r?1:0)-(d.l?1:0);d.y=(d.d?1:0)-(d.u?1:0);
    const rep=(k,v)=>{const t=(p[k+'T']||0);if(v===0){d[k+'T']=0;return 0;}if(Math.sign(v)!==Math.sign(p[k+'V']||0)){d[k+'T']=.28;d[k+'V']=v;return v;}d[k+'V']=v;d[k+'T']=t-1/60;if(d[k+'T']<=0){d[k+'T']=.07;return v;}return 0;};
    d.px=rep('x',d.x);d.py=rep('y',d.y);}
  for(const k in keyHit)delete keyHit[k];for(const k in touchHit)delete touchHit[k];devPrev=out;devs=out;return out;}
// ============ 部屋 ============
const S={db:null,code:'',online:false,host:false,meta:null,players:{},boards:{},L:[],seenMeta:false,name:'',err:'',local:{},rooms:[]};
S.name=NetDB.name.get()||'プレイヤー'+(100+Math.floor(Math.random()*900));
const rp=x=>'r/'+S.code+(x?'/'+x:'');
function owns(pid){return!!S.local[pid]||(S.host&&pid[0]==='c');}
function offAll(){for(const f of S.L)try{f();}catch(e){}S.L=[];if(G.evOff){G.evOff();G.evOff=null;}}
function openRoom(db,code,asHost){offAll();S.db=db;S.code=code;S.host=asHost;S.meta=null;S.players={};S.boards={};S.local={};S.seenMeta=false;S.online=db.kind!=='mem';G.n=-1;
  if(asHost){if(S.online)NetDB.hub.report('fall',code);db.set(rp('m'),{host:DEV,hostName:S.name,st:'lobby',target:2,cpu:S.online?0:1,lv:1,cmd:'mix',wins:{},t:db.now()});db.dis(rp('m'));db.dis(rp('e'));db.dis(rp('b'));
    if(S.online)S.pub=NetDB.lobby.publish('fall',code,{host:S.name,n:0,st:'lobby'});}
  S.L.push(db.on(rp('m'),'value',(k,v)=>onMeta(v)));
  S.L.push(db.on(rp('p'),'value',(k,v)=>{S.players=v||{};if(S.host&&S.pub)S.pub.update({n:Object.values(S.players).filter(p=>!p.cpu).length});if(scr==='lobby')lobbyScreen();}));
  const st=(pid,v)=>{if(!v||owns(pid))return;S.boards[pid]=v;};
  S.L.push(db.on(rp('b'),'child_added',st),db.on(rp('b'),'child_changed',st));
  if(!asHost)setTimeout(()=>{if(S.code===code&&!S.seenMeta&&scr==='lobby')leaveRoom('部屋「'+code+'」が見つかりません。コードを確かめてください。');},5000);
  lobbyScreen();}
function leaveRoom(msg){const db=S.db;if(db&&S.code){for(const pid in S.local){db.remove(rp('p/'+pid));db.remove(rp('b/'+pid));db.undis(rp('p/'+pid));}if(S.host){db.remove(rp());}}if(S.pub){S.pub.close();S.pub=null;}
  offAll();const wasOnline=S.online;S.code='';S.meta=null;S.local={};G.active=false;G.menu=false;S.err=msg||'';if(wasOnline)onlineScreen();else titleScreen();}
function addLocal(dev){const db=S.db;if(!db||!S.meta||S.meta.st!=='lobby')return;const humans=Object.values(S.players).filter(p=>!p.cpu).length;if(humans>=4)return;
  if(Object.values(S.local).some(l=>l.dev===dev))return;let slot=0;while(S.local[DEV+'-'+slot])slot++;const pid=DEV+'-'+slot;
  const used=new Set(Object.values(S.players).map(p=>p.char));let ch=0;while(used.has(ch)&&ch<CHARS.length-1)ch++;let md='t';try{md=localStorage.getItem('fb_md')||'t';}catch(e){}
  S.local[pid]={dev};const n=Object.keys(S.local).length;db.set(rp('p/'+pid),{name:S.online&&n===1?S.name:(S.online?S.name+n:'P'+(slot+1)),char:ch,md,ok:false,t:db.now(),dev:DEV});db.dis(rp('p/'+pid));db.dis(rp('b/'+pid));sfx('ok');}
function removeLocal(pid){const db=S.db;delete S.local[pid];db.remove(rp('p/'+pid));db.undis(rp('p/'+pid));sfx('bad');}
function setMd(pid,md){const db=S.db;db.update(rp('p/'+pid),{md});try{localStorage.setItem('fb_md',md);}catch(e){}sfx('ui');}
// ============ 進行 ============
const G={active:false,n:-1,me:{},dead:{},EVID:new Set(),menu:false,res:null,seq:0};
function onMeta(v){S.meta=v;if(v)S.seenMeta=true;
  if(!v){if(S.seenMeta&&S.code)leaveRoom('部屋がなくなりました（ホストが退出しました）');return;}
  if(v.st==='lobby'){G.active=false;lobbyScreen();return;}

  const playing=t>=0&&m.rd.ph==='play';
  acc+=dt;let k=0;while(acc>=1/120&&k<14){acc-=1/120;k++;
    for(const pid in G.me){const P=G.me[pid];if(!playing||!P.al)continue;let inp;
      if(P.cpu)inp=cpuInput(P,1/120);
      else{const d=devOf(pid);inp=d&&!G.menu?{x:d.x,soft:!!d.d||(P.md==='p'&&!!d.u),hard:P.md==='t'&&d.pu,cw:d.pcw,ccw:d.pccw,hold:d.phold}:{x:0};if(d){d.pu=d.pcw=d.pccw=d.phold=false;}}
      if(P.md==='t')tStep(P,inp,1/120);else pStep(P,inp,1/120);}}
  for(const pid in G.me){const P=G.me[pid];if(P.msg){P.msg.a-=dt;if(P.msg.a<=0)P.msg=null;}if(P.msg2){P.msg2.a-=dt;if(P.msg2.a<=0)P.msg2=null;}if(P.flash)P.flash=Math.max(0,P.flash-dt);if(P.qtT)P.qtT=Math.max(0,P.qtT-dt);if(P.wait&&P.wait.length){for(const w of P.wait)w.t-=dt;const ok=P.wait.filter(w=>w.t<=0);if(ok.length){P.wait=P.wait.filter(w=>w.t>0);for(const w of ok)P.pend+=w.n;P.flash=.5;}}if(P.big)P.big=Math.max(0,P.big-dt);if(P.fx){for(const f of P.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=14*dt;f.l-=dt;}P.fx=P.fx.filter(f=>f.l>0);}if(P.shake)P.shake=Math.max(0,P.shake-dt);}
  G.sendT=(G.sendT||0)-dt;if(G.sendT<=0){G.sendT=1/8;for(const pid in G.me){const P=G.me[pid];const snap=boardSnap(P);const key=JSON.stringify(snap);if(key===P.sent)continue;P.sent=key;snap.t=db.now();snap.n=G.n;db.set(rp('b/'+pid),snap);}}
  if(S.host)hostStep();}

  else{if(P.cur)s.c=[P.cur.a,P.cur.b,P.cur.x,P.cur.y,P.cur.r];s.q=P.q.slice(0,2).map(p=>p.join('')).join('');if(P.pop)s.pp=P.pop.cells;}

function hostStart(){const db=S.db,m=S.meta;const humans=Object.entries(S.players).filter(([,p])=>!p.cpu).sort((a,b)=>(a[1].t||0)-(b[1].t||0)).slice(0,4);
  const cpuN=clamp(m.cpu,0,4-humans.length);const used=new Set(humans.map(([,p])=>p.char));const order=humans.map(([pid])=>pid);const mds={};humans.forEach(([pid,p])=>mds[pid]=p.md||'t');

function hostStep(){const db=S.db,m=S.meta;if(!m||m.st!=='game'||!m.rd)return;const rd=m.rd,now=db.now();

    for(const pid of m.order){if(pid[0]==='c'||G.dead[pid])continue;if(!S.players[pid]){const id='x'+pid.replace(/[^A-Za-z0-9-]/g,'');if(!G.EVID.has(id)){G.EVID.add(id);const e={k:'d',pid};db.set(rp('e/'+G.n+'/'+id),e);onEv(e);}}}
    const alive=m.order.filter(p=>!G.dead[p]);
    if(alive.length<=1){if(!G.endAt)G.endAt=now+1200;if(now>=G.endAt){const w=alive.length===1?alive[0]:null;const wins=Object.assign({},m.wins);if(w)wins[w]=(wins[w]||0)+1;
        db.update(rp('m'),{wins,rd:{n:rd.n,ph:'res',w,seed:rd.seed,t0:rd.t0,t1:now}});}}else G.endAt=0;}

      if(best){db.update(rp('m'),{st:'end',win:best});if(S.pub)S.pub.update({st:'end'});return;}
      db.update(rp('m'),{rd:{n:rd.n+1,ph:'play',seed:Math.floor(Math.random()*1e9),t0:now+3500}});}}}

function layout(){if(!G.order)return;const n=G.order.length;const coarse=matchMedia('(pointer:coarse)').matches;const land=innerWidth>innerHeight;
  const W0=cv.width,H0=cv.height-((coarse&&!land&&!touchEl.hidden)?220*DPR:0);const side=(coarse&&land&&!touchEl.hidden)?230*DPR:0;
  let best=null;for(const cols of[n,Math.ceil(n/2)]){const rows=Math.ceil(n/cols);const u=Math.min((W0-side*2)/(cols*16.6),H0/(rows*25.6));if(!best||u>best.u)best={u,cols,rows};}
  const{u,cols,rows}=best;const pw=16*u,ph=25*u;const AW=W0-side*2;const gx=(AW-cols*pw)/(cols+1),gy=(H0-rows*ph)/(rows+1);

  <p><b>まるドロップ</b>：2こ組で 落ちてくる まるを、同じ色 4つ以上 つなげると 消えます。消えたあとに 上のまるが 落ちて また消えると「れんさ」。れんさが 多いほど 相手に たくさん じゃま（灰色のまる）が とどきます。<b>左から3列目の いちばん上（×じるし）が うまると まけ</b>。灰色のまるは となりで 色が消えると いっしょに 消えます。</p>
  <p><b>ブロック</b>：7しゅるいの ブロックを 回して ならべ、横1列が そろうと 消えます。2列で1、3列で2、<b>4列いっきに（テトラ）で4</b>のこうげき。Tブロックを 回して すきまに入れる「Tスピン」、つづけて消す「コンボ」も こうげきアップ。じゃまは 下から せり上がる列（穴が1つ）で とどきます。上まで つまると まけ。</p>
  <p><b>じゃまの そうさい</b>：とどく予定の じゃま（まるは わくの上の アイコン：小さいまる1・大きいまる6・岩30・星180、ブロックは 左の メーター）があるときに こちらが消すと、まず自分の じゃまが へり、のこりが 相手へ。まるのおじゃま4こ ＝ ブロックの1列 です。ブロックは コンボ中の こうげきを「アタックゲージ」に ため、コンボが切れたときに まとめて 送ります。ブロックから まるへの こうげきは 1秒おくれて とどきます。まるは 1分30秒をすぎると 30秒ごとに こうげき力が アップ。ぜんけし（全部消す）すると 次の れんさに じゃま30こが 上のせされます。</p>
  <p><b>勝ち</b>：さいごまで のこった人が そのラウンドの勝ち。きめた回数（1〜5回）先に勝った人が 優勝。</p>
  <p><b>操作</b><br>キーボード1人：←→ 移動・↓ はやく・Space ストン（ブロックは いっきに落とす／まるは はやく落とす）・↑/X 右回転・Z 左回転・C ホールド（ブロックだけ）。まるが せまい所で回らないときは 2回すばやく押すと 上下が入れかわります<br>キーボード2人：左＝AD 移動・S はやく・W ストン・E/Q 回転・左Shift ホールド／右＝矢印・↑ ストン・/ と . 回転・右Shift ホールド<br>コントローラー：十字キー 移動・↓ はやく・↑ ストン・A 右回転・B 左回転・X/Y/L/R ホールド・START メニュー<br>スマホ：画面のボタン</p></div>
  <div class="row"><button class="btn ghost" data-nav data-back>もどる</button></div></div>`);ui.querySelector('[data-back]').onclick=titleScreen;}
function onlineScreen(){scr='online';G.active=false;touchEl.hidden=true;const db=dbOnline();const q=QS.get('room');
  if(!db&&!S.err)S.err='通信の部品を読み込めませんでした。ネットにつながっているか確認して、ページを開き直してください。';
  const list=(S.rooms||[]).filter(r=>r.st==='lobby'&&(r.n||0)<4).slice(0,6).map(r=>[r.code,r]);
  h(`<div class="wrap" style="max-width:720px"><h2>オンライン（各自の端末で遊ぶ）</h2>${S.err?`<div class="panel" style="background:#ffe3dc"><b>${esc(S.err)}</b></div>`:''}
   <div class="panel row"><b>なまえ</b><input class="tx" id="nm" maxlength="10" value="${esc(S.name)}" style="flex:1"></div>
   <div class="menu"><button class="btn big" data-nav data-a="make">部屋をつくる<small>4文字のコードと招待リンクが出ます</small></button>
    <div class="btn" style="cursor:default">コードで入る<span class="row"><input class="tx" id="cd" maxlength="4" placeholder="ABCD" value="${esc(q?q.toUpperCase().slice(0,4):'')}" style="width:6em;text-transform:uppercase;letter-spacing:.12em"><button class="btn" data-nav data-a="join" style="padding:8px 14px">参加</button></span></div></div>
   <div class="panel"><b>いま開いている部屋</b>${list.length?`<div class="menu" style="margin-top:8px">${list.map(([c,r])=>`<button class="btn" data-nav data-room="${esc(c)}">${esc(r.host)}さんの部屋（${r.n||0}/4人）<small>コード ${esc(c)}・押すと参加</small></button>`).join('')}</div>`:`<p class="hint" style="margin-top:6px">${db?'今は開いている部屋がありません。':'通信の準備ができていません。'}</p>`}</div>
   <p class="hint">それぞれが自分の端末で自分のフィールドを動かし、盤面と こうげきだけを 送り合います。1台に2人まで（左右キーボード）入ることもできます。</p>
   <div class="row"><button class="btn ghost" data-nav data-back>もどる</button></div></div>`);
  const nm=ui.querySelector('#nm');const save=()=>{S.name=NetDB.name.set(nm.value)||S.name;};nm.onchange=save;
  ui.querySelector('[data-back]').onclick=()=>{S.err='';titleScreen();};
  ui.querySelector('[data-a=make]').onclick=()=>{save();if(!db){onlineScreen();return;}S.err='';const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];openRoom(db,c,true);};
  ui.querySelector('[data-a=join]').onclick=()=>{save();if(!db){onlineScreen();return;}const c=(ui.querySelector('#cd').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==4){S.err='コードは4文字です。';onlineScreen();return;}S.err='';openRoom(db,c,false);};
  ui.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{save();S.err='';openRoom(db,b.dataset.room,false);});
  ui.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){i.blur();if(i.id==='cd')ui.querySelector('[data-a=join]').click();}}));
  if(db&&!S.roomsOff){S.roomsOff=NetDB.lobby.watch(l=>{const prev=JSON.stringify(S.rooms);S.rooms=l.filter(r=>r.g==='fall');if(prev!==JSON.stringify(S.rooms)&&scr==='online'&&document.activeElement.tagName!=='INPUT')onlineScreen();});}
  if(q&&!onlineScreen.auto&&db){onlineScreen.auto=true;setTimeout(()=>{if(scr==='online')ui.querySelector('[data-a=join]').click();},400);}}
function lobbyInfo(){const m=S.meta;const ps=Object.entries(S.players).filter(([,p])=>!p.cpu).sort((a,b)=>(a[1].t||0)-(b[1].t||0)).slice(0,4);const cpuN=m?clamp(m.cpu,0,4-ps.length):0;
  const allOk=ps.length>0&&ps.every(([,p])=>p.ok);const total=ps.length+cpuN;const can=S.host&&allOk&&total>=2&&m&&m.st==='lobby';
  const why=!ps.length?'まず だれか 参加してね':total<2?'あと1人 参加してね（ルールで COMを入れてもOK）':!allOk?'全員が「'+(S.online?'準備OK':'これで決定')+'」を押すと スタートできます':m&&m.st!=='lobby'?'いまゲーム中です':'';
  return{ps,cpuN,allOk,total,can,why};}
function lobbyGo(){const L=lobbyInfo();if(!L.can)return;sfx('ok');for(const pid in S.players)if(S.players[pid].cpu)S.db.remove(rp('p/'+pid));hostStart();}
function mdSeg(pid,md,on){return`<div class="lk-seg">${['p','t'].map(k=>`<button ${on?`data-lkmd="${pid}" data-v="${k}"`:'disabled'} class="${md===k?'on':''}" style="${md===k?'background:'+MD[k].col:''}">${MD[k].short}</button>`).join('')}</div>`;}
function lobbyScreen(){scr='lobby';G.active=false;touchEl.hidden=true;const m=S.meta;const db=S.db;if(!db)return;const host=S.host;const L=lobbyInfo();
  const url=location.origin+location.pathname+'?room='+S.code+(NET_LOCAL?'&np=local':'');const touch=matchMedia('(pointer:coarse)').matches;
  const cards=[];for(let i=0;i<4;i++){const e=L.ps[i];if(e){const[pid,p]=e;const mine=!!S.local[pid];const ch=CHARS[(p.char||0)%CHARS.length];const md=p.md||'t';
      cards.push({type:'p',pid,name:p.name,mine,ok:!!p.ok,online:S.online,color:PCOL[i],char:p.char||0,charName:ch.name,dev:mine?(DEVNAME[S.local[pid].dev]||'コントローラー'):'ほかの端末',extra:mdSeg(pid,md,mine&&!p.ok)});}
    else if(i-L.ps.length<L.cpuN){const k=i-L.ps.length;const md=m.cmd==='mix'?(k%2?'t':'p'):m.cmd;cards.push({type:'cpu',name:'COM'+(k+1),sub:'コンピューター（'+['よわい','ふつう','つよい'][m.lv||0]+'）',color:'#8a8794',char:(i+2)%CHARS.length,extra:mdSeg('',md,false)});}
    else cards.push({type:'empty',touch});}
  const settings=[
    {k:'target',label:'勝ちぬけ',vals:[1,2,3,5],labels:['1回','2回','3回','5回'],cur:m?m.target:2,note:'先に この回数 勝ったら 優勝'},
    {k:'cpu',label:'COM',vals:[0,1,2,3],labels:['なし','1人','2人','3人'],cur:m?m.cpu:0},
    {k:'lv',label:'COMの強さ',vals:[0,1,2],labels:['よわい','ふつう','つよい'],cur:m?(m.lv||0):1},
    {k:'cmd',label:'COMのあそび',vals:['mix','p','t'],labels:['まぜる','まる','ブロック'],cur:m?(m.cmd||'mix'):'mix'}].map(s=>Object.assign(s,{dis:!host}));
  const share=S.online?`<button class="btn" data-nav data-a="copy">招待リンクをコピー</button><a class="btn" data-nav target="_blank" rel="noopener" href="https://line.me/R/msg/text/?${encodeURIComponent('ドロップ・バトルで遊ぼう！ '+url)}">LINEで送る</a><span class="hint" id="cpm">${host?'あなたがホスト':'ホスト：'+esc(m?m.hostName:'')+'さん'}</span>`:'';
  const o={title:S.online?`部屋 <span style="color:var(--sun);letter-spacing:.1em">${esc(S.code)}</span>`:'1台であそぶ',online:S.online,share,cards,settings,host,can:L.can,why:L.why,back:S.online?'部屋を出る':'タイトルへ',
    note:m&&m.st!=='lobby'?'いまゲーム中です。終わると次から参加できます。':'',
    drawCh:(c,ch)=>drawChar(c,CHARS[ch%CHARS.length],120,215,150,1,0,true),
    on:{join:()=>{audioInit();const used=new Set(Object.values(S.local).map(l=>l.dev));addLocal(touch?'touch':used.has('kb1')?'kb2':'kb1');},
      char:(pid,d)=>{const p=S.players[pid];if(!p||p.ok)return;db.update(rp('p/'+pid),{char:((p.char||0)+d+CHARS.length)%CHARS.length});sfx('ui');},
      ok:pid=>{const p=S.players[pid];if(p){db.update(rp('p/'+pid),{ok:!p.ok});sfx('ok');}},rm:pid=>removeLocal(pid),
      sel:(k,d)=>{if(!host)return;const s=settings.find(q=>q.k===k);sfx('ui');db.update(rp('m'),{[k]:LK.step(s.vals,s.cur,d)});},
      go:lobbyGo}};
  h(LK.html(o));LK.bind(ui,o);if(L.allOk&&L.can&&!lobbyScreen.wasAll){LK.focusGo(ui,navEls,nav);markNav();}lobbyScreen.wasAll=L.allOk&&L.can;
  ui.querySelectorAll('[data-lkmd]').forEach(b=>b.onclick=()=>{const pid=b.dataset.lkmd;const p=S.players[pid];if(!p||p.ok)return;setMd(pid,b.dataset.v);});
  const cp=ui.querySelector('[data-a=copy]');if(cp)cp.onclick=()=>{const done=()=>{const e=ui.querySelector('#cpm');if(e)e.textContent='コピーしました';};try{navigator.clipboard.writeText(url).then(done,()=>prompt('このリンクを送ってください',url));}catch(e){prompt('このリンクを送ってください',url);}};
  ui.querySelector('[data-back]').onclick=()=>leaveRoom('');}
function lobbyInput(){if(!S.meta||S.meta.st!=='lobby')return;for(const id in devs){if(id==='any'||id==='touch')continue;const d=devs[id];const pid=Object.keys(S.local).find(p=>S.local[p].dev===id);
    if(!pid){if(d.pa){audioInit();addLocal(id);}continue;}const p=S.players[pid];if(!p)continue;
    if(id.startsWith('gp')&&d.pst&&S.host&&lobbyInfo().can){lobbyGo();return;}
    const back=id.startsWith('gp')?d.pb:d.pst;
    if(p.ok){if(back){S.db.update(rp('p/'+pid),{ok:false});sfx('ui');}continue;}
    if(d.px){S.db.update(rp('p/'+pid),{char:((p.char||0)+d.px+CHARS.length)%CHARS.length});sfx('ui');}
    if(d.py&&!d.a)setMd(pid,(p.md||'t')==='t'?'p':'t');
    if(d.pa){S.db.update(rp('p/'+pid),{ok:true});sfx('ok');}
    if(back)removeLocal(pid);}}
function endScreen(){scr='end';const m=S.meta;const ord=m.order.slice().sort((a,b)=>(m.wins[b]||0)-(m.wins[a]||0));
  h(`<div class="wrap" style="max-width:560px"><h2>${esc(nameOf(m.win))} の優勝！</h2><div class="panel"><canvas width="240" height="200" id="wc" style="display:block;margin:0 auto;width:160px"></canvas>
   <table class="sc"><tr style="color:var(--muted);font-size:13px"><td></td><td></td><td></td><td style="text-align:right">勝ち</td></tr>${ord.map((p,i)=>`<tr><td>${i+1}</td><td style="color:${colorOf(p)}">${esc(nameOf(p))}</td><td style="font-size:13px;color:var(--muted)">${MD[(m.mds||{})[p]||'t'].short}</td><td style="text-align:right">${m.wins[p]||0}</td></tr>`).join('')}</table></div>
   <div class="row">${S.host?`<button class="btn big on" data-nav data-a="again">もう一度（同じメンバー）</button>`:`<span class="hint">ホストが次を選ぶのを待っています。</span>`}<button class="btn ghost" data-nav data-back>${S.online?'部屋を出る':'タイトルへ'}</button><button class="btn ghost" data-nav data-a="home">ゲーム一覧（ホーム）へ</button></div></div>`);
  const c=ui.querySelector('#wc').getContext('2d');drawChar(c,CHARS[charOf(m.win)],120,185,130,1,0,true);
  const a=ui.querySelector('[data-a=again]');if(a)a.onclick=()=>{for(const pid in S.players){if(S.players[pid].cpu)S.db.remove(rp('p/'+pid));else S.db.update(rp('p/'+pid),{ok:false});}S.db.update(rp('m'),{st:'lobby',rd:null,win:null});if(S.pub)S.pub.update({st:'lobby'});};
  ui.querySelector('[data-a=home]').onclick=goHome;ui.querySelector('[data-back]').onclick=()=>leaveRoom('');}
function goHome(){try{leaveRoom('');}catch(e){}location.href=(window.NetDB?NetDB.hub.home():'index.html');}
function pauseMenu(){G.menu=true;scr='pause';for(const k in devs){devs[k].pst=false;devs[k].pa=false;}h(`<div class="wrap" style="max-width:420px"><h2>メニュー</h2><p class="hint">メニュー中もゲームは止まりません。</p><div class="menu"><button class="btn big" data-nav data-back>つづける</button><button class="btn big" data-nav data-a="q">${S.online?'部屋を出る':'タイトルへ'}</button><button class="btn" data-nav data-a="home">ゲーム一覧（ホーム）へ</button></div></div>`);
  ui.querySelector('[data-back]').onclick=()=>{G.menu=false;scr='game';ui.hidden=true;ui.innerHTML='';G.menuGuard=performance.now()+150;};ui.querySelector('[data-a=q]').onclick=()=>{G.menu=false;leaveRoom('');};ui.querySelector('[data-a=home]').onclick=goHome;}
// ============ ループ ============
let lastTs=0;
function frame(ts){try{frame1(ts);}catch(e){console.error(e);if(!frame.err){frame.err=1;setTimeout(()=>{throw e;});}}requestAnimationFrame(frame);}
function frame1(ts){const dt=Math.min(.1,(ts-lastTs)/1000||0);lastTs=ts;readDevs();const t=ts/1000;
  if(G.active&&S.meta&&S.meta.st==='game'){if(!G.menu){for(const pid in S.local){const d=devOf(pid);if(d&&d.pst){pauseMenu();break;}}}
    if(G.menuGuard&&performance.now()<G.menuGuard)for(const k in devs){const d=devs[k];d.pu=d.pcw=d.pccw=d.phold=false;}
    gameTick(dt);}
  if(scr==='lobby')lobbyInput();
  if(scr!=='game')navStep();
  render(t,dt);}
resize();titleScreen();if(QS.get('room'))onlineScreen();else if(NetDB.hub.isHost&&NetDB.hub.code)setTimeout(()=>{onlineScreen();const b=ui.querySelector('[data-a=make]');if(b)b.click()},300);requestAnimationFrame(frame);
window.__f={S,G,openRoom,hostStart,get scr(){return scr;},rp,elapsed};
</script>
