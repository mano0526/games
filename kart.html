<style>
/* layout: full-screen game canvas, menus as toy-box sticker panels over a cobalt race-day field */
:root{
  --field:#1d47c9; --field-2:#173aa6; --paper:#fffdf6; --ink:#141414;
  --sun:#ffcf33; --flag:#e5402a; --mint:#2fc29b; --muted:#5a6275;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS 1p","Hiragino Sans","Yu Gothic",system-ui,sans-serif;

}
html,body{height:100%;overflow:hidden;background:var(--field);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
body{font-family:var(--body)}
#gl,#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
#ui{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
  background:repeating-linear-gradient(-28deg,var(--field) 0 46px,var(--field-2) 46px 92px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(18px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px))}
#ui.overlay{background:rgba(10,18,50,.62)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-height:100%;justify-content:center}
.logo{font-family:var(--display);color:var(--paper);font-size:clamp(40px,9vw,92px);line-height:.95;letter-spacing:.01em;
  transform:skewX(-9deg);text-shadow:5px 5px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);margin:0;text-wrap:balance}
.logo span{color:var(--sun)}
.tag{color:var(--paper);font-weight:700;font-size:15px;opacity:.9;margin:0}
h2{font-family:var(--display);font-weight:400;color:var(--paper);font-size:clamp(26px,5vw,40px);margin:0;transform:skewX(-8deg);
  text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);padding:16px}
.menu{display:grid;gap:12px}
.menu.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.menu.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}

.assist[aria-pressed="true"]{background:var(--mint);color:#fff}
@media (max-width:640px){.menu.cols4,.menu.cols5{grid-template-columns:repeat(2,minmax(0,1fr))}.menu.cols2.stack{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:800;font-size:18px;text-align:left;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:6px;
  box-shadow:5px 5px 0 var(--ink);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;transition:transform .08s}
.btn small{font-weight:500;font-size:13px;color:var(--muted)}
.btn.focus,.btn:focus-visible{background:var(--sun);transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink);outline:none}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.big{font-family:var(--display);font-weight:400;font-size:24px}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--paper);box-shadow:none}
.btn.ghost.focus{background:var(--paper);color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hint{color:var(--paper);font-size:14px;font-weight:700;opacity:.92}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.slot{background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:200px;min-width:0}

.keys dt{font-weight:800}

kbd{font-family:var(--body);font-weight:800;border:2px solid var(--ink);border-bottom-width:3px;border-radius:4px;padding:0 5px;background:#fff;font-size:12px}
/* touch */

#tL{left:max(14px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:min(84px,19vw);height:min(84px,19vw)}

#tD{right:max(14px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:min(96px,22vw);height:min(96px,22vw);font-size:15px}
#tI{right:calc(max(14px,env(safe-area-inset-right,0px)) + min(104px,24vw));bottom:max(26px,env(safe-area-inset-bottom,0px));width:min(70px,17vw);height:min(70px,17vw);font-size:11px}
#tB{right:calc(max(14px,env(safe-area-inset-right,0px)) + min(14px,3vw));bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + min(106px,25vw));width:min(66px,16vw);height:min(66px,16vw);font-size:11px}
#tP{left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:8px;font-size:15px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

<script>
'use strict';
// ============ math ============
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const approach=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function makeRng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
function shade(c,f){return[Math.min(1,c[0]*f),Math.min(1,c[1]*f),Math.min(1,c[2]*f)];}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
const M4={
  persp(fovy,asp,n,f){const t=1/Math.tan(fovy/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m;},
  lookAt(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
    let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
    const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;const m=new Float32Array(16);
    m[0]=xx;m[1]=yx;m[2]=zx;m[4]=xy;m[5]=yy;m[6]=zy;m[8]=xz;m[9]=yz;m[10]=zz;
    m[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);m[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);m[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);m[15]=1;return m;},
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  compose(x,y,z,yaw,pitch,roll,sx,sy,sz){if(sy===undefined){sy=sx;sz=sx;}
    const cy=Math.cos(yaw),syw=Math.sin(yaw),cx=Math.cos(pitch),sxp=Math.sin(pitch),cz=Math.cos(roll),szr=Math.sin(roll);
    // R = Ry*Rx*Rz
    const Ry=[[cy,0,syw],[0,1,0],[-syw,0,cy]],Rx=[[1,0,0],[0,cx,-sxp],[0,sxp,cx]],Rz=[[cz,-szr,0],[szr,cz,0],[0,0,1]];
    const mm=(A,B)=>A.map((r,i)=>[0,1,2].map(j=>A[i][0]*B[0][j]+A[i][1]*B[1][j]+A[i][2]*B[2][j]));
    const R=mm(mm(Ry,Rx),Rz);const m=new Float32Array(16);const s=[sx,sy,sz];
    for(let c=0;c<3;c++)for(let r=0;r<3;r++)m[c*4+r]=R[r][c]*s[c];m[12]=x;m[13]=y;m[14]=z;m[15]=1;return m;}
};
const IDENT=M4.compose(0,0,0,0,0,0,1);

// ============ GL ============
const glc=document.getElementById('gl');
const gl=glc.getContext('webgl',{antialias:true,alpha:false,powerPreference:'high-performance'})||glc.getContext('experimental-webgl');
const VS=`attribute vec3 p;attribute vec3 n;attribute vec3 c;attribute float e;
uniform mat4 M,VP;uniform vec3 L;uniform float amb;
varying vec3 vc;varying float vd;varying float ve;varying float vl;
void main(){vec4 w=M*vec4(p,1.);gl_Position=VP*w;vec3 nn=normalize(mat3(M)*n);
vl=amb+(1.-amb)*max(dot(nn,L),0.)+nn.y*.06;vc=c;ve=e;vd=gl_Position.w;}`;
const FS=`precision mediump float;varying vec3 vc;varying float vd;varying float ve;varying float vl;
uniform vec3 fogC;uniform vec2 fogR;uniform vec4 tint;uniform float alpha;uniform float unlit;
void main(){vec3 col=vc*mix(vl,1.,max(ve,unlit));col=mix(col,tint.rgb,tint.a);
float f=clamp((vd-fogR.x)/(fogR.y-fogR.x),0.,1.);col=mix(col,fogC,f*(1.-ve*.55));gl_FragColor=vec4(col,alpha);}`;
function mkShader(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh;}
const prog=gl.createProgram();gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,VS));gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
const A={p:gl.getAttribLocation(prog,'p'),n:gl.getAttribLocation(prog,'n'),c:gl.getAttribLocation(prog,'c'),e:gl.getAttribLocation(prog,'e')};
const U={};['M','VP','L','amb','fogC','fogR','tint','alpha','unlit'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
for(const k in A)gl.enableVertexAttribArray(A[k]);
gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
class Mesh{constructor(data,dynamic){this.buf=gl.createBuffer();this.count=0;this.dyn=!!dynamic;if(data)this.set(data);}
  set(data){const arr=data instanceof Float32Array?data:new Float32Array(data);gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);gl.bufferData(gl.ARRAY_BUFFER,arr,this.dyn?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);this.count=arr.length/10;}
  draw(m){if(!this.count)return;gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);gl.vertexAttribPointer(A.p,3,gl.FLOAT,false,40,0);gl.vertexAttribPointer(A.n,3,gl.FLOAT,false,40,12);
    gl.vertexAttribPointer(A.c,3,gl.FLOAT,false,40,24);gl.vertexAttribPointer(A.e,1,gl.FLOAT,false,40,36);gl.uniformMatrix4fv(U.M,false,m||IDENT);gl.drawArrays(gl.TRIANGLES,0,this.count);}
  dispose(){gl.deleteBuffer(this.buf);}}
const NOTINT=[0,0,0,0];
function setTint(r,g,b,a){gl.uniform4f(U.tint,r,g,b,a);}

// mesh builder
class MB{constructor(){this.d=[];this.m=null;this.em=0;}
  T(x,y,z,yaw,s,pitch,roll){this.m=M4.compose(x,y,z,yaw||0,pitch||0,roll||0,s||1);return this;}
  Ts(x,y,z,yaw,sx,sy,sz,pitch,roll){this.m=M4.compose(x,y,z,yaw||0,pitch||0,roll||0,sx,sy,sz);return this;}
  noT(){this.m=null;return this;}
  v(x,y,z,nx,ny,nz,c){const m=this.m;if(m){const X=m[0]*x+m[4]*y+m[8]*z+m[12],Y=m[1]*x+m[5]*y+m[9]*z+m[13],Z=m[2]*x+m[6]*y+m[10]*z+m[14];
      let NX=m[0]*nx+m[4]*ny+m[8]*nz,NY=m[1]*nx+m[5]*ny+m[9]*nz,NZ=m[2]*nx+m[6]*ny+m[10]*nz;const l=Math.hypot(NX,NY,NZ)||1;x=X;y=Y;z=Z;nx=NX/l;ny=NY/l;nz=NZ/l;}
    this.d.push(x,y,z,nx,ny,nz,c[0],c[1],c[2],this.em);}
  tri(a,b,c,col,n){if(!n){const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;n=[nx/l,ny/l,nz/l];}
    this.v(a[0],a[1],a[2],n[0],n[1],n[2],col);this.v(b[0],b[1],b[2],n[0],n[1],n[2],col);this.v(c[0],c[1],c[2],n[0],n[1],n[2],col);}
  quad(a,b,c,d,col,n){this.tri(a,b,c,col,n);this.tri(a,c,d,col,n);}
  box(x,y,z,sx,sy,sz,col,top){const hx=sx/2,hz=sz/2,y0=y,y1=y+sy;const t=top||col;
    this.quad([x-hx,y1,z-hz],[x+hx,y1,z-hz],[x+hx,y1,z+hz],[x-hx,y1,z+hz],t,[0,1,0]);
    this.quad([x-hx,y0,z-hz],[x+hx,y0,z-hz],[x+hx,y0,z+hz],[x-hx,y0,z+hz],shade(col,.6),[0,-1,0]);

    this.quad([x-hx,y0,z-hz],[x-hx,y1,z-hz],[x-hx,y1,z+hz],[x-hx,y0,z+hz],col,[-1,0,0]);
    this.quad([x-hx,y0,z+hz],[x+hx,y0,z+hz],[x+hx,y1,z+hz],[x-hx,y1,z+hz],col,[0,0,1]);
    this.quad([x-hx,y0,z-hz],[x+hx,y0,z-hz],[x+hx,y1,z-hz],[x-hx,y1,z-hz],col,[0,0,-1]);}
  cyl(x,y,z,r,h,seg,col,cap,r2){r2=r2===undefined?r:r2;cap=cap||col;for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;
      const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1),am=(a0+a1)/2;
      this.quad([x+c0*r,y,z+s0*r],[x+c1*r,y,z+s1*r],[x+c1*r2,y+h,z+s1*r2],[x+c0*r2,y+h,z+s0*r2],col,[Math.cos(am),(r-r2)/h*.5,Math.sin(am)]);

  wheel(x,y,z,r,w,seg,col,hub){// axis x
    for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1),am=(a0+a1)/2;
      this.quad([x-w/2,y+c0*r,z+s0*r],[x+w/2,y+c0*r,z+s0*r],[x+w/2,y+c1*r,z+s1*r],[x-w/2,y+c1*r,z+s1*r],col,[0,Math.cos(am),Math.sin(am)]);
      for(const sd of[-1,1]){this.tri([x+sd*w/2,y,z],[x+sd*w/2,y+c0*r,z+s0*r],[x+sd*w/2,y+c1*r,z+s1*r],i%2?hub:shade(hub,.85),[sd,0,0]);}}}
  sphere(x,y,z,r,seg,col,syc,col2){syc=syc||1;const rings=Math.max(3,seg>>1);for(let j=0;j<rings;j++){const p0=j/rings*Math.PI,p1=(j+1)/rings*Math.PI;
      for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;const P=(p,a)=>[Math.sin(p)*Math.cos(a),Math.cos(p),Math.sin(p)*Math.sin(a)];
        const q=[P(p0,a0),P(p0,a1),P(p1,a1),P(p1,a0)];const cc=col2&&j>=rings/2?col2:col;const pm=(p0+p1)/2,am=(a0+a1)/2;const nn=P(pm,am);
        this.quad(...q.map(v=>[x+v[0]*r,y+v[1]*r*syc,z+v[2]*r]),cc,[nn[0],nn[1]/syc,nn[2]]);}}}
  build(dyn){return new Mesh(this.d,dyn);}
}

const AU={ctx:null,master:null,on:true,music:null,engines:[],vol:{bgm:6,sfx:8,eng:4}};

  const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);s.connect(f);f.connect(g);g.connect(dest||AU.sfxGain);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);}

function engineStart(n){engineStop();if(!AU.ctx)return;for(let i=0;i<n;i++){const o=AU.ctx.createOscillator(),o2=AU.ctx.createOscillator(),f=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();
  o.type='sawtooth';o2.type='triangle';f.type='lowpass';f.Q.value=.7;f.frequency.value=300;g.gain.value=0;o.connect(f);o2.connect(f);f.connect(g);g.connect(AU.engGain);o.start();o2.start();AU.engines.push({o,o2,f,g});}}
function engineStop(){for(const e of AU.engines){try{e.o.stop();e.o2.stop();e.g.disconnect();}catch(x){}}AU.engines=[];}
function engineSet(i,speedFrac,acc,boost,vol){const e=AU.engines[i];if(!e)return;const t=AU.ctx.currentTime;const f=48+speedFrac*95+(acc?12:0)+(boost?25:0);
  e.o.frequency.setTargetAtTime(f,t,.05);e.o2.frequency.setTargetAtTime(f*0.5,t,.05);e.f.frequency.setTargetAtTime(240+speedFrac*650+(boost?250:0),t,.06);e.g.gain.setTargetAtTime(vol*(0.07+(acc?0.04:0)),t,.08);}

function makeMelody(song){const r=makeRng(song.seed);const mel=[];const rhythm=[[0,3,6,8,10,12],[0,2,4,6,8,11,14],[0,4,6,8,12],[0,3,6,10,12,14]];
  song.chords.forEach((ch,bi)=>{const rt=rhythm[(bi+(r()*2|0))%4];const tones=ch[1]?[0,3,7,10,12]:[0,4,7,9,12];let prev=2;
    rt.forEach((st,i)=>{let k=clamp(prev+((r()*3|0)-1),0,4);prev=k;const len=(rt[i+1]||16)-st;mel.push({bar:bi,step:st,note:ch[0]+12+tones[k],len});});});return mel;}
class Music{constructor(){this.timer=null;}
  start(i){this.stop();if(!AU.ctx)return;this.song=SONGS[i];this.mel=makeMelody(this.song);this.step=0;this.mul=1;this.next=AU.ctx.currentTime+0.1;
    this.out=AU.ctx.createGain();this.out.gain.value=1;this.out.connect(AU.musicGain);this.timer=setInterval(()=>this.tick(),30);}
  stop(){if(this.timer)clearInterval(this.timer);this.timer=null;if(this.out){const o=this.out;try{o.gain.setTargetAtTime(0,AU.ctx.currentTime,.05);setTimeout(()=>o.disconnect(),400);}catch(e){}}this.out=null;}
  tick(){const c=AU.ctx;if(!c||!this.out)return;const sd=60/(this.song.bpm*this.mul)/4;const bars=this.song.chords.length;
    while(this.next<c.currentTime+0.15){const st=this.step%16,bar=Math.floor(this.step/16)%bars;const ch=this.song.chords[bar];const t=this.next;const o=this.out;
      if(st%4===0||st===6||st===14){const n=ch[0]-24+((st===4||st===12)?12:0);tone('triangle',midi(n),0,sd*1.6,.34,t,o);}
      if(st%2===0){const tones=ch[1]?[0,3,7,12]:[0,4,7,12];tone('triangle',midi(ch[0]+tones[(st/2)%4]),0,sd*1.2,.07,t,o);}
      for(const m of this.mel)if(m.bar===bar&&m.step===st)tone(this.song.wave,midi(m.note),0,sd*m.len*0.9,this.song.wave==='sawtooth'?.05:.075,t,o);

  for(const h of race.haz){const m=IM[h.type];if(h.type==='missile')m.draw(M4.compose(h.x,h.y,h.z,h.yaw||0,0,T*6,1.1));else m.draw(M4.compose(h.x,h.y,h.z,h.type==='trap'?0:T*8,0,0,1.1));}
  // transparent pass
  gl.enable(gl.BLEND);gl.depthMask(false);
  gl.uniform1f(U.alpha,.35);gl.uniform1f(U.unlit,1);setTint(0,0,0,1);for(const k of race.karts)if(near(k.x,k.z,160)){const s=k.shrinkT>0?.55:1;if(!k.falling&&k.respawnT<=0||k.respawnT===undefined){const gy=kSurf(k);if(k.y-gy<12)IM.shadow.draw(M4.compose(k.x,gy+.05,k.z,k.visYaw,0,0,s));};}
  setTint(0,0,0,0);gl.uniform1f(U.alpha,.55);gl.uniform1f(U.unlit,0);
  for(const b of tr.boxes){if(b.t>.4)continue;if(!near(b.x,b.z,260))continue;const s=b.t>0?1-b.t/.4:1;IM.boxOuter.draw(M4.compose(b.x,b.y+1.6+Math.sin(T*2+b.ph)*.2,b.z,T*.8+b.ph,.5,.3,s));}
  if(race.blast){gl.uniform1f(U.alpha,race.blast.t);setTint(1,.7,.3,.6);IM.flash.draw(M4.compose(race.blast.x,race.blast.y||0,race.blast.z,0,0,0,(1-race.blast.t)*6+1));setTint(0,0,0,0);}
  for(const k of race.karts)if(k.starT>0&&near(k.x,k.z,160)){gl.uniform1f(U.alpha,.3);const hue=(T*3)%1;setTint(.5+.5*Math.sin(hue*6.28),.5+.5*Math.sin(hue*6.28+2),.5+.5*Math.sin(hue*6.28+4),.7);IM.flash.draw(M4.compose(k.x,k.y-.3,k.z,0,0,0,1.25));setTint(0,0,0,0);}
  if(race.ghost&&race.ghost.d&&race.ghost.d.length>=8){const d=race.ghost.d;const f=Math.max(0,race.phase==='race'?race.t:0)/.05;const n=d.length/4;let i=Math.min(Math.floor(f),n-2);const u=Math.min(1,f-i);const g=j=>d[i*4+j]+(d[(i+1)*4+j]-d[i*4+j])*u;
    if(f<n){gl.uniform1f(U.alpha,.42);setTint(.85,.92,1,.35);kartMeshes[race.ghost.c||0].draw(M4.compose(g(0),g(1),g(2),d[i*4+3]+angDiff(d[i*4+3],d[(i+1)*4+3])*u,0,0,1));setTint(0,0,0,0);}}
  if(skidMesh.count){gl.uniform1f(U.alpha,.42);gl.uniform1f(U.unlit,1);skidMesh.draw();gl.uniform1f(U.unlit,0);}
  if(race.battle){for(const k of race.karts){if(k.out||!(k.balloons>0)||!near(k.x,k.z,200))continue;const c=hex(k.ch.col);gl.uniform1f(U.alpha,.95);setTint(c[0],c[1],c[2],.85);const sc=k.shrinkT>0?.55:1;
      for(let b=0;b<k.balloons;b++){const off=(b-(k.balloons-1)/2)*.75;const bx=Math.cos(k.visYaw)*off-Math.sin(k.visYaw)*1.3*sc,bz=-Math.sin(k.visYaw)*off-Math.cos(k.visYaw)*1.3*sc;
        IM.balloon.draw(M4.compose(k.x+bx,k.y+3.4*sc+Math.sin(T*3+b)*.12,k.z+bz,0,Math.sin(T*2+b)*.12,off*.15,sc));}setTint(0,0,0,0);}}
  // particles
  drawParticles(cam);
  gl.depthMask(true);gl.disable(gl.BLEND);gl.uniform1f(U.alpha,1);gl.uniform1f(U.unlit,0);}

function drawKart(k,T){const sc=k.shrinkT>0?.55:1;let yaw=k.visYaw+k.spinA;const roll=k.drift===2?k.ddir*.08:0;let pitch=0;
  if(k.trick)pitch=-Math.min(1,k.trickT/.45)*Math.PI*2;const st=kS(k);const p0=k.grounded?-Math.atan(st.slope*Math.cos(k.visYaw-st.yaw)):-.12;
  const sy=k.squashT>0?.35:1;const m=M4.compose(k.x,k.y+(k.grounded?Math.sin(T*40)*.02*Math.min(1,Math.abs(k.speed)/10):0),k.z,yaw,p0,0,sc,sc*sy,sc);
  const m2=pitch?M4.mul(m,M4.compose(0,.8,0,0,pitch,0,1)):m;const mm=pitch?M4.mul(m2,M4.compose(0,-.8,0,0,0,0,1)):m;const mr=roll?M4.mul(mm,M4.compose(0,0,0,0,0,roll,1)):mm;
  if(k.hitT>0&&Math.floor(T*20)%2)setTint(1,1,1,.5);else if(k.starT>0){const h=T*6;setTint(.5+.5*Math.sin(h),.5+.5*Math.sin(h+2),.5+.5*Math.sin(h+4),.35);}else if(k.boostT>0)setTint(1,.8,.4,.08);
  if(k.out)setTint(.5,.5,.55,.6);const km=kartMeshes[k.charIdx];km.draw(mr);
  if(km.wheels){const ws=-k.steerSm*.42;for(const w of km.wheels)IM.wheel.draw(M4.mul(mr,M4.compose(w.x,w.y,w.z,w.front?ws:0,k.wheelA||0,0,w.w,w.r,w.r)));}
  setTint(0,0,0,0);
  if(k.respawnT>0){IM.drone.draw(M4.compose(k.x,k.y+3.2,k.z,T*2,0,0,1));}
  if(k.holding&&k.item){const fx=Math.sin(k.yaw),fz=Math.cos(k.yaw);IM[k.item].draw(M4.compose(k.x-fx*2.3*sc,k.y,k.z-fz*2.3*sc,T*4,0,0,sc));}}

function drawParticles(cam){const P=race.parts;if(!P.length)return;const f=cam.fwd;const rx=f[1],rz=-f[0];const d=new Float32Array(P.length*60);let o=0;
  const ex=cam.eye;for(const p of P){const a=p.life/p.max;const dd=Math.hypot(p.x-ex[0],p.y-ex[1],p.z-ex[2]);const s=p.size*(.5+a*.6)*clamp(dd/10,.25,1);const c=p.col;const v=(dx,dy)=>{d[o++]=p.x+rx*dx;d[o++]=p.y+dy;d[o++]=p.z+rz*dx;d[o++]=0;d[o++]=1;d[o++]=0;d[o++]=c[0];d[o++]=c[1];d[o++]=c[2];d[o++]=1;};
    v(-s,-s);v(s,-s);v(s,s);v(-s,-s);v(s,s);v(-s,s);}
  partMesh.set(d.subarray(0,o));gl.uniform1f(U.alpha,.85);gl.uniform1f(U.unlit,1);partMesh.draw();}

const RANKCOL=['#ffd23a','#e8eef8','#ff9b4a','#ffffff'];
function txt(s,x,y,size,fill,align,stroke,font){hc.font=`${size}px ${font||'"Dela Gothic One","Hiragino Sans",sans-serif'}`;hc.textAlign=align||'left';hc.textBaseline='alphabetic';hc.lineJoin='round';
  if(stroke!==false){hc.lineWidth=Math.max(3,size*.16);hc.strokeStyle='#141414';hc.strokeText(s,x,y);}hc.fillStyle=fill;hc.fillText(s,x,y);}
function fmtT(t){if(t<0)t=0;const m=Math.floor(t/60),s=t%60;return m+"'"+(s<10?'0':'')+s.toFixed(2).replace('.','"');}
function drawItemIcon(it,x,y,s){hc.save();hc.translate(x,y);hc.scale(s/100,s/100);hc.lineJoin='round';hc.lineWidth=6;hc.strokeStyle='#141414';
  const P=(f,st)=>{hc.fillStyle=f;hc.fill();hc.stroke();};
  if(it==='dash'||it==='dash3'){const n=it==='dash3'?3:1;for(let i=0;i<n;i++){hc.save();if(n===3)hc.translate((i-1)*22,(i===1?-10:12));hc.scale(n===3?.62:1,n===3?.62:1);
      hc.beginPath();hc.moveTo(-30,-32);hc.lineTo(8,-32);hc.lineTo(36,0);hc.lineTo(8,32);hc.lineTo(-30,32);hc.lineTo(-4,0);hc.closePath();P('#ff6a2a');
      hc.beginPath();hc.moveTo(-16,-16);hc.lineTo(2,-16);hc.lineTo(16,0);hc.lineTo(2,16);hc.lineTo(-16,16);hc.lineTo(-4,0);hc.closePath();hc.fillStyle='#ffd23a';hc.fill();hc.restore();}}
  else if(it==='trap'){for(let i=0;i<8;i++){const a=i/8*Math.PI*2;hc.beginPath();hc.moveTo(Math.cos(a-.25)*22,Math.sin(a-.25)*22);hc.lineTo(Math.cos(a)*40,Math.sin(a)*40);hc.lineTo(Math.cos(a+.25)*22,Math.sin(a+.25)*22);hc.closePath();P('#b9bdc9');}
    hc.beginPath();hc.arc(0,0,24,0,7);P('#6a3fa0');}
  else if(it==='ball'||it==='homing'){hc.beginPath();hc.arc(0,0,34,0,7);P(it==='ball'?'#25b77d':'#e23a3a');hc.beginPath();hc.rect(-36,-6,72,12);P('#f5f3ea');
    if(it==='homing'){hc.beginPath();hc.arc(0,0,12,0,7);P('#ffd23a');}}
  else if(it==='star'){hc.beginPath();for(let i=0;i<10;i++){const r=i%2?17:40,a=-Math.PI/2+i*Math.PI/5;hc.lineTo(Math.cos(a)*r,Math.sin(a)*r);}hc.closePath();P('#ffd23a');
    hc.fillStyle='#141414';hc.fillRect(-9,-6,5,12);hc.fillRect(4,-6,5,12);}
  else if(it==='thunder'){hc.beginPath();hc.moveTo(8,-42);hc.lineTo(-24,6);hc.lineTo(-2,6);hc.lineTo(-12,42);hc.lineTo(24,-8);hc.lineTo(2,-8);hc.closePath();P('#ffe14a');}
  else if(it==='missile'){hc.rotate(-.6);hc.beginPath();hc.moveTo(-14,-26);hc.lineTo(14,-26);hc.lineTo(14,22);hc.lineTo(-14,22);hc.closePath();P('#3366ee');hc.beginPath();hc.moveTo(-14,-26);hc.lineTo(0,-44);hc.lineTo(14,-26);hc.closePath();P('#e8ecf5');
    hc.beginPath();hc.moveTo(-14,6);hc.lineTo(-30,26);hc.lineTo(-14,22);hc.closePath();P('#ffd23a');hc.beginPath();hc.moveTo(14,6);hc.lineTo(30,26);hc.lineTo(14,22);hc.closePath();P('#ffd23a');}
  else if(it==='rocket'){hc.rotate(-.5);hc.beginPath();hc.moveTo(-18,-14);hc.lineTo(18,-14);hc.quadraticCurveTo(46,0,18,14);hc.lineTo(-18,14);hc.closePath();hc.rotate(-Math.PI/2);hc.rotate(Math.PI/2);
    hc.beginPath();hc.ellipse(4,0,34,20,0,0,7);P('#2b2b33');hc.beginPath();hc.arc(10,-4,7,0,7);P('#ffffff');hc.beginPath();hc.moveTo(-26,-12);hc.lineTo(-40,-26);hc.lineTo(-30,0);hc.lineTo(-40,26);hc.lineTo(-26,12);hc.closePath();P('#e5402a');
    hc.beginPath();hc.moveTo(-32,-8);hc.lineTo(-50,0);hc.lineTo(-32,8);hc.closePath();P('#ffd23a');}
  else if(it==='coin'){hc.beginPath();hc.ellipse(0,0,26,36,0,0,7);P('#ffcf33');hc.beginPath();hc.rect(-4,-18,8,36);hc.fillStyle='#d99a14';hc.fill();}
  hc.restore();}
function drawHud(k,vp,n){const[x,y,w,h]=vp;const u=Math.min(w,h);const sc=clamp(u/520,.55,1.25);hc.save();hc.beginPath();hc.rect(x,y,w,h);hc.clip();
  const m=14*sc+(n===1?8:0);const tch=k.device==='touch';const bot=tch?Math.min(130,w*.3)+10:0;
  if(race.phase==='intro'){const d=race.track.def;hc.fillStyle='rgba(16,22,58,.72)';hc.fillRect(x,y+h*.72,w,h*.2);txt(d.name+(race.cc.mirror&&!race.battle?'（ミラー）':''),x+w/2,y+h*.8,34*sc,'#fff','center');
    txt(d.tag||'',x+w/2,y+h*.8+28*sc,17*sc,'#ffd23a','center',true,'"M PLUS 1p",sans-serif');if(n===1||k.pi===0)txt('決定ボタンでスキップ',x+w-m,y+h-m,14*sc,'#fff','right',true,'"M PLUS 1p",sans-serif');hc.restore();return;}
  // speed lines
  if(k.boostT>0||k.slipT>.6){hc.strokeStyle='rgba(255,255,255,.35)';hc.lineWidth=2;const cx=x+w/2,cy=y+h/2;for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,r0=u*.42+Math.random()*u*.2;hc.beginPath();hc.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*.7);hc.lineTo(cx+Math.cos(a)*(r0+u*.25),cy+Math.sin(a)*(r0+u*.25)*.7);hc.stroke();}}
  // item slot
  const bs=78*sc;hc.fillStyle='rgba(255,253,246,.92)';hc.strokeStyle='#141414';hc.lineWidth=4;hc.beginPath();hc.roundRect?hc.roundRect(x+m,y+m,bs,bs,8):hc.rect(x+m,y+m,bs,bs);hc.fill();hc.stroke();
  if(k.roulT>0)drawItemIcon(k.roulShow,x+m+bs/2,y+m+bs/2,bs*.82);else if(k.item){drawItemIcon(k.item,x+m+bs/2,y+m+bs/2,bs*.82);if(k.itemN>1)txt('×'+k.itemN,x+m+bs-4,y+m+bs-4,20*sc,'#fff','right');}
  if(k.holding)txt('はなして投げる',x+m,y+m+bs+20*sc,13*sc,'#ffd23a','left',true,'"M PLUS 1p",sans-serif');
  // lap & time
  if(race.battle){for(let b=0;b<3;b++){const bx=x+w-m-14*sc-b*30*sc,by=y+m+22*sc;hc.beginPath();hc.ellipse(bx,by,11*sc,13*sc,0,0,7);hc.fillStyle=b<k.balloons?k.ch.col:'rgba(255,255,255,.18)';hc.fill();hc.lineWidth=3;hc.strokeStyle='#141414';hc.stroke();
      hc.beginPath();hc.moveTo(bx,by+13*sc);hc.lineTo(bx,by+24*sc);hc.stroke();}
    const rem=Math.max(0,race.timeLimit-race.t);txt(fmtT(rem).slice(0,-3),x+w-m,y+m+66*sc,22*sc,rem<30?'#ff6a4a':'#fff','right');txt('残り '+race.karts.filter(q=>!q.out).length+'人',x+w-m,y+m+90*sc,16*sc,'#fff','right',true,'"M PLUS 1p",sans-serif');}
  else{const lap=clamp(k.lapMax,1,LAPS);txt('LAP',x+w-m-118*sc,y+m+30*sc,20*sc,'#fff','left');txt(lap+'/'+LAPS,x+w-m,y+m+32*sc,34*sc,'#ffd23a','right');
  txt(fmtT(k.finished?k.ftime:race.t),x+w-m,y+m+62*sc,20*sc,'#fff','right');}if(race.cfg.mode==='ta'&&race.bestT)txt('ベスト '+fmtT(race.bestT),x+w-m,y+m+86*sc,16*sc,'#bfe4ff','right');
  if(k.assist)txt('アシスト',x+m,y+m+bs+(k.holding?40:20)*sc,12*sc,'#9fe8ff','left',true,'"M PLUS 1p",sans-serif');
  // coins
  const cy=y+h-m-8*sc-bot;if(!race.battle){hc.beginPath();hc.ellipse(x+m+14*sc,cy-12*sc,11*sc,15*sc,0,0,7);hc.fillStyle='#ffcf33';hc.fill();hc.lineWidth=3;hc.strokeStyle='#141414';hc.stroke();
  txt('×'+k.coins,x+m+32*sc,cy,28*sc,k.coins>=10?'#ffd23a':'#fff','left');}
  // rank
  const r=k.rank+1;const rs=96*sc;const ry=tch?y+m+100*sc+rs*.82:y+h-m-6*sc;txt(String(r),x+w-m-38*sc,ry,rs*(1+(k.rankFx||0)*.6),RANKCOL[Math.min(r-1,3)],'right');txt('位',x+w-m,ry,34*sc,RANKCOL[Math.min(r-1,3)],'right');
  // minimap for 1-2 players
  if(tch){const ms=Math.min(u*.34,150);drawMinimap(x+m,y+m+bs+(k.holding?30:12)*sc,ms,ms,false,k);}else if(n<=2){const ms=n===1?u*.3:u*.42;drawMinimap(x+w-m-ms,y+h*.5-ms*(n===1?.55:.62),ms,ms,false,k);}
  // drift charge pip
  if(k.drift===2&&k.mt>0){const c=['','#4da3ff','#ff9b2e','#c86bff'][k.mt];txt(['','ミニターボ','スーパー','ウルトラ'][k.mt],x+w/2,y+h-m-8*sc-bot,20*sc,c,'center');}
  // countdown

  // messages
  if(k.out)txt('脱落…　観戦中',x+w/2,y+h*.4,34*sc,'#ddd','center');else if(k.msgT>0&&!k.finished)txt(k.msg,x+w/2,y+h*.28,34*sc,'#fff','center');
  if(k.wrongT>1.2&&!k.finished)txt('逆走中！',x+w/2,y+h*.32,44*sc,'#ff5a3a','center');
  if(k.popT>0&&!k.finished){const a=Math.min(1,k.popT*3);hc.globalAlpha=a;txt(k.popTxt,x+w/2,y+h*.66-(1-a)*10,26*sc,'#ffd23a','center');hc.globalAlpha=1;}
  if(k.burnT>0)txt('エンスト…',x+w/2,y+h*.32,32*sc,'#bbb','center');
  if(k.finished){txt('FINISH!',x+w/2,y+h*.36,70*sc,'#ffd23a','center');txt(r+'位  '+fmtT(k.ftime),x+w/2,y+h*.36+46*sc,30*sc,'#fff','center');}
  if(n>1)txt('P'+(k.pi+1),x+w/2,y+m+26*sc,24*sc,['#ff6a4a','#4da3ff','#4ad08a','#ffd23a'][k.pi],'center');
  hc.restore();}
function drawMinimap(x,y,w,h,big,me){const tr=race.track,b=tr.bounds;const Ro=race.battle?tr.def.R+tr.def.w:0;const sx=race.battle?Ro*2:(b.maxX-b.minX),sz=race.battle?Ro*2:(b.maxZ-b.minZ);const s=Math.min(w/sx,h/sz)*.9;const ox=x+w/2,oy=y+h/2,cx=(b.minX+b.maxX)/2,cz=(b.minZ+b.maxZ)/2;
  const X=px=>ox-(px-cx)*s,Y=pz=>oy-(pz-cz)*s;hc.lineJoin='round';
  if(race.battle){hc.beginPath();hc.arc(X(0),Y(0),Ro*s,0,7);hc.fillStyle='rgba(255,253,246,.9)';hc.fill();hc.lineWidth=3;hc.strokeStyle='#141414';hc.stroke();hc.fillStyle='#8a6a4a';for(const p of tr.pillars){hc.beginPath();hc.arc(X(p.x),Y(p.z),Math.max(2,p.r*s),0,7);hc.fill();}}
  else{hc.beginPath();tr.S.forEach((p,i)=>i?hc.lineTo(X(p.x),Y(p.z)):hc.moveTo(X(p.x),Y(p.z)));hc.closePath();hc.strokeStyle='rgba(20,20,20,.75)';hc.lineWidth=Math.max(6,tr.W*s*2+4);hc.stroke();
  hc.strokeStyle='rgba(255,253,246,.9)';hc.lineWidth=Math.max(3,tr.W*s*2);hc.stroke();
  if(tr.br){const B=tr.br;hc.beginPath();B.S.forEach((p,i)=>i?hc.lineTo(X(p.x),Y(p.z)):hc.moveTo(X(p.x),Y(p.z)));hc.setLineDash([5,4]);hc.strokeStyle=B.kind==='dirt'?'#c98d4e':'#7de0a8';hc.lineWidth=Math.max(2.5,B.w*s*2);hc.stroke();hc.setLineDash([]);}
  const s0=tr.S[0];hc.strokeStyle='#141414';hc.lineWidth=3;hc.beginPath();hc.moveTo(X(s0.x+s0.nx*tr.W),Y(s0.z+s0.nz*tr.W));hc.lineTo(X(s0.x-s0.nx*tr.W),Y(s0.z-s0.nz*tr.W));hc.stroke();}
  for(const h of race.haz)if(h.type!=='trap'){hc.fillStyle=h.type==='missile'?'#3366ee':'#e23a3a';hc.fillRect(X(h.x)-2,Y(h.z)-2,4,4);}
  const ks=race.karts.slice().sort((a,b)=>(a.human?1:0)-(b.human?1:0));
  for(const k of ks){if(k.out)continue;const r=k.human?(big?8:6):4;hc.beginPath();hc.arc(X(k.x),Y(k.z),r,0,7);hc.fillStyle=k.ch.col;hc.fill();hc.lineWidth=k.human?3:1.5;hc.strokeStyle=k===me?'#ffd23a':'#141414';hc.stroke();
    if(k.human&&(big||race.humans.length>1)){txt('P'+(k.pi+1),X(k.x),Y(k.z)-10,12,'#fff','center');}else if(k.netHuman)txt((k.netName||'').slice(0,4),X(k.x),Y(k.z)-9,11,'#fff','center');}}

function bindMenu(cols,onBack,focus){menu.items=[...ui.querySelectorAll('[data-nav]')];menu.cols=cols||1;menu.onBack=onBack||null;menu.custom=null;menu.focus=clamp(focus||0,0,Math.max(0,menu.items.length-1));
  menu.items.forEach((el,i)=>{el.addEventListener('mouseenter',()=>{menu.focus=i;paintFocus();});el.addEventListener('click',()=>{audioInit();});});paintFocus();}
function paintFocus(){menu.items.forEach((el,i)=>el.classList.toggle('focus',i===menu.focus));}
function menuStep(devs){if(menu.custom&&menu.custom(devs))return;if(!menu.items.length)return;
  for(const id in devs){const p=devs[id].pressed;if(id==='touch'||id==='any')continue;let mv=0;
    if(p.left)mv=-1;if(p.right)mv=1;if(p.up)mv=-menu.cols;if(p.down)mv=menu.cols;
    const fe=menu.items[menu.focus];if(fe&&fe.dataset.vol&&(p.left||p.right)){volAdj(fe.dataset.vol,p.left?-1:1);return;}
    if(mv){const nf=menu.focus+mv;if(nf>=0&&nf<menu.items.length){menu.focus=nf;paintFocus();sfx('ui');}}
    if(p.confirm){sfx('ok');menu.items[menu.focus].click();return;}
    if(p.back&&menu.onBack){sfx('back');menu.onBack();return;}}}
function show(){ui.hidden=false;ui.classList.remove('overlay');touchEl.hidden=true;}

function padScreen(){app.screen='pad';show();const acts=[['accel','アクセル'],['brake','ブレーキ／バック'],['drift','ドリフト／ジャンプ'],['item','アイテム'],['confirm','メニュー：決定'],['back','メニュー：戻る']];

  if(wait){menu.custom=()=>{if(keys.has('Escape')){padScreen._wait=null;sfx('back');padScreen();return true;}
    const ps=navigator.getGamepads?[...navigator.getGamepads()]:[];for(let pi=0;pi<ps.length;pi++){const p=ps[pi];if(!p)continue;const snap=padScreen._snap[pi]||[];
      for(let b=0;b<p.buttons.length;b++){const on=p.buttons[b].pressed;if(on&&!snap[b]){PADMAP[wait]=[b];savePadmap();padScreen._wait=null;sfx('ok');for(const id in devPrev)devPrev[id]={...devPrev[id],confirm:true,back:true,accel:true,item:true,drift:true};padScreen();return true;}if(!on)snap[b]=false;}
      padScreen._snap[pi]=snap;}return true;};}}
function helpScreen(){app.screen='help';show();h(`<div class="wrap"><h2>あそびかた</h2>
 <div class="panel keys">
  <div><h3>コントローラー</h3><dl><dt>A</dt><dd>アクセル</dd><dt>B</dt><dd>ブレーキ／バック</dd><dt>R・RT</dt><dd>ジャンプ／ドリフト</dd><dt>L・LT・X</dt><dd>アイテム（押しっぱなしで後ろに構える）</dd><dt>スティック</dt><dd>ハンドル（上下で投げる向き）</dd><dt>START</dt><dd>ポーズ</dd></dl></div>

 </div><div class="row"><button class="btn" data-nav data-back>もどる</button><span class="hint">スマホはタッチ操作で1人プレイ（アクセルは自動）</span></div></div>`);

function joinScreen(){app.screen='join';show();if(!app.keepPlayers)app.players=[];app.keepPlayers=false;const max=app.mode==='ta'?1:4;const modeName={gp:'グランプリ',vs:'VSレース',battle:'バトル',ta:'タイムアタック'}[app.mode];
  const render=()=>{const sl=[];for(let i=0;i<4;i++){const p=app.players[i];if(i>=max){break;}
      if(!p){sl.push(`<div class="slot empty"><div class="pn">P${i+1}</div><div class="dev">参加するデバイスで決定ボタン<br>（A／Space／Enter）</div>${i===0?'<button class="btn" data-touchjoin style="margin-top:auto">タッチで参加</button>':''}</div>`);continue;}
      const c=CHARS[p.char];const st=c.st;
      sl.push(`<div class="slot${p.ok?' ok':''}"><div class="row" style="justify-content:space-between"><span class="pn">P${i+1}</span><span class="dev">${devName(p.dev)}</span></div>
       <canvas width="160" height="160" data-port="${i}"></canvas><div class="nm">${c.name}</div><div class="dev">${CLS[c.cls]}級</div>
       <div class="arrows"><button data-fprev="${i}">▲</button><span style="flex:3;text-align:center;font-weight:800;font-size:13px;align-self:center">${FRAMES[p.frame||0].name}</span><button data-fnext="${i}">▼</button></div>
       <div class="dev">${FRAMES[p.frame||0].desc}</div>
       <div class="stats">${(s=>[['スピード',s.spd],['加速',s.acc],['曲がり',s.hnd],['重さ',s.wgt],['オフロード',s.off],['ミニターボ',s.mt]])(kartStats(p.char,p.frame)).map(([l,v])=>`<span>${l}</span><span class="bar"><i style="width:${v/5*100}%"></i></span>`).join('')}</div>
       <div class="arrows"><button data-prev="${i}">◀</button><button data-ok="${i}">${p.ok?'取消':'決定'}</button><button data-next="${i}">▶</button></div>
       <button class="assist" data-assist="${i}" aria-pressed="${p.assist?'true':'false'}">アシスト：${p.assist?'ON':'OFF'}</button></div>`);}
    const allOk=app.players.length&&app.players.every(p=>p.ok);
    h(`<div class="wrap"><h2>${modeName}：参加とキャラ選択</h2><div class="slots">${sl.join('')}</div>
     <p class="hint">左右でキャラ、上下でカートの車体を変更。アイテムボタン（L／E／Enter）でアシスト（自動アクセル＋ハンドル補助）を切替。決定で確定、全員そろうと次へ。戻る：B／Q／Backspace</p>
     <div class="row"><button class="btn${allOk?'':' ghost'}" data-nav data-go ${allOk?'':'disabled'}>${allOk?'次へ':'全員の確定を待っています'}</button><button class="btn ghost" data-nav data-back>タイトルへ</button></div></div>`);
    ui.querySelectorAll('[data-port]').forEach(cv=>drawPortrait(cv,CHARS[app.players[+cv.dataset.port].char]));
    const tj=ui.querySelector('[data-touchjoin]');if(tj)tj.onclick=()=>{join('touch');};
    ui.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>cycle(+b.dataset.prev,-1));ui.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>cycle(+b.dataset.next,1));
    ui.querySelectorAll('[data-fprev]').forEach(b=>b.onclick=()=>fcycle(+b.dataset.fprev,-1));ui.querySelectorAll('[data-fnext]').forEach(b=>b.onclick=()=>fcycle(+b.dataset.fnext,1));
    ui.querySelectorAll('[data-assist]').forEach(b=>b.onclick=()=>toggleAssist(+b.dataset.assist));
    ui.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const p=app.players[+b.dataset.ok];p.ok=!p.ok;sfx(p.ok?'ok':'back');render();});
    ui.querySelector('[data-back]').onclick=titleScreen;const go=ui.querySelector('[data-go]');go.onclick=()=>{if(app.players.every(p=>p.ok)&&app.players.length)afterJoin();};
    menu.items=[];};
  const join=dev=>{if(app.players.length>=max||app.players.find(p=>p.dev===dev))return;const used=new Set(app.players.map(p=>p.char));let c=0;while(used.has(c))c++;app.players.push({dev,char:c,ok:false,assist:dev==='touch'});sfx('ok');render();};
  const fcycle=(i,d)=>{const p=app.players[i];if(!p||p.ok)return;p.frame=((p.frame||0)+d+FRAMES.length)%FRAMES.length;sfx('ui');render();};
  const toggleAssist=i=>{const p=app.players[i];if(!p||p.ok)return;p.assist=!p.assist;sfx('ui');render();};
  const cycle=(i,d)=>{const p=app.players[i];if(!p||p.ok)return;p.char=(p.char+d+CHARS.length)%CHARS.length;sfx('ui');render();};
  render();
  menu.custom=devs=>{for(const id in devs){const s=devs[id],pr=s.pressed;if(id==='touch'||id==='any')continue;const pi=app.players.findIndex(p=>p.dev===id);
      if(pi<0){if(pr.confirm)join(id);else if(pr.back&&!app.players.length){sfx('back');titleScreen();return true;}continue;}
      const p=app.players[pi];if(pr.left)cycle(pi,-1);if(pr.right)cycle(pi,1);if(pr.up)fcycle(pi,-1);if(pr.down)fcycle(pi,1);if(pr.item&&!pr.confirm&&!pr.back)toggleAssist(pi);
      if(pr.confirm){if(p.ok&&app.players.every(q=>q.ok)){afterJoin();return true;}if(!p.ok){p.ok=true;sfx('ok');render();}}
      if(pr.back){if(p.ok){p.ok=false;sfx('back');render();}else{app.players.splice(pi,1);sfx('back');render();}}}return true;};}
function drawPortrait(cv,c){const g=cv.getContext('2d');const W=cv.width;g.clearRect(0,0,W,W);g.fillStyle=c.col;g.globalAlpha=.18;for(let i=-4;i<8;i++){g.fillRect(i*28,0,12,W);}g.globalAlpha=1;
  g.lineJoin='round';g.lineCap='round';g.lineWidth=5;g.strokeStyle='#141414';const cx=W/2,cy=W*.58,R=W*.25;
  const P=f=>{g.fillStyle=f;g.fill();g.stroke();};const E=(x,y,rx,ry)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);};
  const eyes=(y)=>{g.fillStyle='#141414';E(cx-R*.35,y,R*.09,R*.14);g.fill();E(cx+R*.35,y,R*.09,R*.14);g.fill();};
  const smile=()=>{g.beginPath();g.arc(cx,cy+R*.32,R*.2,.15*Math.PI,.85*Math.PI);g.stroke();};
  // shoulders
  g.beginPath();g.ellipse(cx,W*1.02,W*.36,W*.24,0,Math.PI,0);P(c.head==='robot'?'#9aa0aa':c.col);
  switch(c.head){
  case'spiky':for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(cx+i*R*.3-R*.2,cy-R*.6);g.lineTo(cx+i*R*.36,cy-R*1.55+Math.abs(i)*R*.12);g.lineTo(cx+i*R*.3+R*.2,cy-R*.6);g.closePath();P(c.hair);}
    E(cx,cy,R,R*1.02);P(c.skin);g.beginPath();g.arc(cx,cy-R*.15,R*1.02,Math.PI*1.05,Math.PI*1.95);g.closePath();P(c.hair);
    g.beginPath();g.rect(cx-R*1.05,cy-R*.5,R*2.1,R*.26);P(c.col);E(cx-R*.38,cy-R*.37,R*.26,R*.2);P('#9fd8ff');E(cx+R*.38,cy-R*.37,R*.26,R*.2);P('#9fd8ff');eyes(cy+R*.05);smile();break;
  case'bunny':for(const sd of[-1,1]){g.save();g.translate(cx+sd*R*.45,cy-R*1.5);g.rotate(sd*.2);E(0,0,R*.28,R*.85);P(c.col);E(0,R*.05,R*.13,R*.6);g.fillStyle='#ffd9e6';g.fill();g.restore();}
    E(cx,cy,R*1.1,R*1.08);P(c.col);E(cx,cy+R*.15,R*.75,R*.68);P(c.skin);eyes(cy+R*.08);smile();break;
  case'horn':for(const sd of[-1,1]){g.beginPath();g.moveTo(cx+sd*R*.8,cy-R*.35);g.quadraticCurveTo(cx+sd*R*1.6,cy-R*.6,cx+sd*R*1.45,cy-R*1.5);g.lineTo(cx+sd*R*.95,cy-R*.75);g.closePath();P('#f2ead2');}
    E(cx,cy,R,R);P(c.skin);g.beginPath();g.arc(cx,cy-R*.1,R*1.08,Math.PI,0);g.closePath();P('#9a958e');g.beginPath();g.rect(cx-R*.1,cy-R*1.15,R*.2,R*1.05);P(c.acc2);
    g.beginPath();g.moveTo(cx-R*.75,cy+R*.25);g.quadraticCurveTo(cx,cy+R*1.5,cx+R*.75,cy+R*.25);g.closePath();P(c.hair);eyes(cy+R*.12);break;

function drawCourseMap(cv,i){const g=cv.getContext('2d');const S=buildSamples(COURSES[i]);let a=1e9,b=-1e9,c=1e9,d=-1e9,hy=1;for(const s of S){a=Math.min(a,s.x);b=Math.max(b,s.x);c=Math.min(c,s.z);d=Math.max(d,s.z);hy=Math.max(hy,s.y);}
  const sc=Math.min(cv.width/(b-a),cv.height/(d-c))*.82;const X=x=>cv.width/2-(x-(a+b)/2)*sc,Y=z=>cv.height/2-(z-(c+d)/2)*sc;
  const th=THEMES[COURSES[i].theme];g.fillStyle=th.ground;g.fillRect(0,0,cv.width,cv.height);g.lineCap='round';
  const ord=S.map((s,k)=>k).filter(k=>!S[k].gap).sort((p,q)=>S[p].y-S[q].y);
  for(const pass of[0,1])for(const k of ord){const s=S[k],t=S[(k+1)%S.length];g.beginPath();g.moveTo(X(s.x),Y(s.z));g.lineTo(X(t.x),Y(t.z));
    if(pass===0){g.strokeStyle='#141414';g.lineWidth=15;}else{const l=s.y/Math.max(hy,1);g.strokeStyle=s.open?'#ffb347':`rgb(${Math.round(110+120*l)},${Math.round(110+110*l)},${Math.round(125+90*l)})`;g.lineWidth=9;}g.stroke();}
  const br=buildBranch(COURSES[i],S,S.length,false);if(br){g.beginPath();br.S.forEach((p,k)=>k?g.lineTo(X(p.x),Y(p.z)):g.moveTo(X(p.x),Y(p.z)));g.setLineDash([6,5]);g.strokeStyle='#141414';g.lineWidth=7;g.stroke();g.strokeStyle=br.kind==='dirt'?'#e0a060':'#7de0a8';g.lineWidth=4;g.stroke();g.setLineDash([]);}
  const s0=S[0];g.fillStyle='#fff';g.beginPath();g.arc(X(s0.x),Y(s0.z),6,0,7);g.fill();g.lineWidth=3;g.strokeStyle='#141414';g.stroke();}

// ============ online：各自の端末で動かす方式 ============
// 中継は Firebase Realtime Database（np/kart2/...）。映像は送らず、カートの位置とアイテムの出来事だけを送り合う。
// ?np=local で同じブラウザ内（BroadcastChannel）だけでつながるテストモード。
// 通信は共通部品 netdb.js（ワナワナ・ランと同じ）
const NET_LOCAL=NetDB.LOCAL;
const NET={db:null,pid:'',code:'',host:false,meta:null,players:{},hc:0,race:null,listen:[],snap:{},sendT:0,pts:{},lastRaceId:'',name:'',me:{char:0,frame:0,ok:false},rooms:[],err:''};
function netName(){return NetDB.name.get()||'プレイヤー'+(100+Math.floor(Math.random()*900));}
NET.name=netName();NET.pid=(()=>{let p='';try{p=sessionStorage.getItem('tkgp_pid')||'';}catch(e){}if(!p){p='p'+Math.random().toString(36).slice(2,9);try{sessionStorage.setItem('tkgp_pid',p);}catch(e){}}return p;})();
// --- tiny database layer (Firebase or local emulation) ---
function dbOpen(){if(NET.db)return NET.db;const db=NetDB.open('kart2');if(!db){NET.err='通信の部品を読み込めませんでした。ネットにつながっているか確認して、ページを開き直してください。';return null;}NET.db=db;return db;}
function netRaceOff(){for(const f of NET.raceL||[])try{f();}catch(e){}NET.raceL=[];}
function netOff(){netRaceOff();for(const f of NET.listen)try{f();}catch(e){}NET.listen=[];}
function netSend(ev){if(!race||!race.net)return;ev.f=NET.pid;ev.k=++NET.hc;NET.db.set('r/'+NET.code+'/e/'+race.net.id+'/'+NET.pid+'_'+NET.hc,ev);}
function roomPath(x){return'r/'+NET.code+(x?'/'+x:'');}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}

// --- entering / leaving rooms ---
function netJoin(code,asHost){const db=dbOpen();if(!db){onlineScreen();return;}netOff();NET.code=code;NET.host=asHost;NET.meta=null;NET.seenMeta=false;NET.players={};NET.pts={};NET.lastRaceId='';NET.me.ok=false;
  const pp=roomPath('p/'+NET.pid);db.set(pp,{name:NET.name,char:NET.me.char,frame:NET.me.frame,ok:false,t:db.now()});db.dis(pp);
  if(asHost){const m={host:NET.pid,hostName:NET.name,st:'lobby',course:app.course||0,cc:1,cpu:app.cpuLv+1,t:db.now(),pts:{},mode:0};db.set(roomPath('m'),m);db.dis(roomPath('m'));db.dis(roomPath('e'));db.dis(roomPath('s'));
    NET.pub=NetDB.lobby.publish('kart',code,{host:NET.name,n:1,st:'lobby'});}
  NET.listen.push(db.on(roomPath('m'),'value',(k,v)=>{const prev=NET.meta;NET.meta=v;
    if(v)NET.seenMeta=true;if(!v&&!NET.seenMeta)return;
    if(!v){if(app.screen==='room'||app.screen==='race'&&race&&race.net||app.screen==='results'&&race&&race.net){netLeave('部屋がなくなりました（ホストが退出しました）');}return;}
    if(v.st==='race'&&v.race&&v.race.id!==NET.lastRaceId&&NET.players[NET.pid]&&v.race.grid.some(g=>g.rid===NET.pid)){NET.lastRaceId=v.race.id;startOnlineRace(v.race);return;}
    if(v.st==='lobby'&&(app.screen==='results'||app.screen==='race')&&race&&race.net){roomScreen();return;}
    if(app.screen==='results'&&race&&race.net&&race.net.gp&&!race.net.isHost&&v.gptsRace===race.net.id&&(!prev||prev.gptsRace!==v.gptsRace)){netResults();return;}
    if(app.screen==='room')roomScreen();}));
  NET.listen.push(db.on(roomPath('p'),'value',(k,v)=>{NET.players=v||{};if(NET.host&&NET.pub)NET.pub.update({n:Object.keys(NET.players).length});
    if(!NET.players[NET.pid]&&app.screen==='room'){netLeave('部屋から外れました');return;}
    {const ord=Object.entries(NET.players).sort((a,b)=>(a[1].t||0)-(b[1].t||0)).map(e=>e[0]);if(ord.indexOf(NET.pid)>=4){netLeave('部屋が満員です（4人まで）');return;}}
    if(app.screen==='room')roomScreen();}));
  app.screen='room';roomScreen();
  // a guest whose room does not exist gets told after a moment
  if(!asHost)setTimeout(()=>{if(NET.code===code&&!NET.meta&&app.screen==='room'){netLeave('部屋「'+code+'」が見つかりません。コードを確かめてください。');}},5000);}
function netLeave(msg){const db=NET.db;if(db&&NET.code){db.remove(roomPath('p/'+NET.pid));db.undis(roomPath('p/'+NET.pid));if(race&&race.net)db.remove(roomPath('s/'+NET.pid));
    if(NET.host){db.remove(roomPath());}}if(NET.pub){NET.pub.close();NET.pub=null;}
  netOff();NET.code='';NET.meta=null;if(race&&race.net){race.net=null;engineStop();music.stop();race=null;}NET.err=msg||'';onlineScreen();}

// --- screens ---
function onlineScreen(){app.screen='online';show();if(race){engineStop();race=null;}music.stop();const db=dbOpen();
  const q=new URLSearchParams(location.search).get('room');
  const list=(NET.rooms||[]).filter(r=>r.st==='lobby'&&(r.n||0)<4).slice(0,6).map(r=>[r.code,r]);

  let gpts={},gpn={};

    else{gpts=Object.assign({},gp.base||{});gpn=Object.assign({},gp.names||{});order.forEach((k,i)=>{const id=idOf(k);gpts[id]=(gpts[id]||0)+(PTS[i]||0);gpn[id]=label(k)+(k.netHuman||k.human?'':'（CPU）');});}}
  if(rn.isHost&&!rn.saved){rn.saved=true;const pts=Object.assign({},m.pts||{});if(!gp)order.forEach((k,i)=>{if(k.human||k.netHuman){const id=idOf(k);pts[id]=(pts[id]||0)+(PTS[i]||0);}});db.update(roomPath('m'),gp?{gpts,gpn,gptsRace:rn.id}:{pts});}
  const cup=gp?CUPS[gp.cup]:null,last=gp&&gp.i>=cup.courses.length-1;
  const table=gp?`<h2 style="font-size:22px">${cup.name}　${gp.i+1}/${cup.courses.length}レース目までの合計</h2><div class="panel"><table class="res">${Object.entries(gpts).sort((a,b)=>b[1]-a[1]).map(([id,v],i)=>`<tr class="${id===NET.pid?'me':''}"><td class="pos">${i+1}</td><td>${(gpn[id]||'').replace(/</g,'')}</td><td class="num">${v}pt</td></tr>`).join('')}</table></div>`:'';
  h(`<div class="wrap" style="max-width:620px"><h2>${r.track.def.name}　結果</h2><div class="panel"><table class="res">${rows}</table></div>${table}
   ${last?`<h2 style="font-size:24px;color:var(--sun)">グランプリ優勝：${((gpn[Object.entries(gpts).sort((a,b)=>b[1]-a[1])[0][0]])||'').replace(/</g,'')}</h2>`:''}
   <div class="menu cols2">${rn.isHost?(gp&&!last?`<button class="btn big" data-nav data-a="next">次のコースへ（${COURSES[cup.courses[gp.i+1]].name}）</button>`:`<button class="btn big" data-nav data-a="lobby">部屋にもどる</button>`):`<span class="hint">${gp&&!last?'ホストが次のコースを始めるのを待っています。':'ホストが部屋にもどると次を選べます。'}</span>`}<button class="btn big ghost" data-nav data-a="q">部屋を出る</button></div></div>`);
  bindMenu(2,null);const lb=ui.querySelector('[data-a=lobby]');if(lb)lb.onclick=()=>{NET.me.ok=false;db.update(roomPath('m'),{st:'lobby',race:null});if(NET.pub)NET.pub.update({st:'lobby'});
    for(const pid in NET.players)db.update(roomPath('p/'+pid),{ok:false});};
  const nx=ui.querySelector('[data-a=next]');if(nx)nx.onclick=()=>{nx.disabled=true;netStartRace(gp.i+1);};
  ui.querySelector('[data-a=q]').onclick=()=>netLeave('');}

// ============ main loop ============
let lastT=performance.now();const DT=1/120;
function frame(now){requestAnimationFrame(frame);let dt=(now-lastT)/1000;lastT=now;if(dt>.1)dt=.1;
  const devs=pollDevices();
  if(app.screen==='race'&&race){
    if(!app.paused&&race.phase==='intro'&&race.introT>.4){for(const id in devs){const p=devs[id].pressed;if(p.confirm||p.accel||p.item||p.drift){race.introT=race.introLen;break;}}}
    if(!app.paused&&!app.netMenu){for(const id in devs)if(devs[id].pressed.pause){if(race.net)netPauseMenu();else pauseMenu();for(const j in devs)devs[j].pressed={};break;}}
    if(app.netMenu)menuStep(devs);
    if(!app.paused){race.acc+=dt;let n=0;while(race.acc>=DT&&n<12){stepRace(DT);race.acc-=DT;n++;if(n===1)for(const id in devs)devs[id].pressed={};if(app.screen!=='race')break;}
      if(race&&race.net)netTick(dt);
      if(AU.ctx&&app.screen==='race'&&race)race.humans.forEach((k,i)=>{const inp=inputFor(k);engineSet(i,clamp(Math.abs(k.speed)/40,0,1),inp.accel,k.boostT>0,1/Math.sqrt(race.humans.length));});}
    else menuStep(devs);
  }else menuStep(devs);
  if(race&&(app.screen==='race'||app.screen==='results'))renderRace();}
document.fonts&&document.fonts.ready.then(()=>{});
addEventListener('gamepadconnected',()=>{if(app.screen==='title')titleScreen();});
AU.onInit=()=>{if(app.screen==='title'&&AU.on)music.start(4);};
titleScreen();if(new URLSearchParams(location.search).get('room'))onlineScreen();requestAnimationFrame(frame);
window.__g={app,get race(){return race;},startRace,launch,stepRace,COURSES,CHARS,NET,netJoin,netStartRace,onlineScreen};
</script>
