function drawStar(c,x,y,r,rot=0,fill=C.gold,lw=3){c.beginPath();for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5;const rad=i%2?r*.47:r;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}c.closePath();c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=C.ink;c.lineJoin='round';c.stroke()}}

/* ================= キャラクター ================= */
const CHARS=[
 {id:'frog',name:'ポコ',col:'#5cbf4a',dark:'#3d8b30',belly:'#dcf3a4'},
 {id:'rabbit',name:'ミミ',col:'#f58fb6',dark:'#c45f87',belly:'#ffe4ee'},
 {id:'bear',name:'クマタ',col:'#d98a3d',dark:'#9e5f27',belly:'#f6d6a8'},
 {id:'penguin',name:'ペンタ',col:'#3c74d6',dark:'#25509c',belly:'#ffffff'},
 {id:'cat',name:'ニャモ',col:'#f2c234',dark:'#b88a12',belly:'#fff3c8'},
 {id:'sheep',name:'モコ',col:'#9a73d9',dark:'#6b4caa',belly:'#f6f0e4'},
];
let NOW=0;
function eyes(c,x,y,r,sep,o,ci){
 const blink=((o.t*1000+ci*911)%3400)<110;
 const lx=(o.lx||0)*r*.35,ly=(o.ly||0)*r*.3;
 for(const sx of[-1,1]){const ex=x+sx*sep;
  if(o.mood==='happy'){c.beginPath();c.arc(ex,y+r*.35,r*.62,Math.PI*1.15,Math.PI*1.85);c.stroke();continue}
  if(o.mood==='dizzy'){c.beginPath();c.moveTo(ex-r*.5,y-r*.5);c.lineTo(ex+r*.5,y+r*.5);c.moveTo(ex+r*.5,y-r*.5);c.lineTo(ex-r*.5,y+r*.5);c.stroke();continue}
  if(o.mood==='sad'){c.beginPath();c.moveTo(ex-r*.6,y+(sx<0?-r*.2:r*.2));c.lineTo(ex+r*.6,y+(sx<0?r*.2:-r*.2));c.stroke();continue}
  if(blink){c.beginPath();c.moveTo(ex-r*.65,y);c.lineTo(ex+r*.65,y);c.stroke();continue}
  c.fillStyle='#fff';ell(c,ex,y,r*.78,r);c.fill();c.stroke();
  c.fillStyle=C.ink;ell(c,ex+lx,y+ly+r*.08,r*.42,r*.56);c.fill();
  c.fillStyle='#fff';circ(c,ex+lx-r*.14,y+ly-r*.16,r*.16);c.fill();
 }
}
function drawChar(c,ci,x,y,s,o={}){
 const ch=CHARS[ci];const lw=Math.max(1.6,s*.085);const t=o.t!==undefined?o.t:NOW;
 c.save();c.translate(x,y);if(o.alpha!==undefined)c.globalAlpha*=o.alpha;
 if(!o.noShadow){c.fillStyle='rgba(25,15,45,.25)';ell(c,0,s*.95,s*.78,s*.2);c.fill()}
 c.translate(0,-(o.jump||0));if(o.rot)c.rotate(o.rot);
 const sq=o.sq||0;c.scale(1+sq*.14,1-sq*.14);
 c.lineWidth=lw;c.strokeStyle=C.ink;c.lineJoin='round';c.lineCap='round';
 const look={t,lx:o.lx||0,ly:o.ly||0,mood:o.mood};const id=ch.id;
 c.fillStyle=ch.dark;for(const fx of[-.4,.4]){ell(c,fx*s,s*.86,s*.28,s*.15);c.fill();c.stroke()}
 if(id==='rabbit'){for(const sx of[-1,1]){c.save();c.translate(sx*s*.3,-s*.82);c.rotate(sx*.18);c.fillStyle=ch.col;ell(c,0,-s*.36,s*.19,s*.5);c.fill();c.stroke();c.fillStyle='#ffc4d8';ell(c,0,-s*.34,s*.08,s*.34);c.fill();c.restore()}}
 if(id==='bear'){for(const sx of[-1,1]){c.fillStyle=ch.col;circ(c,sx*s*.58,-s*.68,s*.24);c.fill();c.stroke();c.fillStyle=ch.belly;circ(c,sx*s*.58,-s*.68,s*.11);c.fill()}}
 if(id==='cat'){for(const sx of[-1,1]){c.fillStyle=ch.col;c.beginPath();c.moveTo(sx*s*.8,-s*.3);c.lineTo(sx*s*.64,-s*1.06);c.lineTo(sx*s*.18,-s*.8);c.closePath();c.fill();c.stroke();c.fillStyle='#ffb3c7';c.beginPath();c.moveTo(sx*s*.68,-s*.45);c.lineTo(sx*s*.6,-s*.86);c.lineTo(sx*s*.34,-s*.72);c.closePath();c.fill()}}
 if(id==='penguin'){c.fillStyle=ch.dark;for(const sx of[-1,1]){c.save();c.translate(sx*s*.86,s*.15);c.rotate(sx*-.5);ell(c,0,0,s*.14,s*.36);c.fill();c.stroke();c.restore()}}
 if(id==='sheep'){c.fillStyle=ch.belly;for(let k=0;k<11;k++){const a=k/11*Math.PI*2;circ(c,Math.cos(a)*s*.8,Math.sin(a)*s*.84-s*.02,s*.3);c.fill();c.stroke()}}
 c.fillStyle=id==='sheep'?ch.belly:ch.col;ell(c,0,0,s*.9,s*.95);c.fill();if(id!=='sheep')c.stroke();
 if(id!=='sheep'){c.fillStyle=ch.belly;ell(c,0,s*.4,s*.56,s*.44);c.fill()}
 c.fillStyle='rgba(255,120,150,.35)';
 if(id==='frog'){
  c.fillStyle=ch.col;for(const sx of[-1,1]){circ(c,sx*s*.38,-s*.8,s*.3);c.fill();c.stroke()}

  c.beginPath();c.arc(0,-s*.22,s*.46,Math.PI*.18,Math.PI*.82);c.stroke();
  c.fillStyle='rgba(255,120,150,.4)';ell(c,-s*.55,-s*.05,s*.12,s*.07);c.fill();ell(c,s*.55,-s*.05,s*.12,s*.07);c.fill();
 }else if(id==='rabbit'){
  eyes(c,0,-s*.25,s*.17,s*.3,look,ci);
  c.fillStyle='#e8628f';c.beginPath();c.moveTo(-s*.07,-s*.04);c.lineTo(s*.07,-s*.04);c.lineTo(0,s*.05);c.closePath();c.fill();
  c.beginPath();c.moveTo(-s*.12,s*.1);c.quadraticCurveTo(-s*.06,s*.18,0,s*.08);c.quadraticCurveTo(s*.06,s*.18,s*.12,s*.1);c.stroke();
  c.fillStyle='rgba(255,90,130,.35)';ell(c,-s*.5,0,s*.12,s*.07);c.fill();ell(c,s*.5,0,s*.12,s*.07);c.fill();
 }else if(id==='bear'){

  c.fillStyle='#f7a12a';c.beginPath();c.moveTo(-s*.16,-s*.08);c.lineTo(s*.16,-s*.08);c.lineTo(0,s*.12);c.closePath();c.fill();c.stroke();
 }else if(id==='cat'){
  c.strokeStyle=ch.dark;for(const k of[-1,0,1]){c.beginPath();c.moveTo(k*s*.14,-s*.88);c.lineTo(k*s*.12,-s*.68);c.stroke()}c.strokeStyle=C.ink;

  c.fillStyle=ch.col;for(const sx of[-1,1]){c.save();c.translate(sx*s*.55,-s*.18);c.rotate(sx*.35);ell(c,0,0,s*.22,s*.1);c.fill();c.stroke();c.restore()}

function drawGuide(c,x,y,s){ // 案内役のカモメ「トト」

 c.fillStyle='#2a4d8f';c.beginPath();c.moveTo(-s*.55,-s*.62);c.quadraticCurveTo(0,-s*1.15,s*.55,-s*.62);c.closePath();c.fill();c.stroke();

function drawVillain(c,x,y,s,t){ // 雷雲の王「ドンガラ」
 c.save();c.translate(x,y+Math.sin(t*2.2)*s*.05);
 if((t*2.7%1)<.18){c.strokeStyle=C.gold;c.lineWidth=s*.07;c.lineJoin='miter';c.beginPath();c.moveTo(-s*.9,s*.2);c.lineTo(-s*1.1,s*.6);c.lineTo(-s*.95,s*.62);c.lineTo(-s*1.2,s*1.05);c.stroke();c.beginPath();c.moveTo(s*.9,s*.3);c.lineTo(s*1.15,s*.7);c.lineTo(s*1.0,s*.72);c.lineTo(s*1.25,s*1.1);c.stroke()}
 const cl=[[-.62,.1,.5],[0,-.22,.66],[.62,.1,.5],[-.28,.36,.46],[.32,.36,.46]];

 for(const sx of[-1,1]){c.fillStyle='#fff';c.beginPath();c.ellipse(sx*s*.25,-s*.18,s*.16,s*.13,0,0,7);c.fill();c.stroke();c.fillStyle='#e23b2e';circ(c,sx*s*.22,-s*.15,s*.07);c.fill();

 c.fillStyle='#2a1838';c.beginPath();c.moveTo(-s*.4,s*.12);c.quadraticCurveTo(0,s*.5,s*.4,s*.12);c.closePath();c.fill();c.stroke();
 c.fillStyle='#fff';for(let k=0;k<4;k++){const tx=-s*.3+k*s*.2;c.beginPath();c.moveTo(tx,s*.13);c.lineTo(tx+s*.1,s*.13);c.lineTo(tx+s*.05,s*.24);c.closePath();c.fill()}

}

/* ================= せってい保存 ================= */
const OPT_KEY='kk_opt_v1',SAVE_KEY='kk_save_v1';
function loadOpt(){const d={turns:1,lv:1,tempo:0,bonus:0,swap:0,board:0,mgrule:0};const lim={turns:3,lv:3,tempo:2,bonus:2,swap:3,board:3,mgrule:3};try{const s=JSON.parse(localStorage.getItem(OPT_KEY)||'null');if(s&&typeof s==='object')for(const k in d)if(Number.isInteger(s[k])&&s[k]>=0&&s[k]<lim[k])d[k]=s[k]}catch(e){}return d}
function saveOpt(o){try{localStorage.setItem(OPT_KEY,JSON.stringify(o))}catch(e){}}

function mkActor(pi,x,y){return{pi,ci:P(pi).ci,x,y,vx:0,vy:0,r:26,alive:true,face:1,t:rand(0,5),stun:0,score:0,deadT:0,dvx:0,dvy:0,rot:0}}

MGS.coin={name:'コインラッシュ',modes:['ffa','2v2'],desc:m=>m==='ffa'?'ふってくる コインを あつめよう！ 金の大コインは 5枚ぶん。ばくだんに 当たると コインを 落とすよ。いちばん 多く あつめた人の 勝ち。':'チームで コインを あつめよう！ 2人の 合計が 多いチームの 勝ち。ばくだんに 注意！',ctl:'いどう：スティック / 十字 / WASD / 矢印',
 create(mode,teams){const ar={x:140,y:150,w:1000,h:500};const pos=[[260,270],[1020,270],[260,530],[1020,530]];
  const g={ar,time:25,coins:[],bombs:[],st:0,bt:2.4,ai:[],done:false,actors:[0,1,2,3].map(i=>mkActor(i,pos[i][0],pos[i][1])),tgt:[null,null,null,null],rt:[0,0,0,0]};
  g.update=dt=>{g.time-=dt;if(g.time<=0){g.time=0;g.done=true;return}
   g.st-=dt;if(g.st<=0&&g.coins.length<18){g.st=.26;g.coins.push({x:rand(ar.x+30,ar.x+ar.w-30),y:rand(ar.y+30,ar.y+ar.h-30),v:Math.random()<.1?5:1,t:0,fly:0})}
   g.bt-=dt;if(g.bt<=0){g.bt=rand(1.1,2.0)*(g.time>10?1:.7);const tg=Math.random()<.5?pick(g.actors):null;g.bombs.push({x:clamp(tg?tg.x+rand(-40,40):rand(ar.x+60,ar.x+ar.w-60),ar.x+40,ar.x+ar.w-40),y:clamp(tg?tg.y+rand(-40,40):rand(ar.y+60,ar.y+ar.h-60),ar.y+40,ar.y+ar.h-40),t:1.1,T:1.1,r:72})}
   for(let i=g.bombs.length-1;i>=0;i--){const b=g.bombs[i];b.t-=dt;if(b.t<=0){sfx('boom');burst(b.x,b.y,24,['#ffb347','#ff6b3d','#fff2a8','#555'],{max:320});g.shake=.3;
     for(const a of g.actors){if(Math.hypot(a.x-b.x,a.y-b.y)<b.r+a.r*.5&&a.stun<=0){a.stun=1.2;const lost=Math.min(3,a.score);a.score-=lost;if(lost)floatText(a.x,a.y-70,'-'+lost,'#ff8a7a');
      for(let k=0;k<lost;k++)g.coins.push({x:clamp(a.x+rand(-80,80),ar.x+20,ar.x+ar.w-20),y:clamp(a.y+rand(-80,80),ar.y+20,ar.y+ar.h-20),v:1,t:0,fly:.5})}}g.bombs.splice(i,1)}}
   g.think(dt);
   for(const a of g.actors){const inp=a.stun>0?{x:0,y:0}:mgIn(g,a.pi);a.stun=Math.max(0,a.stun-dt);moveActor(a,inp,295,dt,ar)}separate(g.actors);
   for(let i=g.coins.length-1;i>=0;i--){const c0=g.coins[i];c0.t+=dt;c0.fly=Math.max(0,c0.fly-dt);if(c0.fly>0)continue;for(const a of g.actors){if(a.stun>0)continue;if(Math.hypot(a.x-c0.x,a.y-12-c0.y)<a.r+16){a.score+=c0.v;sfx('coin');burst(c0.x,c0.y,6,[C.gold,'#fff'],{max:150});if(c0.v>1)floatText(c0.x,c0.y-20,'+5',C.gold,{size:24});g.coins.splice(i,1);break}}}
   g.shake=Math.max(0,(g.shake||0)-dt)};
  g.think=dt=>{const lv=LV();for(const a of g.actors){const i=a.pi;if(P(i).human)continue;g.rt[i]-=dt;
    const haz=g.bombs.map(b=>({x:b.x,y:b.y,r:b.r,t:b.t}));const dodge=lv>0?dodgeDir(a,haz,[0,.6,.95][lv],ar,30):null;if(dodge){g.ai[i]={x:dodge.x,y:dodge.y};continue}
    if(g.rt[i]<=0||!g.tgt[i]||!g.coins.includes(g.tgt[i])){g.rt[i]=[.6,.32,.14][lv]+rand(0,.15);let best=null,bs=1e9;for(const c0 of g.coins){const s=Math.hypot(c0.x-a.x,c0.y-a.y)-c0.v*70+(lv===0?rand(0,200):rand(0,40));if(s<bs){bs=s;best=c0}}g.tgt[i]=best}
    const t=g.tgt[i];g.ai[i]=t?seek(a,t.x,t.y+12,6):{x:0,y:0};if(lv===0){g.ai[i].x*=.8;g.ai[i].y*=.8}}};
  g.vals=()=>g.actors.map(a=>a.score);
  g.winners=()=>scoreWinners(g.vals(),mode,teams);
  g.scores=()=>g.actors.map(a=>a.score);
  g.draw=c=>{mgBG(c,'#9fd8f0','#5fb0d8');c.save();if(g.shake)c.translate(rand(-6,6)*g.shake*3,rand(-6,6)*g.shake*3);drawFloor(c,ar,'grass');
   for(const b of g.bombs){const k=1-b.t/b.T;c.fillStyle=`rgba(40,20,40,${.15+k*.3})`;ell(c,b.x,b.y,b.r*(.4+k*.6),b.r*(.4+k*.6)*.55);c.fill();c.strokeStyle=(b.t*8%1)<.5?C.red:'#fff';c.lineWidth=3;ell(c,b.x,b.y,b.r,b.r*.55);c.stroke();
    const by=b.y-(b.t/b.T)*420;c.fillStyle=C.ink;circ(c,b.x,by-14,16);c.fill();c.fillStyle='#444';circ(c,b.x-5,by-19,5);c.fill();c.strokeStyle='#c98a06';c.lineWidth=3;c.beginPath();c.moveTo(b.x+8,by-28);c.lineTo(b.x+14,by-36);c.stroke()}
   for(const c0 of g.coins){const s=c0.v>1?17:11;const bob=Math.sin(NOW*5+c0.x)*3;c.fillStyle='rgba(0,0,0,.18)';ell(c,c0.x,c0.y+s,s*.8,s*.25);c.fill();const sc=Math.min(1,c0.t*5);c.save();c.translate(c0.x,c0.y-bob);c.scale(Math.abs(Math.cos(NOW*3+c0.y))*.5+.5,1);drawCoin(c,0,0,s*sc);c.restore()}
   const as=g.actors.slice().sort((a,b)=>a.y-b.y);for(const a of as){drawActor(c,a);txt(c,''+a.score,a.x,a.y-a.r*2.6,{s:20,f:FD,w:400,col:'#fff',st:teamCol(teams,a.pi),sw:6})}
   c.restore();drawMGTop(c,'コインラッシュ',g.time,mode==='ffa'?g.vals():g.vals(),teams);
   if(mode!=='ffa'){const ts=teams.groups.map(gr=>gr.reduce((s,i)=>s+g.actors[i].score,0));rr(c,W/2-150,82,300,40,20);c.fillStyle=C.ink;c.fill();txt(c,`${ts[0]}`,W/2-60,102,{s:26,f:FD,w:400,col:teams.colors[0]});txt(c,'VS',W/2,102,{s:18,col:'#fff'});txt(c,`${ts[1]}`,W/2+60,102,{s:26,f:FD,w:400,col:teams.colors[1]})}};
  return g}};
MGS.mash={name:'れんだダッシュ',modes:['ffa','1v1'],desc:m=>m==='1v1'?'1対1の 早ぬけ勝負！ ボタンを れんだして 先に ゴールした方の 勝ち。長押しは きかないよ。':'ボタンを れんだして ゴールまで 走りきれ！ いちばん早く ゴールした人の 勝ち。長押しは きかないよ。',ctl:'れんだ：A / Space / Enter',
 create(mode,teams){const PL=PLs(teams);const goal=1110;const g={x:[150,150,150,150],v:[0,0,0,0],fin:[null,null,null,null],t:0,done:false,ai:[],np:[0,1,2,3].map(()=>rand(.2,.45)),firstT:null,dust:[]};
  const laneY=i=>{const k=PL.indexOf(i),n=PL.length;return 400+(k-(n-1)/2)*110};
  g.update=dt=>{g.t+=dt;g.think(dt);for(const i of PL){if(g.fin[i]!==null)continue;const inp=mgIn(g,i);if(inp.a){g.v[i]+=48;if(P(i).human)sfx('tick');g.dust.push({x:g.x[i]-20,y:laneY(i),l:.4})}
    g.v[i]*=Math.exp(-2.6*dt);g.x[i]+=g.v[i]*dt;if(g.x[i]>=goal){g.x[i]=goal;g.fin[i]=g.t;sfx('ok');if(g.firstT===null)g.firstT=g.t;burst(goal,laneY(i),14,[C.gold,'#fff'],{max:200})}}
   for(let i=g.dust.length-1;i>=0;i--){g.dust[i].l-=dt;if(g.dust[i].l<=0)g.dust.splice(i,1)}
   if(PL.every(i=>g.fin[i]!==null)||g.t>=22||(g.firstT!==null&&g.t-g.firstT>3))g.done=true};
  g.think=dt=>{const lv=LV();for(const i of PL){if(P(i).human)continue;g.np[i]-=dt;if(g.np[i]<=0){g.np[i]=1/[6.2,8.2,10.1][lv]*rand(.75,1.25);g.ai[i]={a:true}}else g.ai[i]={a:false}}};
  g.scores=()=>[0,1,2,3].map(i=>!PL.includes(i)?-1e9:g.fin[i]!==null?1e6-g.fin[i]*1000:g.x[i]);
  g.winners=()=>{const s=g.scores();const m=Math.max(...PL.map(i=>s[i]));return PL.filter(i=>Math.abs(s[i]-m)<1e-6)};
  g.draw=c=>{mgBG(c,'#ffd9a0','#ffb86b');c.fillStyle='#7cc65a';c.fillRect(0,180,W,H-180);
   for(const i of PL){const y=laneY(i);rr(c,100,y-36,1080,72,16);c.fillStyle='#d9895a';c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();c.strokeStyle='rgba(255,255,255,.5)';c.setLineDash([18,16]);c.lineWidth=3;c.beginPath();c.moveTo(120,y+36);c.lineTo(1160,y+36);c.stroke();c.setLineDash([])}
   const top=laneY(PL[0])-36,bot=laneY(PL[PL.length-1])+36;for(let y=top,k=0;y<bot;y+=28,k++){const h=Math.min(28,bot-y);c.fillStyle=k%2?'#fff':C.ink;c.fillRect(goal+6,y,14,h);c.fillStyle=k%2?C.ink:'#fff';c.fillRect(goal+20,y,14,h)}
   for(const d of g.dust){c.fillStyle=`rgba(255,255,255,${d.l*1.5})`;circ(c,d.x-(.4-d.l)*80,d.y+10,8+(.4-d.l)*20);c.fill()}
   for(const i of PL){const y=laneY(i);const run=g.fin[i]===null&&g.v[i]>20;drawChar(c,P(i).ci,g.x[i],y-8,28,{jump:run?Math.abs(Math.sin(g.t*18+i))*10:0,lx:1,mood:g.fin[i]!==null?'happy':null,rot:run?.12:0});
    if(g.fin[i]!==null){const rank=PL.filter(j=>g.fin[j]!==null&&g.fin[j]<g.fin[i]-1e-6).length+1;txt(c,rank+'着',g.x[i]-70,y-10,{s:26,f:FD,w:400,col:rank===1?C.gold:'#fff',st:C.ink,sw:6})}
    if(P(i).human&&g.fin[i]===null)txt(c,aLabel(P(i).dev)+'れんだ！',60,y,{s:16,col:'#fff',st:C.ink,sw:5})}
   drawMGTop(c,'れんだダッシュ',Math.max(0,22-g.t),null,teams)};
  return g}};
MGS.quick={name:'はやおしランプ',modes:['ffa','1v1'],desc:m=>(m==='1v1'?'1対1の 早押し勝負！ ':'')+'ランプが みどりに 光ったら すぐ ボタン！ 黄色は フェイク。早く押すと その回は 失格。3回勝負で いちばん 勝った人の 勝ち。',ctl:'おす：A / Space / Enter',
 create(mode,teams){const PL=PLs(teams);const g={round:1,phase:'wait',timer:0,fake:-1,fakeT:0,goT:0,after:0,pts:[0,0,0,0],out:[false,false,false,false],win:-1,done:false,ai:[],plan:[null,null,null,null],msg:''};
  const startRound=()=>{g.phase='wait';g.timer=rand(1.6,4.2);g.fake=g.round>1&&Math.random()<.65?rand(.5,g.timer-.6):-1;g.fakeT=0;g.out=[0,1,2,3].map(i=>!PL.includes(i));g.win=-1;g.plan=[null,null,null,null]};
  startRound();
  g.update=dt=>{g.think(dt);
   if(g.phase==='wait'){g.timer-=dt;if(g.fake>0){g.fake-=dt;if(g.fake<=0){g.fakeT=.5;sfx('beep')}}g.fakeT=Math.max(0,g.fakeT-dt);
    for(const i of PL){if(g.out[i])continue;if(mgIn(g,i).a){g.out[i]=true;sfx('lose')}}
    if(PL.every(i=>g.out[i])){g.phase='after';g.after=1.4;g.msg='みんな フライング！'}else if(g.timer<=0){g.phase='go';g.goT=0;sfx('go')}}
   else if(g.phase==='go'){g.goT+=dt;const hits=PL.filter(i=>!g.out[i]&&mgIn(g,i).a);
    if(hits.length){const w=pick(hits);g.win=w;g.pts[w]++;g.phase='after';g.after=1.6;g.msg=`${pname(P(w))}！ ${g.goT.toFixed(3)}びょう`;sfx('ok')}else if(g.goT>3){g.phase='after';g.after=1.2;g.msg='だれも おさなかった…'}}
   else if(g.phase==='after'){g.after-=dt;if(g.after<=0){if(g.round>=3)g.done=true;else{g.round++;g.msg='';startRound()}}}};
  g.think=dt=>{const lv=LV();for(const i of PL){if(P(i).human)continue;g.ai[i]={a:false};if(g.out[i])continue;
    if(g.phase==='wait'&&g.fakeT>0&&g.plan[i]===null){g.plan[i]=Math.random()<[.3,.12,.04][lv]?{t:.25}:{t:-1}}
    if(g.phase==='wait'&&g.plan[i]&&g.plan[i].t>0){g.plan[i].t-=dt;if(g.plan[i].t<=0)g.ai[i]={a:true}}
    if(g.phase==='go'){if(!g.plan[i]||g.plan[i].go===undefined)g.plan[i]={go:[.42,.31,.235][lv]+rand(0,.12)};if(g.goT>=g.plan[i].go)g.ai[i]={a:true}}}};
  g.scores=()=>[0,1,2,3].map(i=>PL.includes(i)?g.pts[i]:-1e9);
  g.winners=()=>{const s=g.scores();const m=Math.max(...PL.map(i=>s[i]));if(m<=0)return[];return PL.filter(i=>s[i]===m)};
  g.draw=c=>{mgBG(c,'#2b3a67','#141d38');const col=g.phase==='go'?'#4cff7a':g.fakeT>0?'#ffd54a':'#ff4a3d';
   c.fillStyle='#3a3048';c.fillRect(620,150,40,250);c.lineWidth=5;c.strokeStyle=C.ink;c.strokeRect(620,150,40,250);
   const rg=c.createRadialGradient(640,170,10,640,170,180);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=.55;c.fillStyle=rg;circ(c,640,170,180);c.fill();c.globalAlpha=1;
   circ(c,640,170,74);c.fillStyle='#2a2238';c.fill();c.stroke();circ(c,640,170,58);c.fillStyle=col;c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.45)';ell(c,620,150,18,10);c.fill();
   txt(c,g.phase==='go'?'いまだ！':g.phase==='wait'?(g.fakeT>0?'……？':'まて…'):g.msg,640,290,{s:g.phase==='after'?30:40,f:FD,w:400,col:'#fff',st:C.ink,sw:8});
   txt(c,`ラウンド ${g.round} / 3`,640,110,{s:22,col:'#cfd8ff'});
   c.fillStyle='#6b4b2a';c.fillRect(0,560,W,160);c.fillStyle='#8a6237';for(let x=0;x<W;x+=80)c.fillRect(x,560,74,160);
   PL.forEach((i,k)=>{const x=640+(k-(PL.length-1)/2)*280,y=540;const out=g.out[i],win=g.win===i;
    rr(c,x-60,y+40,120,44,14);c.fillStyle=win?C.gold:'#e8e0f0';c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();
    drawChar(c,P(i).ci,x,y-20,40,{mood:out?'dizzy':win?'happy':null,jump:win?Math.abs(Math.sin(NOW*10))*14:0});
    for(let k2=0;k2<g.pts[i];k2++)drawStar(c,x-24+k2*24,y-100,11,0,C.gold,2.5);
    if(out)txt(c,'フライング',x,y+62,{s:18,col:C.red});else txt(c,P(i).human?aLabel(P(i).dev):'COM',x,y+62,{s:18})});
   drawMGTop(c,'はやおしランプ',null,mode==='ffa'?g.pts:null,teams)};
  return g}};
MGS.stop10={name:'ピタリ10びょう',modes:['ffa','1v1'],desc:()=>'心の中で 10秒 かぞえて ボタンで ストップ！ 3秒すぎると 時計が 見えなくなるよ。10.00秒に いちばん 近い人の 勝ち。',ctl:'ストップ：A / Space / Enter',
 create(mode,teams){const PL=PLs(teams);const lv=LV();const g={t:0,st:[0,1,2,3].map(i=>PL.includes(i)?null:-1),tgt:[0,1,2,3].map(()=>10+gauss()*[.7,.35,.14][lv]),reveal:-1,done:false,ai:[]};
  g.update=dt=>{if(g.reveal>=0){g.reveal+=dt;if(g.reveal>3.2)g.done=true;return}g.t+=dt;
   for(const i of PL){if(g.st[i]!==null)continue;const hum=P(i).human;if(hum?Input.pressed(P(i).dev,'a'):g.t>=g.tgt[i]){g.st[i]=g.t;if(hum)sfx('hit')}}
   if(PL.every(i=>g.st[i]!==null)||g.t>=15){for(const i of PL)if(g.st[i]===null)g.st[i]=15;g.reveal=0;sfx('drum')}};
  g.scores=()=>[0,1,2,3].map(i=>PL.includes(i)?-Math.abs(g.st[i]-10):-1e9);
  g.winners=()=>{const s=g.scores();const m=Math.max(...PL.map(i=>s[i]));return PL.filter(i=>m-s[i]<.0005)};
  g.draw=c=>{mgBG(c,'#bfe3d6','#7ac2a8');const cx=640,cy=290;
   circ(c,cx,cy,160);c.fillStyle='#fff';c.fill();c.lineWidth=10;c.strokeStyle=C.ink;c.stroke();rr(c,cx-24,cy-200,48,34,8);c.fillStyle=C.red;c.fill();c.lineWidth=5;c.stroke();
   for(let k=0;k<60;k++){const a=k/60*Math.PI*2;const r1=k%5?146:132;c.lineWidth=k%5?2:5;c.beginPath();c.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);c.lineTo(cx+Math.cos(a)*152,cy+Math.sin(a)*152);c.stroke()}
   const vis=g.t<3||g.reveal>=0;const a=(g.t/60)*Math.PI*2*6-Math.PI/2;if(vis){c.lineWidth=6;c.strokeStyle=C.red;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*126,cy+Math.sin(a)*126);c.stroke()}
   txt(c,vis?g.t.toFixed(2):'?.??',cx,cy+60,{s:56,f:FD,w:400,col:vis?C.ink:'#b3aac4'});
   PL.forEach((i,k)=>{const x=640+(k-(PL.length-1)/2)*280,y=560;drawChar(c,P(i).ci,x,y,36,{mood:g.reveal>1.2&&g.winners().includes(i)?'happy':null});
    rr(c,x-82,y+46,164,50,14);c.fillStyle=g.st[i]!==null?'#fff':'rgba(255,255,255,.5)';c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();
    if(g.reveal>=0&&g.reveal>.4+k*.25){const d=g.st[i]-10;txt(c,g.st[i].toFixed(2),x,y+64,{s:24,f:FD,w:400});txt(c,(d>=0?'+':'')+d.toFixed(2),x,y+86,{s:14,col:Math.abs(d)<.3?C.greenD:C.redD})}
    else txt(c,g.st[i]!==null?'ストップ！':(P(i).human?aLabel(P(i).dev)+'でストップ':'…'),x,y+71,{s:19})});
   drawMGTop(c,'ピタリ10びょう',null,null,teams)};
  return g}};
MGS.sumo={name:'おしだしずもう',modes:['ffa','2v2','1v1','1v3'],roles:m=>m==='1v3'?['大きくて おもい！ 3人を おしだせ','3人で ちからを あわせて おしだせ']:['チームで おしだせ','チームで おしだせ'],
 desc:m=>m==='1v3'?'1人チームは 大きくて おもい！ 3人を ぜんいん おしだすか、30秒 のこれば 勝ち。3人チームは 力を あわせて 1人を おしだせ！ Aで タックル。':m==='2v2'?'チームで あいてを 土俵から おしだせ！ Aで タックル。なかまにも ぶつかるので 注意。時間切れのとき 多く のこったチームの 勝ち。':'まるい 土俵から あいてを おしだせ！ Aで タックル。さいごまで のこった人の 勝ち。15秒すぎると 土俵が せまくなるよ。',
 ctl:'いどう：スティック / 十字　タックル：A',
 create(mode,teams){const PL=PLs(teams);const CX=640,CY=430,SY=.62;const g={R:270,el:0,dur:30,done:false,ai:[],endT:-1,lastDeath:[]};
  const solo1=mode==='1v3'?teams.groups[0][0]:-1;const TM=mode==='2v2'||mode==='1v3';

  const alive=()=>g.actors.filter(a=>a.alive);const enemy=(a,b)=>!TM||teamOf(teams,a.pi)!==teamOf(teams,b.pi);

   L.concat(R).forEach((i,k)=>{if(P(i).human){const x=k<L.length?140:1140;txt(c,`${pname(P(i))} ${aLabel(P(i).dev)}れんだ！`,x,600+(k%3)*30,{s:16,col:'#fff',st:C.ink,sw:5})}});
   drawMGTop(c,'つなひき',g.time,null,teams)};

 ctl:'いどう：スティック / 十字　なげる：A（向いている ほうへ）',

  for(let k=0;k<3;k++)g.balls.push({x:440+k*200,y:400});

   const total=g.balls.length+g.fly.length+g.actors.filter(a=>a.alive&&a.hold).length;g.spawn-=dt;if(total<4&&g.spawn<=0){g.spawn=.6;g.balls.push({x:rand(ar.x+80,ar.x+ar.w-80),y:rand(ar.y+60,ar.y+ar.h-60)})}

   for(const a of g.actors){if(!a.alive){a.deadT+=dt;a.x+=a.dvx*dt;a.y+=a.dvy*dt;a.dvy+=900*dt;a.rot+=dt*8;continue}a.inv=Math.max(0,a.inv-dt);const inp=mgIn(g,a.pi);
    const m=Math.hypot(inp.x||0,inp.y||0);if(m>.2){a.fx=inp.x/m;a.fy=inp.y/m}

    if(a.hold&&inp.a){a.hold=false;g.fly.push({x:a.x+a.fx*30,y:a.y-20+a.fy*30,vx:a.fx*660,vy:a.fy*660,o:a.pi});sfx('hop')}

   separate(g.actors);const died=[];

    const ow=g.actors[b.o];for(const a of g.actors){if(!a.alive||a.pi===b.o||a.inv>0||!enemy(ow,a))continue;if(Math.hypot(a.x-b.x,a.y-20-b.y)<a.r+12){a.hp--;a.inv=1.1;a.kb=.25;a.vx=b.vx*.5;a.vy=b.vy*.5;sfx('hit');g.shake=.2;burst(b.x,b.y,12,['#fff',C.red,C.gold],{max:240});floatText(a.x,a.y-70,'-1','#ff8a7a',{size:26});

  g.think=dt=>{const lv=LV();for(const a of g.actors){const i=a.pi;if(P(i).human||!a.alive)continue;
    if(lv>0){let dg=null;for(const b of g.fly){if(b.o===i||!enemy(g.actors[b.o],a))continue;const rx=a.x-b.x,ry=a.y-20-b.y,s2=b.vx*b.vx+b.vy*b.vy;const tt=(rx*b.vx+ry*b.vy)/s2;if(tt<0||tt>[0,.45,.7][lv])continue;
      const cx2=b.x+b.vx*tt,cy2=b.y+b.vy*tt;if(Math.hypot(a.x-cx2,a.y-20-cy2)<50){const px=-b.vy,py=b.vx,l=Math.hypot(px,py)||1,sg=((a.x-cx2)*px+(a.y-20-cy2)*py)>=0?1:-1;dg={x:px/l*sg,y:py/l*sg}}}
     if(dg&&Math.random()<[0,.7,.95][lv]){g.ai[i]={x:dg.x,y:dg.y,a:false};continue}}

    let tg=null,bd=1e9;for(const b of g.actors){if(b===a||!b.alive||!enemy(a,b))continue;const d=Math.hypot(b.x-a.x,b.y-a.y);if(d<bd){bd=d;tg=b}}

     g.rt[i]-=dt;if(g.rt[i]<=0){g.rt[i]=[.6,.35,.2][lv];g.ai[i]={x:Math.cos(an),y:Math.sin(an),a:true}}else g.ai[i]={x:Math.cos(an)*.3,y:Math.sin(an)*.3,a:false}}

  g.winners=()=>{if(mode==='ffa'){const al=alive();if(!al.length)return g.lastDeath.slice();const m=Math.max(...al.map(a=>a.hp));return al.filter(a=>a.hp===m).map(a=>a.pi)}
   const th=teams.groups.map(gr=>gr.reduce((s,i)=>s+(g.actors[i].alive?g.actors[i].hp:0),0));if(th[0]===th[1])return[];return teams.groups[th[0]>th[1]?0:1].slice()};
  g.scores=()=>g.actors.map(a=>a.alive?1e5+a.hp:(a.dt0||0));
  g.draw=c=>{mgBG(c,'#ffe0b0','#f2a65a');c.save();if(g.shake)c.translate(rand(-5,5),rand(-5,5));
   c.save();rr(c,ar.x-14,ar.y-14,ar.w+28,ar.h+28,22);c.fillStyle=C.ink;c.fill();rr(c,ar.x,ar.y,ar.w,ar.h,12);c.clip();
   for(let x=ar.x;x<ar.x+ar.w;x+=60){c.fillStyle=((x-ar.x)/60)%2?'#d9a066':'#e3ad74';c.fillRect(x,ar.y,60,ar.h)}
   c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=5;c.beginPath();c.moveTo(W/2,ar.y);c.lineTo(W/2,ar.y+ar.h);c.stroke();circ(c,W/2,ar.y+ar.h/2,70);c.stroke();c.restore();
   const ball=(x,y,r)=>{circ(c,x,y,r);c.fillStyle=C.red;c.fill();c.lineWidth=3;c.strokeStyle=C.ink;c.stroke();c.strokeStyle='#fff';c.lineWidth=2.5;c.beginPath();c.arc(x,y,r*.65,-1,1);c.stroke()};
   for(const b of g.balls){c.fillStyle='rgba(0,0,0,.18)';ell(c,b.x,b.y+14,14,5);c.fill();ball(b.x,b.y-Math.abs(Math.sin(NOW*4+b.x))*4,14)}
   for(const a of g.actors.filter(a=>a.alive).sort((a,b)=>a.y-b.y)){if(mode!=='ffa'){c.strokeStyle=teamCol(teams,a.pi);c.lineWidth=4;ell(c,a.x,a.y+2,28,10);c.stroke()}
    if(a.inv>0&&(NOW*14%1)<.5)c.globalAlpha=.4;drawActor(c,a,{mood:a.kb>0?'dizzy':null});c.globalAlpha=1;
    if(a.hold)ball(a.x+a.fx*22,a.y-a.r*2.1,12);
    for(let k=0;k<3;k++){const hx=a.x-18+k*18,hy=a.y-a.r*2.9;c.fillStyle=k<a.hp?'#ff5a6e':'rgba(255,255,255,.45)';c.beginPath();c.moveTo(hx,hy+6);c.bezierCurveTo(hx-10,hy-2,hx-5,hy-10,hx,hy-4);c.bezierCurveTo(hx+5,hy-10,hx+10,hy-2,hx,hy+6);c.fill();c.lineWidth=2;c.strokeStyle=C.ink;c.stroke()}

 desc:m=>m==='1v3'?'1人チームは ふとい ブラシで すばやく ぬれる！ 3人チームは 力を あわせて ぬりかえそう。30秒で ぬったマスが 多いチームの 勝ち。Aで ダッシュ。':m==='ffa'?'歩いた マスが 自分の 色に ぬられるよ！ 人の 色も ぬりかえせる。30秒で いちばん 多く ぬった人の 勝ち。Aで ダッシュ。':'チームの 色で フィールドを ぬりつぶせ！ 30秒で ぬったマスが 多いチームの 勝ち。Aで ダッシュ。',
 ctl:'いどう：スティック / 十字　ダッシュ：A',
 create(mode,teams){const ar={x:160,y:150,w:960,h:480},CS=40,COLS=24,ROWS=12;const pos=[[260,250],[1020,250],[260,530],[1020,530]];
  const g={ar,time:30,done:false,ai:[],grid:new Array(COLS*ROWS).fill(-1),rt:[0,0,0,0],tg:[null,null,null,null]};
  const owner=i=>mode==='ffa'?i:teamOf(teams,i);const ocol=o=>mode==='ffa'?CHARS[P(o).ci].col:teams.colors[o];
  g.actors=[0,1,2,3].map(i=>{const a=mkActor(i,pos[i][0],pos[i][1]);a.cd=0;a.dash=0;return a});
  const cellAt=(x,y)=>{const cx=Math.floor((x-ar.x)/CS),cy=Math.floor((y-ar.y)/CS);if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return-1;return cy*COLS+cx};
  g.counts=()=>{const cnt=new Array(mode==='ffa'?4:2).fill(0);for(const v of g.grid)if(v>=0)cnt[v]++;return cnt};
  g.update=dt=>{g.time-=dt;if(g.time<=0){g.time=0;g.done=true;return}g.think(dt);
   for(const a of g.actors){const inp=mgIn(g,a.pi);a.cd=Math.max(0,a.cd-dt);a.dash=Math.max(0,a.dash-dt);if(inp.a&&a.cd<=0){a.dash=.5;a.cd=2;sfx('hop')}
    const big=mode==='1v3'&&a.pi===teams.groups[0][0];moveActor(a,inp,a.dash>0?470:big?305:270,dt,ar);const o=owner(a.pi);if(big){for(const ox of[-40,-20,0,20,40])for(const oy of[-30,-4,22]){const k=cellAt(a.x+ox,a.y+oy);if(k>=0)g.grid[k]=o}}else for(const ox of[-14,0,14]){const k=cellAt(a.x+ox,a.y-4);if(k>=0)g.grid[k]=o}}
   separate(g.actors)};
  g.think=dt=>{const lv=LV();for(const a of g.actors){const i=a.pi;if(P(i).human)continue;g.rt[i]-=dt;const o=owner(i);
    if(g.rt[i]<=0||g.tg[i]==null||g.grid[g.tg[i]]===o){g.rt[i]=[.9,.5,.25][lv];let best=null,bs=1e9;for(let s=0;s<[10,25,45][lv];s++){const k=randi(0,COLS*ROWS-1);if(g.grid[k]===o)continue;
      const cx=ar.x+(k%COLS+.5)*CS,cy=ar.y+(Math.floor(k/COLS)+.5)*CS;const sc=Math.hypot(cx-a.x,cy-a.y)-(g.grid[k]>=0?40:0)+rand(0,[200,80,20][lv]);if(sc<bs){bs=sc;best=k}}g.tg[i]=best}
    const k=g.tg[i];if(k==null){g.ai[i]={x:0,y:0,a:false};continue}const cx=ar.x+(k%COLS+.5)*CS,cy=ar.y+(Math.floor(k/COLS)+.5)*CS+4;const s=seek(a,cx,cy,4);
    g.ai[i]={x:s.x,y:s.y,a:lv>0&&a.cd<=0&&Math.hypot(cx-a.x,cy-a.y)>180&&Math.random()<.05}}};
  g.winners=()=>{const cnt=g.counts();if(mode==='ffa'){const m=Math.max(...cnt);if(m<=0)return[];return cnt.map((v,i)=>v===m?i:-1).filter(i=>i>=0)}if(cnt[0]===cnt[1])return[];return teams.groups[cnt[0]>cnt[1]?0:1].slice()};
  g.scores=()=>{const cnt=g.counts();return g.actors.map(a=>mode==='ffa'?cnt[a.pi]:0)};
  g.draw=c=>{mgBG(c,'#d8f0c8','#9fd37f');rr(c,ar.x-14,ar.y-14,ar.w+28,ar.h+28,22);c.fillStyle=C.ink;c.fill();
   for(let k=0;k<COLS*ROWS;k++){const x=ar.x+(k%COLS)*CS,y=ar.y+Math.floor(k/COLS)*CS,v=g.grid[k];c.fillStyle=v<0?((k%COLS+Math.floor(k/COLS))%2?'#f6f1e4':'#ece5d3'):ocol(v);c.fillRect(x,y,CS,CS);if(v>=0){c.fillStyle='rgba(255,255,255,.2)';c.fillRect(x+3,y+3,CS-6,6)}}
   c.lineWidth=5;c.strokeStyle=C.ink;c.strokeRect(ar.x,ar.y,ar.w,ar.h);
   for(const a of g.actors.slice().sort((a,b)=>a.y-b.y)){c.fillStyle='#fff';ell(c,a.x,a.y+2,24,9);c.fill();drawActor(c,a,{mood:a.dash>0?'happy':null});

MGS.tag={name:'おにごっこ',modes:['1v3'],desc:()=>'1人チームは おに！ 3人を ぜんいん タッチしたら 勝ち。3人チームは 15秒 にげきれば 勝ち。切りかぶを うまく使って にげよう。Aで ダッシュ。',ctl:'いどう：スティック / 十字　ダッシュ：A',
 create(mode,teams){const ar={x:160,y:150,w:960,h:500};const solo=teams.groups[0][0],run=teams.groups[1];
  const obs=[{x:420,y:290,r:38},{x:860,y:290,r:38},{x:420,y:510,r:38},{x:860,y:510,r:38},{x:640,y:400,r:46}];
  const g={ar,time:15,done:false,ai:[],endT:-1,wander:{}};
  const oni=mkActor(solo,240,400);oni.cd=1;oni.dash=0;oni.oni=true;
  g.actors=[oni,...run.map((i,k)=>{const a=mkActor(i,[760,950,760][k],[250,400,550][k]);a.cd=0;a.dash=0;return a})];
  const pushObs=a=>{for(const o of obs){const dx=a.x-o.x,dy=a.y-o.y,d=Math.hypot(dx,dy)||.01,m=o.r+a.r*.8;if(d<m){a.x+=dx/d*(m-d);a.y+=dy/d*(m-d)}}};
  const avoidObs=(a,dir)=>{let x=dir.x,y=dir.y;for(const o of obs){const dx=a.x-o.x,dy=a.y-o.y,d=Math.hypot(dx,dy)||1;if(d<o.r+70){x+=dx/d*(o.r+70-d)/50;y+=dy/d*(o.r+70-d)/50}}const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}};
  g.update=dt=>{g.time-=dt;if(g.endT>=0){g.endT-=dt;if(g.endT<=0)g.done=true}if(g.time<=0){g.time=0;g.done=true;return}g.think(dt);
   for(const a of g.actors){if(!a.alive)continue;const inp=mgIn(g,a.pi);a.cd=Math.max(0,a.cd-dt);a.dash=Math.max(0,a.dash-dt);if(inp.a&&a.cd<=0){a.dash=.3;a.cd=a.oni?2.6:3;sfx('hop')}

 create(mode,teams){const g={seq:[],len:3,phase:'show',idx:-1,t:0,done:false,ai:[],round:0,st:[0,1,2,3].map(()=>({pos:0,out:false,okRound:0,flash:0,cpuT:0,doneR:false,bad:0}))};

 if(k==='hamster')for(const sx of[-1,1]){c.fillStyle=col;circ(c,sx*s*.5,-s*.7,s*.24);c.fill();c.stroke()}
 if(k==='mouse'){c.beginPath();c.moveTo(s*.8,s*.25);c.quadraticCurveTo(s*1.6,s*.2,s*1.45,-s*.45);c.stroke();for(const sx of[-1,1]){c.fillStyle=col;circ(c,sx*s*.45,-s*.72,s*.36);c.fill();c.stroke();c.fillStyle='#ffc4d8';circ(c,sx*s*.45,-s*.72,s*.17);c.fill()}}
 if(k==='pig')for(const sx of[-1,1]){c.fillStyle=col;c.beginPath();c.moveTo(sx*s*.25,-s*.72);c.lineTo(sx*s*.62,-s*1.08);c.lineTo(sx*s*.72,-s*.52);c.closePath();c.fill();c.stroke()}
 if(k==='chick'){c.fillStyle=col;c.beginPath();c.moveTo(-s*.05,-s*.85);c.quadraticCurveTo(-s*.2,-s*1.25,s*.1,-s*1.15);c.quadraticCurveTo(s*.05,-s*1.0,s*.12,-s*.86);c.fill();c.stroke()}
 c.fillStyle=col;ell(c,0,0,s,s*.9);c.fill();c.stroke();
 c.fillStyle='#f39322';for(const fx of[-.35,.3]){ell(c,fx*s,s*.9,s*.2,s*.09);c.fill()}
 c.fillStyle=C.ink;circ(c,-s*.42,-s*.2,s*.12);c.fill();circ(c,-s*.02,-s*.22,s*.12);c.fill();c.fillStyle='#fff';circ(c,-s*.45,-s*.25,s*.04);c.fill();circ(c,-s*.05,-s*.27,s*.04);c.fill();
 if(k==='duck'){c.fillStyle='#f39322';ell(c,-s*.86,s*.06,s*.32,s*.12);c.fill();c.stroke();c.fillStyle='#fff';ell(c,s*.35,s*.14,s*.36,s*.22);c.fill();c.stroke()}
 if(k==='hamster'){c.fillStyle='#fff3e0';ell(c,-s*.2,s*.3,s*.5,s*.36);c.fill();c.fillStyle=C.ink;circ(c,-s*.9,s*.02,s*.08);c.fill()}
 if(k==='chick'){c.fillStyle='#f39322';c.beginPath();c.moveTo(-s*.62,-s*.05);c.lineTo(-s*1.02,s*.04);c.lineTo(-s*.62,s*.16);c.closePath();c.fill();c.stroke();c.fillStyle='#f2b51e';ell(c,s*.35,s*.12,s*.35,s*.22);c.fill()}
 if(k==='pig'){c.fillStyle='#f58fb6';ell(c,-s*.72,s*.05,s*.26,s*.2);c.fill();c.stroke();c.fillStyle=C.ink;ell(c,-s*.79,s*.05,s*.05,s*.07);c.fill();ell(c,-s*.65,s*.05,s*.05,s*.07);c.fill()}
 if(k==='mouse'){c.fillStyle=C.ink;circ(c,-s*.98,s*.02,s*.1);c.fill();c.strokeStyle='rgba(43,33,64,.6)';c.lineWidth=Math.max(1,s*.05);for(const dy of[-.06,.1]){c.beginPath();c.moveTo(-s*.8,s*dy);c.lineTo(-s*1.3,s*(dy*2));c.stroke()}}
 c.fillStyle='rgba(255,120,150,.35)';ell(c,-s*.3,s*.2,s*.13,s*.08);c.fill();
 c.restore()}
MGS.count={name:'かぞえてカウント',modes:['ffa','1v1'],desc:()=>'画面を 横切る どうぶつの 中から、お題の どうぶつ だけを かぞえよう！ そっくりさんや、とちゅうで 引き返す子、しげみに かくれる子も いるよ。そのあと ↑↓で 数を えらんで Aで けってい。ぴったり、または いちばん 近い人の 勝ち。',ctl:'かぞえる：見るだけ　数：▲▼　けってい：A',
 create(mode,teams){const PL=PLs(teams);const lv=LV();const kinds=Object.keys(CRIT);const tgt=pick(['chick','pig','mouse']);
  // そっくりさん（ひよこ↔あひる、ねずみ↔ハムスター）を混ぜ、まとめて出てきたり、途中で引き返したり、しげみに隠れたりする
  const N=randi(15,26),dec=randi(14,22),alike=CRIT_ALIKE[tgt];const all=[];for(let k=0;k<N;k++)all.push(tgt);
  for(let k=0;k<dec;k++)all.push(alike&&Math.random()<.45?alike:pick(kinds.filter(x=>x!==tgt&&x!==alike)));shuffle(all);
  const list=[];let tt=.4,j=0;while(j<all.length){const f=j/all.length;const grp=Math.min(all.length-j,randi(1,f<.3?2:f<.7?4:5));const dir0=Math.random()<.5?1:-1;
   for(let q=0;q<grp;q++,j++){const dir=Math.random()<.7?dir0:-dir0;list.push({k:all[j],t0:tt+rand(0,.25),dir,sp:rand(300,430)*(1+f*.6),y:rand(230,520),s:rand(19,28),turn:Math.random()<.16?rand(.3,.6):0})}
   tt+=rand(.25,.55)*(1.25-f*.5)}
  const tEnd=Math.max(...list.map(a=>a.t0));const sc=8.6/Math.max(8.6,tEnd);for(const a of list)a.t0*=sc;
  const crossX=(a,dt0)=>{const L=W+160;let d=dt0*a.sp,dir=a.dir;if(a.turn&&d>a.turn*L){d=a.turn*L-(d-a.turn*L);dir=-a.dir}const x=a.dir>0?-80+d:W+80-d;return[x,dir,d<-1]};
  const g={t:0,phase:'show',list,N,tgt,ans:[0,1,2,3].map(()=>10),lock:[0,1,2,3].map(i=>!PL.includes(i)),cpu:[null,null,null,null],done:false,ai:[],rv:0,inT:0,shown:0};
  const SHOW=11,INP=9;
  g.update=dt=>{g.t+=dt;
   if(g.phase==='show'){if(g.t>SHOW){g.phase='input';g.inT=0;sfx('go')}return}
   if(g.phase==='input'){g.inT+=dt;for(const i of PL){if(g.lock[i])continue;const p=P(i);
     if(p.human){if(Input.rep(p.dev,'up')||Input.rep(p.dev,'right')){g.ans[i]=Math.min(40,g.ans[i]+1);sfx('blip')}if(Input.rep(p.dev,'down')||Input.rep(p.dev,'left')){g.ans[i]=Math.max(0,g.ans[i]-1);sfx('blip')}if(g.inT>.3&&Input.pressed(p.dev,'a')){g.lock[i]=true;sfx('ok')}}
     else{if(!g.cpu[i])g.cpu[i]={v:clamp(Math.round(g.N+gauss()*[2.6,1.5,.7][lv]),0,40),t:rand(1.5,4),mv:0};const cp=g.cpu[i];cp.mv-=dt;if(g.ans[i]!==cp.v){if(cp.mv<=0){g.ans[i]+=g.ans[i]<cp.v?1:-1;cp.mv=.11}}else if(g.inT>cp.t){g.lock[i]=true;sfx('ok')}}}
    if(PL.every(i=>g.lock[i])||g.inT>INP){for(const i of PL)g.lock[i]=true;g.phase='reveal';g.rv=0}return}
   if(g.phase==='reveal'){g.rv+=dt;const n=Math.min(g.N,Math.floor(g.rv/2.4*g.N));if(n>g.shown){g.shown=n;sfx('tick')}if(g.rv>2.4&&g.rv-dt<=2.4)sfx('fanfare');if(g.rv>5)g.done=true}};
  g.scores=()=>[0,1,2,3].map(i=>PL.includes(i)?-Math.abs(g.ans[i]-g.N):-1e9);
  g.winners=()=>{const s=g.scores();const m=Math.max(...PL.map(i=>s[i]));return PL.filter(i=>s[i]===m)};
  g.draw=c=>{mgBG(c,'#bfe7ff','#8fd0f2');c.fillStyle='#86cc63';c.fillRect(0,190,W,H-190);c.fillStyle='#7bc157';for(let x=0;x<W;x+=64)c.fillRect(x,190,32,H-190);
   c.fillStyle='#f2dfae';c.fillRect(0,210,W,350);c.strokeStyle=C.ink;c.lineWidth=4;c.beginPath();c.moveTo(0,210);c.lineTo(W,210);c.moveTo(0,560);c.lineTo(W,560);c.stroke();
   for(let x=10;x<W;x+=70){c.fillStyle='#fff';c.fillRect(x,560,10,40);c.strokeRect(x,560,10,40)}c.fillStyle='#fff';c.fillRect(0,570,W,8);
   rr(c,W/2-230,92,460,92,22);c.fillStyle=C.paper;c.fill();c.lineWidth=4;c.stroke();drawCritter(c,g.tgt,W/2-160,146,24,NOW*.3);txt(c,`${CRIT[g.tgt].name}を かぞえよう！`,W/2+30,138,{s:30,f:FD,w:400,col:C.redD});
   if(g.phase==='show'){const vis=g.list.filter(a=>g.t>=a.t0).sort((a,b)=>a.y-b.y);for(const a of vis){const[x,dir,gone]=crossX(a,g.t-a.t0);if(gone||x<-100||x>W+100)continue;drawCritter(c,a.k,x,a.y,a.s,g.t+a.y,dir)}
    for(const[bx,by,bw]of[[250,470,150],[700,330,170],[1060,500,140]]){c.fillStyle='#5ca449';c.strokeStyle=C.ink;c.lineWidth=4;for(let q=0;q<4;q++){circ(c,bx-bw/2+q*bw/3,by-(q%2)*14,bw/3.4);c.fill();c.stroke()}c.fillStyle='#7cc65a';for(let q=0;q<4;q++){circ(c,bx-bw/2+q*bw/3-6,by-(q%2)*14-8,bw/6);c.fill()}}
    const k=Math.max(0,1-g.t/SHOW);rr(c,W/2-200,594,400,16,8);c.fillStyle='rgba(43,33,64,.3)';c.fill();rr(c,W/2-200,594,400*k,16,8);c.fillStyle=C.gold;c.fill()}
   else{c.fillStyle='rgba(20,10,40,.35)';c.fillRect(0,210,W,350);
    if(g.phase==='reveal'){txt(c,''+g.shown,W/2,300,{s:110,f:FD,w:400,col:'#fff',st:C.ink,sw:14});txt(c,g.rv>2.4?'せいかい！':'かぞえているよ…',W/2,385,{s:26,col:'#fff',st:C.ink,sw:6})}
    else{txt(c,'いくつ だった？',W/2,280,{s:56,f:FD,w:400,col:'#fff',st:C.ink,sw:12});const k=Math.max(0,1-g.inT/INP);rr(c,W/2-200,340,400,16,8);c.fillStyle='rgba(255,255,255,.4)';c.fill();rr(c,W/2-200,340,400*k,16,8);c.fillStyle=C.gold;c.fill()}}
   if(g.phase!=='show')PL.forEach((i,k)=>{const x=640+(k-(PL.length-1)/2)*290,y=520;const p=P(i);rr(c,x-120,y-40,240,150,20);c.fillStyle='#fff';c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();
    const win=g.phase==='reveal'&&g.rv>2.4&&g.winners().includes(i);drawChar(c,p.ci,x-66,y+30,30,{mood:win?'happy':g.lock[i]?null:null,jump:win?Math.abs(Math.sin(NOW*8))*12:0});txt(c,pname(p),x+40,y-16,{s:18});
    if(g.phase==='reveal'&&g.rv>2.4+k*.2){const d=g.ans[i]-g.N;txt(c,''+g.ans[i],x+40,y+34,{s:46,f:FD,w:400,col:d===0?C.redD:C.ink});txt(c,d===0?'ぴったり！':(d>0?'+':'')+d,x+40,y+78,{s:18,col:d===0?C.redD:'#6d6280'})}
    else if(g.lock[i]&&g.phase==='input')txt(c,'OK！',x+40,y+34,{s:38,f:FD,w:400,col:C.greenD});
    else if(g.phase==='input'){txt(c,''+g.ans[i],x+40,y+34,{s:46,f:FD,w:400});c.fillStyle=C.gold;c.strokeStyle=C.ink;c.lineWidth=2.5;for(const sy of[-1,1]){c.beginPath();c.moveTo(x+40,y+34+sy*42);c.lineTo(x+28,y+34+sy*30);c.lineTo(x+52,y+34+sy*30);c.closePath();c.fill();c.stroke()}if(p.human)txt(c,`▲▼　${aLabel(p.dev)} けってい`,x+20,y+96,{s:13,col:'#6d6280'})}
    else txt(c,'？',x+40,y+34,{s:40,f:FD,w:400,col:'#b3aac4'})});
   drawMGTop(c,'かぞえてカウント',null,null,teams)};
  return g}};
/* --- えらんでトンネル（1vs3）：ふさがれた トンネルを よむ --- */
MGS.tunnel={name:'えらんでトンネル',modes:['1v3'],desc:()=>'3人チームは 3つの トンネルから 1つ えらんで 走りぬけよう！ 1人チームは ふさぐ トンネルを 1つ えらぶ。さいごの 1.5秒は カーテンで 見えなくなるよ。ふさがれた トンネルを えらぶと アウト。4回で 3人とも アウトなら 1人チームの 勝ち。',ctl:'◀▶ トンネルを えらぶ（時間ぎれで けってい）',
 roles:()=>['ふさぐ トンネルを えらぶ','あいてる トンネルを よむ'],
 create(mode,teams){const solo=teams.groups[0][0],run=teams.groups[1];const lv=LV();const TX=[330,640,950],PICK=4.2,CUR=1.5;
  const g={round:1,max:4,phase:'pick',t:0,sel:{},out:{},outR:{},done:false,ai:[],plan:{},hitT:{},mvT:{}};run.forEach(i=>g.out[i]=false);
  const live=()=>run.filter(i=>!g.out[i]);
  const newRound=()=>{g.phase='pick';g.t=0;g.sel[solo]=1;run.forEach((i,k)=>{g.sel[i]=k});for(const i of[solo,...run]){g.mvT[i]=0;g.plan[i]={tg:randi(0,2),sw:rand(1.2,PICK-.25),done:false}}};
  newRound();
  g.update=dt=>{g.t+=dt;
   if(g.phase==='pick'){for(const i of[solo,...live()]){const p=P(i);g.mvT[i]-=dt;
     if(p.human){if(Input.rep(p.dev,'left')&&g.sel[i]>0){g.sel[i]--;sfx('blip')}if(Input.rep(p.dev,'right')&&g.sel[i]<2){g.sel[i]++;sfx('blip')}}
     else{const pl=g.plan[i];if(!pl.done&&g.t>=pl.sw){pl.done=true;if(i===solo&&Math.random()<[.15,.4,.6][lv]&&g.t<PICK-CUR+.2){const cnt=[0,0,0];live().forEach(j=>cnt[g.sel[j]]++);const m=Math.max(...cnt);pl.tg=pick([0,1,2].filter(x=>cnt[x]===m))}else if(Math.random()<.5)pl.tg=randi(0,2)}
      if(g.sel[i]!==pl.tg&&g.mvT[i]<=0){g.sel[i]+=pl.tg>g.sel[i]?1:-1;g.mvT[i]=.2;if(g.t<PICK-CUR)sfx('blip')}}}
    if(g.t>=PICK){g.phase='run';g.t=0;sfx('thud');G.shake=0;for(const i of live())g.hitT[i]=null}return}
   if(g.phase==='run'){for(const i of live())if(g.sel[i]===g.sel[solo]&&g.hitT[i]==null&&g.t>.9){g.hitT[i]=g.t;sfx('hit')}
    if(g.t>2.3){for(const i of live())if(g.hitT[i]!=null){g.out[i]=true;g.outR[i]=g.round}if(!live().length)sfx('lose');g.phase='after';g.t=0}return}
   if(g.phase==='after'){if(g.t>1.1){if(!live().length||g.round>=g.max)g.done=true;else{g.round++;newRound()}}}};
  g.winners=()=>live().length?run.slice():[solo];
  g.scores=()=>[0,1,2,3].map(i=>i===solo?(run.length-live().length)*10:g.out[i]?0:10);
  g.draw=c=>{mgBG(c,'#a9dcff','#e8f6ff');
   c.fillStyle='#86cc63';c.fillRect(0,420,W,H-420);c.lineWidth=5;c.strokeStyle=C.ink;c.fillStyle='#6fb54f';c.beginPath();c.moveTo(-20,440);c.quadraticCurveTo(200,150,640,150);c.quadraticCurveTo(1080,150,1300,440);c.closePath();c.fill();c.stroke();
   c.fillStyle='#5ca449';for(let k=0;k<9;k++){circ(c,150+k*125,250+Math.abs(k-4)*28,16);c.fill()}
   const bs=g.phase==='pick'?-1:g.sel[solo];
   TX.forEach((x,k)=>{c.fillStyle='#4a3a2a';c.beginPath();c.moveTo(x-80,440);c.lineTo(x-80,350);c.arc(x,350,80,Math.PI,0);c.lineTo(x+80,440);c.closePath();c.fill();c.stroke();c.fillStyle='#1d1428';c.beginPath();c.moveTo(x-62,440);c.lineTo(x-62,352);c.arc(x,352,62,Math.PI,0);c.lineTo(x+62,440);c.closePath();c.fill();
    txt(c,['A','B','C'][k],x,262,{s:30,f:FD,w:400,col:'#fff',st:C.ink,sw:6});
    if(k===bs){const fy=g.phase==='run'?Math.min(1,g.t/.35):1;const ry=lerp(180,380,easeOut(fy));c.fillStyle='#8a8496';circ(c,x,ry,70);c.fill();c.lineWidth=5;c.strokeStyle=C.ink;c.stroke();c.fillStyle='#b9b3c6';ell(c,x-22,ry-26,22,12);c.fill()}});
   // 1人チーム
   const sx=g.phase==='pick'?TX[g.sel[solo]]*.35+640*.65:TX[g.sel[solo]];drawChar(c,P(solo).ci,g.phase==='pick'?640:sx,128,30,{mood:'happy',noShadow:true});
   // 走る人
   run.forEach((i,k)=>{const p=P(i);const baseX=TX[g.sel[i]]+(run.indexOf(i)-1)*34;let x=200+k*440,y=640,mood=null,alpha=1;
    if(g.out[i]&&(g.phase!=='after'||g.outR[i]<g.round)){drawChar(c,p.ci,140+k*80,690,18,{mood:'dizzy',alpha:.6});return}
    if(g.phase==='pick'){x=TX[g.sel[i]]+(k-1)*40;y=600}
    else if(g.phase==='run'||g.phase==='after'){const t=g.phase==='run'?g.t:2.3;const hit=g.hitT[i]!=null;const u=Math.min(1,t/.9);x=baseX;y=lerp(600,440,u);
     if(hit){const v=t-g.hitT[i];y=440+Math.min(1,v/.4)*170;mood='dizzy'}else if(t>.9){alpha=Math.max(0,1-(t-.9)/.4);y=430}
     if(g.phase==='after'&&!hit){alpha=0}}
    drawChar(c,p.ci,x,y,26,{mood,alpha,jump:g.phase==='run'&&mood==null?Math.abs(Math.sin(NOW*14+k))*8:0})});
   if(g.phase==='after'){const ok=live();txt(c,ok.length?ok.map(i=>pname(P(i))).join('・')+' セーフ！':'ぜんいん アウト！',W/2,560,{s:36,f:FD,w:400,col:ok.length?'#fff':C.gold,st:C.ink,sw:8});
    for(const i of run)if(!g.out[i]){const k=run.indexOf(i);drawChar(c,P(i).ci,TX[g.sel[i]]+(k-1)*40,640,24,{mood:'happy',jump:Math.abs(Math.sin(NOW*8+k))*12})}}
   if(g.phase==='pick'){const cur=g.t>PICK-CUR;
    if(cur){c.fillStyle='#b0303e';c.fillRect(0,180,W,H-180);c.fillStyle='rgba(0,0,0,.15)';for(let x=0;x<W;x+=60)c.fillRect(x,180,24,H-180);c.fillStyle=C.gold;c.fillRect(0,180,W,16);
     txt(c,'カーテン！ もう 見えないよ',W/2,420,{s:40,f:FD,w:400,col:'#fff',st:C.ink,sw:9});run.concat([solo]).forEach((i,k)=>{if(P(i).human)txt(c,`${pname(P(i))}：◀▶ まだ うごかせる`,W/2,480+k*30,{s:18,col:'#fff',st:C.ink,sw:5})})}
    else{TX.forEach((x,k)=>{if(g.sel[solo]===k){c.strokeStyle=C.red;c.lineWidth=6;c.setLineDash([12,8]);c.beginPath();c.arc(x,350,94,Math.PI,0);c.stroke();c.setLineDash([])}});
     if(P(solo).human)txt(c,'1人チーム：◀▶ ふさぐ トンネル',W/2,80+20,{s:16,col:'#fff',st:C.ink,sw:5})}
    const k=Math.max(0,1-g.t/PICK);rr(c,W/2-200,690,400,14,7);c.fillStyle='rgba(43,33,64,.35)';c.fill();rr(c,W/2-200,690,400*k,14,7);c.fillStyle=C.gold;c.fill()}
   drawMGTop(c,'えらんでトンネル',null,null,teams);txt(c,`ラウンド ${g.round} / ${g.max}　のこり ${live().length} 人`,W-48,44,{s:22,a:'right',col:'#fff'})};
  return g}};
/* --- ふたりでそうじゅう（2vs2）：よこ と たて を 分担 --- */
MGS.pilot={name:'ふたりでそうじゅう',modes:['2v2'],desc:()=>'2人で 1台の ふうせんカーを うごかそう！ 1人目は よこ（◀▶）、2人目は たて（▲▼）だけ 担当。コインを あつめて、合計が 多いチームの 勝ち。かみなり雲に さわると コインを 落とすよ。',ctl:'1人目：◀▶ よこ　2人目：▲▼ たて',
 roles:()=>['左の人：よこ　右の人：たて','左の人：よこ　右の人：たて'],
 create(mode,teams){const ar={x:140,y:150,w:1000,h:500};const lv=LV();
  const g={ar,time:25,coins:[],clouds:[{x:640,y:260,vx:120,vy:70,r:56},{x:640,y:540,vx:-110,vy:-80,r:56}],st:0,done:false,ai:[],score:[0,0],

function mgPickWin(sc,teams){const PL=PLs(teams);if(teams.mode==='ffa'||teams.mode==='1v1'){const m=Math.max(...PL.map(i=>sc[i]));return PL.filter(i=>Math.abs(sc[i]-m)<1e-9)}
 const t=teams.groups.map(gr=>gr.reduce((s,i)=>s+sc[i],0));if(Math.abs(t[0]-t[1])<1e-9)return[];return teams.groups[t[0]>t[1]?0:1].slice()}
function aliveWin(g,teams,alive,lastDeath){const PL=PLs(teams);const al=PL.filter(i=>alive[i]);
 if(teams.mode==='ffa'||teams.mode==='1v1')return al.length?al:lastDeath.slice();
 const ta=teams.groups.map(gr=>gr.filter(i=>alive[i]).length);if(ta[0]===ta[1])return[];return teams.groups[ta[0]>ta[1]?0:1].slice()}
function drawBomb(c,x,y,r,fuse,t){c.save();c.translate(x,y);c.lineWidth=Math.max(2,r*.14);c.strokeStyle=C.ink;
 c.fillStyle=fuse<.25?(Math.sin(t*30)>0?'#c0392b':'#2b2140'):'#2b2140';circ(c,0,0,r);c.fill();c.stroke();
 c.fillStyle='rgba(255,255,255,.35)';circ(c,-r*.35,-r*.35,r*.28);c.fill();
 c.fillStyle='#8a8496';c.fillRect(-r*.25,-r*1.15,r*.5,r*.3);c.strokeRect(-r*.25,-r*1.15,r*.5,r*.3);
 c.strokeStyle='#8a5a2e';c.lineWidth=Math.max(2,r*.1);c.beginPath();c.moveTo(0,-r*1.15);c.quadraticCurveTo(r*.4,-r*1.6,r*.55,-r*1.45);c.stroke();
 const sp=r*.3*(1+Math.sin(t*40)*.3);c.fillStyle=C.gold;drawStar(c,r*.55,-r*1.45,sp,t*6,C.gold,0);c.restore()}

MGS.hotbomb={name:'ばくだんリレー',modes:['ffa'],desc:()=>'ばくだんを 持っている人は、ほかの人に ぶつかって 押しつけよう！ ばくだんが ばくはつした時に 持っていた人の 負け。それ以外の 全員が 勝ち。',ctl:'いどう：スティック / 十字 / WASD / 矢印',
 create(mode,teams){const ar={x:160,y:150,w:960,h:500};const pos=[[320,280],[960,280],[320,520],[960,520]];const PL=PLs(teams);
  const g={ar,el:0,done:false,ai:[],actors:[0,1,2,3].map(i=>mkActor(i,pos[i][0],pos[i][1])),holder:pick(PL),cool:[0,0,0,0],fuse:rand(13,19),fuse0:0,boomT:-1,rt:[0,0,0,0],pass:0};

   if(g.boomT>=0){g.boomT+=dt;const a=g.actors[g.holder];a.deadT+=dt;a.x+=a.dvx*dt;a.y+=a.dvy*dt;a.dvy+=900*dt;a.rot+=dt*8;if(g.boomT>1.4)g.done=true;return}

   if(g.fuse<=0){const a=g.actors[g.holder];sfx('boom');burst(a.x,a.y-30,30,['#ff9a3c',C.gold,'#5d566a'],{max:360});a.alive=false;a.dvx=rand(-120,120);a.dvy=-560;g.boomT=0;return}
   g.think(dt);
   for(const a of g.actors){if(!a.alive)continue;moveActor(a,mgIn(g,a.pi),a.pi===g.holder?335:300,dt,ar)}separate(g.actors.filter(a=>a.alive));
   const h=g.actors[g.holder];if(g.cool[g.holder]<=0)for(const a of g.actors){if(!a.alive||a.pi===g.holder||g.cool[a.pi]>0)continue;
    if(Math.hypot(a.x-h.x,a.y-h.y)<h.r+a.r+8){g.cool[g.holder]=.9;g.cool[a.pi]=.5;g.holder=a.pi;g.pass++;sfx('hit');burst(a.x,a.y-40,10,[C.gold,'#fff'],{max:160});break}}};
  g.think=dt=>{const lv=LV();const h=g.actors[g.holder];for(const a of g.actors){const i=a.pi;if(!a.alive||P(i).human)continue;g.rt[i]-=dt;if(g.rt[i]>0)continue;g.rt[i]=[.28,.16,.08][lv];

    const dx=a.x-h.x,dy=a.y-h.y,d=Math.hypot(dx,dy)||1;let fx=dx/d,fy=dy/d;const cx=ar.x+ar.w/2,cy=ar.y+ar.h/2;const wall=Math.min(a.x-ar.x,ar.x+ar.w-a.x,a.y-ar.y,ar.y+ar.h-a.y);
    if(wall<110){fx+=(cx-a.x)/300;fy+=(cy-a.y)/300;const sd=dx*(cy-a.y)-dy*(cx-a.x);fx+=-dy/d*.8*Math.sign(sd||1);fy+=dx/d*.8*Math.sign(sd||1)}

 create(mode,teams){const PL=PLs(teams);const COLS=5,ROWS=4,TW=180,TH=110;const ar={x:(W-COLS*TW)/2,y:200,w:COLS*TW,h:ROWS*TH};

  g.update=dt=>{g.el+=dt;g.pt+=dt;

  g.scores=()=>[0,1,2,3].map(i=>!PL.includes(i)?-1e9:g.alive[i]?100:0);

 create(mode,teams){const PL=PLs(teams);const GY=520,AIR=.52;const g={el:0,done:false,ai:[],th:Math.PI*.9,w:3.4,air:[0,0,0,0],alive:[0,1,2,3].map(i=>PL.includes(i)),out:[0,0,0,0],lastDeath:[],crosses:0,endT:-1,plan:[null,null,null,null]};
