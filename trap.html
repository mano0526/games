// ============ database layer：Firebase / 同じブラウザ内(テスト) / メモリ(1台で遊ぶとき) ============
// 1台で遊ぶときもオンラインと同じ仕組み（ホスト＝自分）で動かすので、遊び方の違いでズレが出ない。
const QS=new URLSearchParams(location.search);const NET_LOCAL=NetDB.LOCAL;
// 通信まわりは共通部品 netdb.js（カートと同じ）。1台で遊ぶときはメモリだけのDB。
let MEMDB=null;function dbTree(){return NetDB.mem();}function dbOnline(){return NetDB.open('trap');}
const DEV=(()=>{let p='';try{p=sessionStorage.getItem('wn_dev')||'';}catch(e){}if(!p){p='d'+Math.random().toString(36).slice(2,8);try{sessionStorage.setItem('wn_dev',p);}catch(e){}}return p;})();
// ============ input ============
const keys={},keyPrev={},keyHit={};let touchK={l:0,r:0,j:0,b:0},touchHit={};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.offsetParent!==null)return;keys[e.code]=true;if(!e.repeat)keyHit[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();audioInit();});
addEventListener('keyup',e=>{keys[e.code]=false;});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
touchEl.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();if(k==='m'){if(G.active&&!G.menu&&S.meta&&S.meta.st==='game')pauseMenu();return;}touchK[k]=1;touchHit[k]=1;b.classList.add('p');audioInit();},off=e=>{e.preventDefault();touchK[k]=0;b.classList.remove('p');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});
const KB={kb1:{l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],a:['Space'],b:['KeyQ','KeyE','ShiftLeft'],st:['Escape','KeyP'],ju:['KeyW']},
  kb2:{l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],a:['Enter','Slash','Numpad0'],b:['ShiftRight','Period','Backspace'],st:['Backspace'],ju:['ArrowUp']}};
const DEVNAME={kb1:'キーボード左（A/D 移動・Space ジャンプ・Q 回転）',kb2:'キーボード右（矢印 移動・Enter ジャンプ・Shift 回転）',touch:'タッチ',any:'この端末'};
let devs={},devPrev={};
function readDevs(){const out={};const any=k=>k.some(c=>keys[c]||keyHit[c]);
  for(const id in KB){const m=KB[id];out[id]={x:(any(m.r)?1:0)-(any(m.l)?1:0),y:(any(m.d)?1:0)-(any(m.u)?1:0),a:any(m.a),ju:any(m.ju),b:any(m.b),st:any(m.st)};}
  const pads=navigator.getGamepads?navigator.getGamepads():[];for(const p of pads){if(!p||!p.connected)continue;const ax=Math.abs(p.axes[0])>.35?p.axes[0]:0,ay=Math.abs(p.axes[1])>.45?p.axes[1]:0;const B=i=>p.buttons[i]&&p.buttons[i].pressed;
    out['gp'+p.index]={x:clamp(Math.sign(ax)+(B(15)?1:0)-(B(14)?1:0),-1,1),y:clamp(Math.sign(ay)+(B(13)?1:0)-(B(12)?1:0),-1,1),a:B(0),ju:false,b:B(1)||B(2)||B(3),st:B(9)};}
  out.touch={x:(touchK.r||touchHit.r?1:0)-(touchK.l||touchHit.l?1:0),y:0,a:!!(touchK.j||touchHit.j),ju:false,b:!!(touchK.b||touchHit.b),st:false};
  const all=Object.values(out);out.any={x:clamp(all.reduce((s,d)=>s+d.x,0),-1,1),y:clamp(all.reduce((s,d)=>s+d.y,0),-1,1),a:all.some(d=>d.a),ju:all.some(d=>d.ju),b:all.some(d=>d.b),st:all.some(d=>d.st)};
  const hitDev=id=>id==='touch'?{a:!!touchHit.j,b:!!touchHit.b}:KB[id]?{a:KB[id].a.some(c=>keyHit[c]),b:KB[id].b.some(c=>keyHit[c]),st:KB[id].st.some(c=>keyHit[c]),ju:KB[id].ju.some(c=>keyHit[c])}:{};
  for(const id in out){const d=out[id],p=devPrev[id]||{};const hd=hitDev(id);if(hd.a&&p.a)p.a=false;if(hd.b&&p.b)p.b=false;if(hd.st&&p.st)p.st=false;if(hd.ju&&p.ju)p.ju=false;d.pa=d.a&&!p.a;d.pb=d.b&&!p.b;d.pst=d.st&&!p.st;d.pju=d.ju&&!p.ju;
    // cursor repeat
    const rep=(k,v)=>{const t=(p[k+'T']||0);if(v===0){d[k+'T']=0;return 0;}if(Math.sign(v)!==Math.sign(p[k]||0)){d[k+'T']=.28;return v;}d[k+'T']=t-1/60;if(d[k+'T']<=0){d[k+'T']=.06;return v;}return 0;};

const S={db:null,code:'',online:false,host:false,meta:null,players:{},picks:{},places:{},states:{},buf:{},L:[],seenMeta:false,name:'',err:'',local:{},rooms:[]};

S.name=NetDB.name.get()||'プレイヤー'+(100+Math.floor(Math.random()*900));
const rp=x=>'r/'+S.code+(x?'/'+x:'');
function owns(pid){return!!S.local[pid]||(S.host&&pid[0]==='c');}
function offAll(){for(const f of S.L)try{f();}catch(e){}S.L=[];}
function openRoom(db,code,asHost){offAll();S.db=db;S.code=code;S.host=asHost;S.meta=null;S.players={};S.picks={};S.places={};S.states={};S.buf={};S.local={};S.seenMeta=false;S.online=db.kind!=='mem';
  if(asHost){if(S.online)NetDB.hub.report('trap',code);db.set(rp('m'),{host:DEV,hostName:S.name,st:'lobby',stage:0,target:15,cpu:S.online?0:2,scores:{},t:db.now()});db.dis(rp('m'));db.dis(rp('pk'));db.dis(rp('pl'));db.dis(rp('s'));
    if(S.online)S.pub=NetDB.lobby.publish('trap',code,{host:S.name,n:0,st:'lobby'});}
  S.L.push(db.on(rp('m'),'value',(k,v)=>onMeta(v)));

  S.L.push(db.on(rp('s'),'child_added',st),db.on(rp('s'),'child_changed',st));
  if(!asHost)setTimeout(()=>{if(S.code===code&&!S.seenMeta&&scr==='lobby')leaveRoom('部屋「'+code+'」が見つかりません。コードを確かめてください。');},5000);
  lobbyScreen();}

function onMeta(v){const prev=S.meta;S.meta=v;if(v)S.seenMeta=true;

function startGameView(v){G.active=true;buildStage(defFor(v));G.stage=G.def.key||G.def.name;G.rd=null;scr='game';ui.hidden=true;ui.innerHTML='';G.me={};G.arrows=[];G.parts=[];

function rebuildObjs(n,withCur){const objs=[];const rounds=Object.keys(S.places).map(Number).filter(r=>r<=n||(withCur&&r===n+1)).sort((a,b)=>a-b);
  for(const r of rounds){const pl=S.places[r]||{};for(const pid of Object.keys(pl).sort()){const p=pl[pid];if(!p||p.skip)continue;const it=ITEMS[p.ty];if(!it)continue;const sz=itemSize(p.ty,p.r);
      if(p.ty==='bomb'){for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(o.x<p.x+3&&o.x+o.w>p.x&&o.y<p.y+3&&o.y+o.h>p.y)objs.splice(i,1);}if(G.rd&&G.rd.ph!=='place'||r<=n){}continue;}

function customDef(c){const base=STAGES[c.theme||0];return Object.assign({},base,{name:c.name||'自作ステージ',custom:1,solid:[],spikes:[],grid:c.rle,start:c.start,goal:c.goal,lava:c.lava||0,water:base.water,key:'c'+hashStr(c.rle+c.start+c.goal+c.theme+c.lava)});}

// 自作ステージのマス目を短い文字列にする：「種類＋個数(36進)＋;」の連続
function rleEnc(g){let o='',c=g[0],n=0;for(let i=0;i<=g.length;i++){if(i<g.length&&g[i]===c){n++;continue;}o+=c+n.toString(36)+';';if(i<g.length){c=g[i];n=1;}}return o;}

function myPick(pid){const rd=G.rd;if(!rd)return-1;const pk=(S.picks[rd.n]||{});const mine=pk[pid];if(!mine)return-1;

function newOffer(n,seed,cnt){const R=rng(seed);const out=[];const tot=ITEM_KEYS.reduce((a,k)=>a+ITEMS[k].wt,0);

  while(out.length<cnt){let r=R()*tot;for(const k of ITEM_KEYS){r-=ITEMS[k].wt;if(r<=0){out.push(k);break;}}}
  for(let i=out.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function hostStart(){const db=S.db,m=S.meta;const humans=Object.entries(S.players).filter(([,p])=>!p.cpu).sort((a,b)=>(a[1].t||0)-(b[1].t||0)).slice(0,4);

function hostStep(){const db=S.db,m=S.meta;if(!S.host||!m||m.st!=='game'||!m.rd||!m.rd.offer)return;const rd=m.rd,now=db.now(),order=m.order;const el=(now-rd.t0)/1000;

const PH={G:62,JUMP:17.2,MAXV:8.6,ACC:75,AIR:48,FRIC:70,PW:.62,PH:.82,WJX:9.5,WJY:16,SLIDE:4.2,FALL:26,SPRING:26};
function solidCell(x,y){if(x<0||x>=COLS)return true;if(y<0||y>=ROWS)return false;const g=G.grid[y*COLS+x];if(g)return true;const o=G.og[y*COLS+x];if(!o)return false;const ob=G.objs[o-1];if(ob.ty==='crumble'&&G.crumb[ob.id]&&G.crumb[ob.id].gone)return false;return true;}

function boxHits(l,t,r,b){for(let y=Math.floor(t);y<=Math.floor(b-1e-6);y++)for(let x=Math.floor(l);x<=Math.floor(r-1e-6);x++)if(solidCell(x,y))return{x,y};return null;}
function runT(){return(S.db.now()-G.rd.t0)/1000;}
function stepPlayer(pid,p,inp,dt,t){if(p.st)return;const hw=PH.PW/2;

function drawChar(c,ch,x,y,s,f,an,gr,vy,col,label,alpha){c.save();if(alpha!=null)c.globalAlpha=alpha;c.translate(x,y);const lw=Math.max(1.4,s*.08);c.lineJoin='round';c.lineWidth=lw;c.strokeStyle=INK;

  h(`<div class="wrap" style="max-width:560px"><h2>${esc(nameOf(m.win))} の勝ち！</h2><div class="panel"><canvas width="240" height="200" id="wc" style="display:block;margin:0 auto;width:160px"></canvas>
   <table class="sc">${ord.map((p,i)=>`<tr><td>${i+1}</td><td style="color:${colorOf(p)}">${esc(nameOf(p))}</td><td style="text-align:right">${m.scores[p]||0}点</td></tr>`).join('')}</table></div>
   <div class="row">${S.host?`<button class="btn big on" data-nav data-a="again">もう一度（同じメンバー）</button>`:`<span class="hint">ホストが次を選ぶのを待っています。</span>`}<button class="btn ghost" data-nav data-back>${S.online?'部屋を出る':'タイトルへ'}</button></div></div>`);
  const c=ui.querySelector('#wc').getContext('2d');drawChar(c,CHARS[charOf(m.win)],120,185,130,1,0,true,0);
  const a=ui.querySelector('[data-a=again]');if(a)a.onclick=()=>{for(const pid in S.players){if(S.players[pid].cpu)S.db.remove(rp('p/'+pid));else S.db.update(rp('p/'+pid),{ok:false});}S.db.update(rp('m'),{st:'lobby',rd:null,last:null,win:null});if(S.pub)S.pub.update({st:'lobby'});};
  ui.querySelector('[data-back]').onclick=()=>leaveRoom('');}
function pauseMenu(){G.menu=true;scr='pause';for(const k in devs){devs[k].pst=false;devs[k].pb=false;devs[k].pa=false;}h(`<div class="wrap" style="max-width:420px"><h2>メニュー</h2><p class="hint">メニュー中もゲームは止まりません。</p><div class="menu"><button class="btn big" data-nav data-back>つづける</button><button class="btn big" data-nav data-a="q">${S.online?'部屋を出る':'タイトルへ'}</button><button class="btn" data-nav data-a="home">ゲーム一覧（ホーム）へ</button></div></div>`);
  ui.querySelector('[data-back]').onclick=()=>{G.menu=false;scr='game';ui.hidden=true;ui.innerHTML='';};ui.querySelector('[data-a=q]').onclick=()=>{G.menu=false;leaveRoom('');};ui.querySelector('[data-a=home]').onclick=()=>{try{leaveRoom('')}catch(e){}location.href=(window.NetDB?NetDB.hub.home():'index.html')};}
// ============ ステージづくり ============
const ED={grid:null,start:[1,17],goal:[44,14],lava:0,theme:0,name:'',id:'',tool:'g',msg:'',ver:0,built:-1,down:false};
function loadCustom(){try{const a=JSON.parse(localStorage.getItem('wn_custom')||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}}
function saveCustom(a){try{localStorage.setItem('wn_custom',JSON.stringify(a.slice(0,12)));return true;}catch(e){return false;}}
function edData(){return{id:ED.id,name:ED.name||'自作ステージ',theme:ED.theme,rle:rleEnc(ED.grid),start:ED.start.slice(),goal:ED.goal.slice(),lava:ED.lava};}
function editList(){S.testRun=false;scr='editlist';G.active=false;edUI(false);const L=loadCustom();
  h(`<div class="wrap" style="max-width:640px"><h2>ステージをつくる</h2>
   <div class="menu"><button class="btn big on" data-nav data-a="new">新しくつくる<small>「はらっぱ」をもとに作り始めます</small></button>
   ${L.map((c,i)=>`<div class="btn" style="cursor:default"><b>${esc(c.name)}</b><span class="row"><button class="btn" data-nav data-ed="${i}" style="padding:6px 12px">なおす</button><button class="btn" data-nav data-del="${i}" style="padding:6px 12px">消す</button></span></div>`).join('')}</div>
   <p class="hint">作ったステージはこの端末に保存されます（12個まで）。オンラインでは、ホストが選ぶとみんなに届きます。</p>
   <div class="row"><button class="btn ghost" data-nav data-back>もどる</button></div></div>`);
  ui.querySelector('[data-back]').onclick=titleScreen;ui.querySelector('[data-a=new]').onclick=()=>openEditor(null);
  ui.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>openEditor(L[+b.dataset.ed]));
  ui.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const c=L[+b.dataset.del];if(confirm('「'+c.name+'」を消しますか？')){L.splice(+b.dataset.del,1);saveCustom(L);editList();}});}
function openEditor(c,keep){if(!keep){if(c){ED.grid=rleDec(c.rle);ED.start=c.start.slice();ED.goal=c.goal.slice();ED.lava=c.lava||0;ED.theme=c.theme||0;ED.name=c.name;ED.id=c.id;}
    else{buildStage(STAGES[0]);ED.grid=G.grid.slice();ED.start=STAGES[0].start.slice();ED.goal=STAGES[0].goal.slice();ED.lava=0;ED.theme=0;ED.name='';ED.id='s'+Date.now().toString(36);}}
  ED.msg=keep?'ためし走りおわり。':'';ED.ver++;scr='edit';G.active=false;ui.hidden=true;ui.innerHTML='';touchEl.hidden=true;edUI(true);}
const ED_TOOLS=[['g','地面'],['s','トゲ'],['e','消す'],['st','スタート'],['go','ゴール']];
function edUI(on){const el=document.getElementById('ed');if(!el)return;if(!on&&el.contains(document.activeElement))document.activeElement.blur();el.hidden=!on;if(!on)return;
  el.innerHTML=ED_TOOLS.map(([k,n])=>`<button data-t="${k}" class="${ED.tool===k?'on':''}">${n}</button>`).join('')+
    `<button data-x="lava">${ED.lava?(STAGES[ED.theme].water?'水':'溶岩')+'：'+(ROWS-ED.lava)+'段':'溶岩・水：なし'}</button><button data-x="theme">見た目：${STAGES[ED.theme].name}</button>`+
    `<input id="edn" maxlength="12" placeholder="ステージの名前" value="${esc(ED.name)}"><button data-x="test">ためしに走る</button><button data-x="save">保存</button><button data-x="back">もどる</button><span class="msg">${esc(ED.msg)}</span>`;
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ED.tool=b.dataset.t;ED.msg={st:'スタートの「地面」をタップ',go:'ゴールの「地面」をタップ'}[ED.tool]||'';edUI(true);});
  const nm=el.querySelector('#edn');nm.oninput=()=>{ED.name=nm.value.slice(0,12);};nm.addEventListener('keydown',e=>e.stopPropagation());
  el.querySelector('[data-x=lava]').onclick=()=>{const L=[0,24,22,20];ED.lava=L[(L.indexOf(ED.lava)+1)%L.length];ED.ver++;edUI(true);};
  el.querySelector('[data-x=theme]').onclick=()=>{ED.theme=(ED.theme+1)%STAGES.length;ED.ver++;edUI(true);};
  el.querySelector('[data-x=save]').onclick=()=>{const bad=edCheck();if(bad){ED.msg=bad;edUI(true);return;}const L=loadCustom();const d=edData();const i=L.findIndex(c=>c.id===d.id);if(i>=0)L[i]=d;else{if(L.length>=12){ED.msg='12個までです。いらないステージを消してください。';edUI(true);return;}L.unshift(d);}ED.msg=saveCustom(L)?'保存しました':'保存できませんでした';sfx('ok');edUI(true);};
  el.querySelector('[data-x=test]').onclick=()=>{const bad=edCheck();if(bad){ED.msg=bad;edUI(true);return;}edTest();};
  el.querySelector('[data-x=back]').onclick=()=>{edUI(false);editList();};}
function edCheck(){const g=ED.grid,at=(x,y)=>x<0||x>=COLS||y<0||y>=ROWS?0:g[y*COLS+x];
  if(at(ED.start[0],ED.start[1]+1)!==1)return'スタートの下が地面になっていません。';if(at(ED.goal[0],ED.goal[1]+1)!==1)return'ゴールの下が地面になっていません。';
  if(at(ED.start[0],ED.start[1])||at(ED.goal[0],ED.goal[1]))return'スタートかゴールの場所がブロックでふさがっています。';if(ED.lava&&ED.start[1]+1>=ED.lava)return'スタートが溶岩・水の中です。';return'';}
function edTest(){edUI(false);S.testRun=true;const db=MEMDB||(MEMDB=dbTree(null));openRoom(db,'T'+Math.random().toString(36).slice(2,6),true);
  setTimeout(()=>{S.db.update(rp('m'),{stage:-1,custom:edData(),cpu:0});addLocal(matchMedia('(pointer:coarse)').matches?'touch':'kb1');
    setTimeout(()=>{for(const pid in S.local)S.db.update(rp('p/'+pid),{ok:true});setTimeout(()=>{if(S.testRun)hostStart();},60);},60);},60);}
function edCell(e){return[Math.floor((e.clientX*DPR-OX)/CS),Math.floor((e.clientY*DPR-OY)/CS)];}
function edPaint(e){const[x,y]=edCell(e);if(x<0||y<0||x>=COLS||y>=ROWS)return;const t=ED.tool;
  if(t==='st'||t==='go'){if(ED.grid[y*COLS+x]!==1){ED.msg='地面のマスをタップしてください';edUI(true);return;}const pt=[x,y-1];if(t==='st')ED.start=pt;else ED.goal=pt;ED.msg='';edUI(true);ED.ver++;sfx('ui');return;}
  const v=t==='g'?1:t==='s'?2:0;if(ED.grid[y*COLS+x]!==v){ED.grid[y*COLS+x]=v;ED.ver++;}}
cv.addEventListener('pointerdown',e=>{if(scr!=='edit')return;ED.down=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}edPaint(e);});
cv.addEventListener('pointermove',e=>{ED.hover=edCell(e);if(scr==='edit'&&ED.down&&ED.tool!=='st'&&ED.tool!=='go')edPaint(e);});
addEventListener('pointerup',()=>{ED.down=false;});
function drawEditor(c,t){if(ED.built!==ED.ver||!G.bg){if(ED.built!==ED.ver){buildStage(customDef(edData()));G.stage=G.def.key;ED.built=ED.ver;}G.bg=buildBg(G.def);G.bgFor=G.stage+'/'+cv.width+'/'+cv.height;}
  if(G.bgFor!==G.stage+'/'+cv.width+'/'+cv.height){G.bg=buildBg(G.def);G.bgFor=G.stage+'/'+cv.width+'/'+cv.height;}c.drawImage(G.bg,0,0);
  c.save();c.translate(OX,OY);drawFlag(c,t);drawLava(c,t);c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1;c.beginPath();for(let x=0;x<=COLS;x++){c.moveTo(x*CS,0);c.lineTo(x*CS,ROWS*CS);}for(let y=0;y<=ROWS;y++){c.moveTo(0,y*CS);c.lineTo(COLS*CS,y*CS);}c.stroke();
  drawChar(c,CHARS[0],(ED.start[0]+.5)*CS,(ED.start[1]+1)*CS,CS*1.15,1,t*2,true,0,'#e2483b','スタート');
  if(ED.hover){const[x,y]=ED.hover;if(x>=0&&y>=0&&x<COLS&&y<ROWS){c.strokeStyle='#ffc93c';c.lineWidth=Math.max(2,CS*.1);c.strokeRect(x*CS,y*CS,CS,CS);}}
  c.restore();txt(c,'ドラッグで地面・トゲを描く。スタートとゴールは地面をタップ',cv.width/2,OY+CS*.8,Math.max(12,CS*.55),'#fff');}
// ============ main loop ============
let lastTs=0,autoT=0;
function frame(ts){try{frame1(ts);}catch(e){console.error(e);if(!frame.err){frame.err=1;setTimeout(()=>{throw e;});}}requestAnimationFrame(frame);}
function frame1(ts){const dt=Math.min(.1,(ts-lastTs)/1000||0);lastTs=ts;readDevs();const t=ts/1000;
  if(G.active&&S.meta&&(S.meta.st==='game')){if(!G.menu){for(const pid in S.local){const d=devOf(pid);if(d&&d.pst){pauseMenu();break;}}}gameTick(dt);}
  if(scr==='lobby')lobbyInput();
  if(scr!=='game')navStep();
  render(t,dt);}
resize();titleScreen();if(QS.get('room'))onlineScreen();else if(NetDB.hub.isHost&&NetDB.hub.code)setTimeout(()=>{onlineScreen();const b=ui.querySelector('[data-a=make]');if(b)b.click()},300);requestAnimationFrame(frame);
window.__w={S,G,openRoom,dbTree,hostStart,STAGES,ITEMS,get scr(){return scr;},canPlace,rp};
</script>
</body></html>
